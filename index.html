:.92}\n  nav.inner{position:sticky;top:0;z-index:20;background:rgba(15,5,32,.86);backdrop-filter:blur(14px);\n    border-bottom:1px solid var(--line);padding:11px 0;margin-bottom:12px}\n  .pills{display:flex;gap:8px;overflow-x:auto;padding:0 18px;max-width:680px;margin:0 auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}\n  .pills::-webkit-scrollbar{display:none}\n  .pill{flex:0 0 auto;border:1px solid var(--line);background:var(--mist);color:var(--text-soft);\n    font-family:var(--sans);font-size:13.5px;font-weight:400;padding:9px 17px;border-radius:100px;\n    cursor:pointer;transition:.25s;white-space:nowrap;letter-spacing:.02em}\n  .pill:hover{color:var(--text);border-color:var(--gold-line)}\n  .pill.active{background:linear-gradient(135deg,rgba(251,191,36,.22),rgba(192,132,252,.18));\n    color:var(--gold-soft);border-color:var(--gold-line);font-weight:500;box-shadow:0 4px 18px rgba(251,191,36,.18)}\n  section{display:none;animation:fade .45s ease}\n  section.active{display:block}\n  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n  .lead{font-family:var(--serif);font-size:22px;font-weight:400;line-height:1.4;margin:22px 0 6px;color:var(--cream)}\n  .lead.it{font-style:italic}\n  .lead em{font-style:italic;color:var(--rose)}\n  .sub{color:var(--text-dim);font-size:15px;margin-bottom:20px;line-height:1.65}\n  p.body{margin:0 0 14px;color:var(--text-soft)}\n  .small{font-size:13.5px;color:var(--text-dim);line-height:1.6}\n  .card{background:linear-gradient(145deg,rgba(124,58,237,.12) 0%,rgba(74,38,112,.15) 100%);\n    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);\n    border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:14px;position:relative;overflow:hidden}\n  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;\n    background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.45}\n  .card h3{font-family:var(--serif);font-weight:500;font-size:20px;margin-bottom:8px;color:var(--cream)}\n  .card.pick{cursor:pointer;transition:.25s}\n  .card.pick:hover{border-color:var(--gold-line);transform:translateY(-2px)}\n  .card.pick::after{content:'\u2726';position:absolute;top:16px;right:20px;color:var(--gold);opacity:.4;font-size:14px}\n  .kicker{display:inline-block;font-family:var(--serif);font-style:italic;font-size:11px;\n    letter-spacing:.25em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:11px}\n  .kicker::before{content:'\u2726  '}\n  label{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);\n    margin:16px 0 7px;font-weight:500}\n  textarea,input[type=text]{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--mist-strong);\n    color:var(--text);font-family:var(--sans);font-size:15px;border-radius:13px;padding:13px 15px;\n    resize:vertical;transition:.2s;font-weight:300;line-height:1.5}\n  textarea{min-height:80px}\n  textarea:focus,input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(251,191,36,.12);background:rgba(0,0,0,.4)}\n  textarea::placeholder,input::placeholder{color:var(--text-dim);opacity:.7}\n  .btn{display:inline-flex;align-items:center;gap:8px;\n    background:linear-gradient(135deg,var(--gold-soft) 0%,var(--gold) 100%);\n    border:none;color:var(--deep);font-family:var(--sans);font-weight:600;font-size:14px;\n    padding:12px 22px;border-radius:100px;cursor:pointer;transition:.25s;margin-top:6px;\n    letter-spacing:.05em;box-shadow:0 4px 18px rgba(251,191,36,.28)}\n  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(251,191,36,.4)}\n  .btn:active{transform:scale(.97)}\n  .btn.ghost{background:transparent;color:var(--gold-soft);border:1px solid var(--gold-line);box-shadow:none;font-weight:500}\n  .btn.ghost:hover{background:rgba(251,191,36,.08)}\n  .chips{display:flex;flex-wrap:wrap;gap:9px;margin:8px 0 4px}\n  .chip{border:1px solid var(--line);background:var(--mist);color:var(--text-soft);\n    font-family:var(--sans);font-size:14px;padding:9px 15px;border-radius:100px;cursor:pointer;transition:.2s}\n  .chip:hover{border-color:var(--gold-line);color:var(--text)}\n  .chip.on{background:rgba(251,191,36,.18);color:var(--gold-soft);border-color:var(--gold);font-weight:500}\n  .out{background:linear-gradient(135deg,rgba(251,191,36,.10),rgba(124,58,237,.12));\n    border:1px solid var(--gold-line);border-radius:16px;padding:18px 20px;margin-top:18px;\n    font-size:15.5px;line-height:1.65;color:var(--text-soft);display:none}\n  .out.show{display:block;animation:fade .5s ease}\n  .out .em{font-family:var(--serif);font-style:italic;color:var(--gold-soft);font-size:18px}\n  details{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:var(--radius);\n    margin-bottom:12px;overflow:hidden;transition:border-color .25s}\n  details[open]{border-color:var(--gold-line);background:rgba(124,58,237,.10)}\n  summary{list-style:none;cursor:pointer;padding:18px 20px;font-family:var(--serif);font-size:18px;\n    font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--cream)}\n  summary::-webkit-details-marker{display:none}\n  summary .plus{color:var(--gold);font-size:22px;transition:.3s;flex:0 0 auto;line-height:1}\n  details[open] summary .plus{transform:rotate(45deg)}\n  .det-body{padding:0 20px 22px;color:var(--text-soft);font-size:15px;line-height:1.7}\n  .det-body strong{color:var(--cream);font-weight:500}\n  .det-body p{margin-bottom:12px}\n  .step{margin:10px 0;padding-left:18px;position:relative;color:var(--text-soft)}\n  .step::before{content:'\u2726';position:absolute;left:0;top:1px;color:var(--gold);font-size:11px}\n  .step strong{color:var(--cream);font-weight:500}\n  .case-flow > div{margin:12px 0;padding:14px 16px;background:rgba(0,0,0,.22);border-radius:12px;border-left:2px solid var(--gold)}\n  .case-flow .lbl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);\n    font-weight:500;display:block;margin-bottom:5px;font-family:var(--serif);font-style:italic}\n  .timer{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}\n  .timer .clock{font-family:var(--serif);font-size:28px;color:var(--gold-soft);min-width:78px}\n  .divider{text-align:center;margin:30px 0;color:var(--gold);opacity:.45;letter-spacing:1.5em;font-size:11px}\n  .wink{color:var(--rose);font-style:italic}\n  footer{text-align:center;color:var(--text-dim);font-size:13px;margin-top:34px;padding:0 18px;font-style:italic;font-family:var(--serif)}\n  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);\n    background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#2a1a05;\n    padding:12px 22px;border-radius:100px;font-weight:600;font-size:14px;opacity:0;\n    transition:.35s cubic-bezier(.2,.8,.2,1);z-index:50;pointer-events:none;box-shadow:0 8px 26px rgba(251,191,36,.4)}\n  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}\n<\/style>\n<\/head>\n<body>\n<script>window.__WORLD_PREFIX__='kompas';<\/script>\n<script>\n(function(){\n  const WORLD = window.__WORLD_PREFIX__ || 'x';\n  const parent = window.parent;\n  let reqId = 0;\n  const pending = {};\n  function call(op, key, value){\n    return new Promise((resolve)=>{\n      const id = ++reqId; pending[id] = resolve;\n      parent.postMessage({ __storageBridge:true, id, op, world:WORLD, key, value }, '*');\n    });\n  }\n  window.addEventListener('message', (e)=>{\n    const d = e.data;\n    if(d && d.__storageBridgeReply && pending[d.id]){ pending[d.id](d.result); delete pending[d.id]; }\n  });\n  window.storage = {\n    get:(key)=>call('get',key), set:(key,v)=>call('set',key,v),\n    delete:(key)=>call('delete',key), list:(prefix)=>call('list',prefix||''),\n  };\n  const cache={};\n  try{ if(window.__INITIAL_CACHE__) Object.assign(cache,window.__INITIAL_CACHE__);}catch(e){}\n  window.__primeCache=function(obj){Object.assign(cache,obj||{})};\n  try{\n    Object.defineProperty(window,'localStorage',{\n      configurable:true,\n      value:{\n        getItem(k){return (k in cache)?cache[k]:null},\n        setItem(k,v){cache[k]=String(v);call('lset',k,String(v))},\n        removeItem(k){delete cache[k];call('ldel',k)},\n        clear(){for(const k in cache)delete cache[k];call('lclear')},\n        key(i){return Object.keys(cache)[i]||null},\n        get length(){return Object.keys(cache).length}\n      }\n    });\n  }catch(e){}\n  parent.postMessage({__storageBridge:true,op:'ready',world:WORLD},'*');\n})();\n<\/script>\n\n<div class=\"stars\" id=\"stars\"><\/div>\n\n<header>\n  <div class=\"moon\"><\/div>\n  <div class=\"eyebrow\">The Compass<\/div>\n  <h1>What does <em>your longing whisper?<\/em><\/h1>\n  <p class=\"tag\">A soft compass for under the stars \u2014 for when you want something, miss something, or don't yet know what. Nothing must. Just listen to what's already stirring in you.<\/p>\n<\/header>\n\n<nav class=\"inner\">\n  <div class=\"pills\">\n    <button class=\"pill active\" data-s=\"start\">\u2726 Start<\/button>\n    <button class=\"pill\" data-s=\"discover\">Discover<\/button>\n    <button class=\"pill\" data-s=\"clarify\">Clarify<\/button>\n    <button class=\"pill\" data-s=\"act\">Act<\/button>\n    <button class=\"pill\" data-s=\"practice\">Practice<\/button>\n    <button class=\"pill\" data-s=\"stories\">Stories<\/button>\n    <button class=\"pill\" data-s=\"stuck\">Stuck?<\/button>\n  <\/div>\n<\/nav>\n\n<div class=\"wrap\">\n\n  <section id=\"start\" class=\"active\">\n    <p class=\"lead it\">Begin exactly where you are.<\/p>\n    <p class=\"sub\">Tap whatever feels closest. You can always switch paths \u2014 only you can see.<\/p>\n    <div class=\"card pick\" data-go=\"clarify\">\n      <span class=\"kicker\">Path I<\/span>\n      <h3>I sort of know what I want<\/h3>\n      <p class=\"body\">Good. We'll make it crystal clear, and see how your magnet attunes to it \u2014 not just <em style=\"color:var(--rose);font-style:italic\">what<\/em> you wish.<\/p>\n    <\/div>\n    <div class=\"card pick\" data-go=\"discover\">\n      <span class=\"kicker\">Path II<\/span>\n      <h3>I'm missing something, but don't know what<\/h3>\n      <p class=\"body\">The longing is already whispering \u2014 you just haven't heard it out loud. We'll listen together.<\/p>\n    <\/div>\n    <div class=\"card pick\" data-go=\"stuck\">\n      <span class=\"kicker\">Path III<\/span>\n      <h3>I want something, but it just isn't happening<\/h3>\n      <p class=\"body\">Something in you is holding something back. We'll find it together, without judgment \u2014 only with light.<\/p>\n    <\/div>\n    <div class=\"divider\">\u2726 \u2726 \u2726<\/div>\n    <p class=\"small\">Everything you type below stays safe inside your own Aurora. <span class=\"wink\">No one needs to see your dreams except you and the stars.<\/span><\/p>\n  <\/section>\n\n  <section id=\"discover\">\n    <p class=\"lead it\">What you miss already whispers a name.<\/p>\n    <p class=\"sub\">You feel something chafing, but not <em>what<\/em>. Natural \u2014 longing rarely arrives neatly labeled. We'll let it surface gently.<\/p>\n    <div class=\"card\">\n      <span class=\"kicker\">Ritual \u00b7 Longing radar<\/span>\n      <h3>Where does it feel full, and where empty?<\/h3>\n      <p class=\"body\">Tap each area until it fits: <strong style=\"color:var(--cream)\">empty<\/strong>, <strong style=\"color:var(--cream)\">okay<\/strong> or <strong style=\"color:var(--cream)\">full<\/strong>. Don't think, just feel.<\/p>\n      <div class=\"chips\" id=\"radar\"><\/div>\n      <button class=\"btn\" id=\"radarBtn\">Show my trail<\/button>\n      <div class=\"out\" id=\"radarOut\"><\/div>\n    <\/div>\n    <div class=\"card\">\n      <span class=\"kicker\">Going deeper<\/span>\n      <h3>Three questions that sharpen the trail<\/h3>\n      <p class=\"body\">One at a time. Answer briefly, honestly, from your gut.<\/p>\n      <div id=\"discQ\"><\/div>\n      <button class=\"btn\" id=\"discNext\">Next question<\/button>\n      <div class=\"out\" id=\"discOut\"><\/div>\n    <\/div>\n    <p class=\"small\">Done? Read your answers back and notice the word that keeps returning. That's the whisper of your compass. Bring it to <strong style=\"color:var(--gold);cursor:pointer\" onclick=\"goTo('clarify')\">Clarify \u2726<\/strong>.<\/p>\n  <\/section>\n\n  <section id=\"clarify\">\n    <p class=\"lead it\">Under every wish sleeps a feeling.<\/p>\n    <p class=\"sub\">What you name is often not what you're actually seeking. We'll dig a few layers \u2014 not to take your wish away, but to lift it to its real shape.<\/p>\n    <div class=\"card\">\n      <span class=\"kicker\">Ritual \u00b7 The why-ladder<\/span>\n      <h3>What do you want, and why <em>really?<\/em><\/h3>\n      <label>I want\u2026<\/label>\n      <input type=\"text\" id=\"wish\" data-save=\"wish\" placeholder=\"e.g. a new job, more money, a relationship, rest\u2026\">\n      <button class=\"btn\" id=\"whyBtn\">Ask deeper: why?<\/button>\n      <div id=\"whyChain\"><\/div>\n      <div id=\"feelBlock\" style=\"display:none\">\n        <label>And if you're really honest \u2014 what feeling are you seeking underneath?<\/label>\n        <div class=\"chips\" id=\"feelChips\"><\/div>\n        <button class=\"btn\" id=\"reframeBtn\">Turn it into my intention \u2726<\/button>\n      <\/div>\n      <div class=\"out\" id=\"reframeOut\"><\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"act\">\n    <p class=\"lead it\">Longing points the direction \u2014 feet walk the path.<\/p>\n    <p class=\"sub\">Don't push hard, don't pray to a postman in the clouds. Do: feel, choose, and take small actions that confirm the direction. Magic loves small, honest steps.<\/p>\n    <div class=\"card\">\n      <span class=\"kicker\">Step 1 \u00b7 Small<\/span>\n      <h3>The very smallest step<\/h3>\n      <p class=\"body\">Not the big leap. The two-minute step you can take <em style=\"color:var(--rose);font-style:italic\">today<\/em>. An email. A search. One message.<\/p>\n      <label>My 2-minute step for today<\/label>\n      <textarea data-save=\"step\" placeholder=\"Today I will\u2026\"><\/textarea>\n    <\/div>\n    <div class=\"card\">\n      <span class=\"kicker\">Step 2 \u00b7 The brake<\/span>\n      <h3>What's holding you back?<\/h3>\n      <p class=\"body\">Write it down \u2014 it shrinks. Usually it's fear, shame, or the idea you don't deserve it. All bearable, once you see them.<\/p>\n      <label>What's stopping me, and is that true or just a habit?<\/label>\n      <textarea data-save=\"brake\" placeholder=\"I think that\u2026 but actually\u2026\"><\/textarea>\n    <\/div>\n    <div class=\"card\">\n      <span class=\"kicker\">Step 3 \u00b7 The mirror<\/span>\n      <h3>Who already has this?<\/h3>\n      <p class=\"body\">Know someone who already is or has this? Not to envy \u2014 to learn from. What do they do or think differently? Pick one thing you can copy today.<\/p>\n      <label>One thing I'll take from them<\/label>\n      <textarea data-save=\"mirror\" placeholder=\"They do\u2026, so I'll try\u2026\"><\/textarea>\n    <\/div>\n    <div class=\"card\">\n      <span class=\"kicker\">Step 4 \u00b7 Daily<\/span>\n      <h3>Your mini-ritual (1 minute)<\/h3>\n      <div class=\"step\">Close your eyes briefly and <strong>feel<\/strong> how it is when it's already here. Not the stuff \u2014 the feeling.<\/div>\n      <div class=\"step\">Name one concrete gratitude from today. Out loud. Yes, really out loud \u2014 the stars may listen in.<\/div>\n      <div class=\"step\">Take your 2-minute step. That's the whole ritual. <span class=\"wink\">Candles welcome, never required.<\/span><\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"practice\">\n    <p class=\"lead it\">Don't read \u2014 experience.<\/p>\n    <p class=\"sub\">Short exercises to <em>do<\/em>. Some with a timer so you don't have to watch the clock. Pick one you dare right now.<\/p>\n    <details>\n      <summary>2-minute visualisation <span class=\"plus\">+<\/span><\/summary>\n      <div class=\"det-body\">\n        <p>Close your eyes and step into an ordinary day where you have what you want. Not the big scene \u2014 the small. How you wake up. What you think first. How your shoulders sit. Feel it, smell it, hear it.<\/p>\n        <div class=\"timer\"><span class=\"clock\" data-t=\"120\">2:00<\/span><button class=\"btn ghost t-start\">Start<\/button><\/div>\n      <\/div>\n    <\/details>\n    <details>\n      <summary>Gratitude sprint <span class=\"plus\">+<\/span><\/summary>\n      <div class=\"det-body\">\n        <p>One minute, as many things as you can name that you're grateful for. Out loud or on paper. Small counts: coffee, a couch, that your legs work. Gratitude is the fastest key to lift you out of lack-mode.<\/p>\n        <div class=\"timer\"><span class=\"clock\" data-t=\"60\">1:00<\/span><button class=\"btn ghost t-start\">Start<\/button><\/div>\n      <\/div>\n    <\/details>\n    <details>\n      <summary>One day \"as if\" <span class=\"plus\">+<\/span><\/summary>\n      <div class=\"det-body\">\n        <p>Pick one day and live it as if you already are who you want to be. Not pretending \u2014 but: how would that version of you approach this one day? How does she walk into a room? What does she stop saying yes to? It's a one-day experiment.<\/p>\n        <div class=\"step\">Pick the day (tomorrow is fine)<\/div>\n        <div class=\"step\">Choose one behaviour that's different<\/div>\n        <div class=\"step\">Evening: what shifted in how you felt?<\/div>\n      <\/div>\n    <\/details>\n    <details>\n      <summary>Letter to yourself, six months from now <span class=\"plus\">+<\/span><\/summary>\n      <div class=\"det-body\">\n        <p>Write as if it's already half a year later and it went well. What happened? How does it feel? What are you glad you did back then? Your brain believes stories \u2014 give it a beautiful one.<\/p>\n        <textarea data-save=\"letter\" placeholder=\"Dear me, it's now six months from now and\u2026\"><\/textarea>\n      <\/div>\n    <\/details>\n    <details>\n      <summary>The fear-inversion <span class=\"plus\">+<\/span><\/summary>\n      <div class=\"det-body\">\n        <p>You often ask \"what if it goes wrong?\". Flip it once: <strong>what if it actually works?<\/strong> What would you have to let go of, dare, or admit you deserve? Sometimes fear isn't of failing, but of succeeding.<\/p>\n        <textarea data-save=\"fear\" placeholder=\"If it actually works, then\u2026\"><\/textarea>\n      <\/div>\n    <\/details>\n    <details>\n      <summary>The let-go note <span class=\"plus\">+<\/span><\/summary>\n      <div class=\"det-body\">\n        <p>Write on an actual scrap of paper one thing you want to release \u2014 a thought, a worry, an \"if only\". Tear it up, or keep it until you can. Letting go isn't failure; it's making room for something new to land.<\/p>\n        <div class=\"step\">Write: \"I release that\u2026\"<\/div>\n        <div class=\"step\">Read it once aloud<\/div>\n        <div class=\"step\">Tear it up. Feel the difference (or not \u2014 also fine)<\/div>\n      <\/div>\n    <\/details>\n  <\/section>\n\n  <section id=\"stories\">\n    <p class=\"lead it\">Mirrors in stories \u2014 do you recognise your own reflection?<\/p>\n    <p class=\"sub\">Real knots, worked out. Not as recipe, but as mirror. Read them with tea, candle, or under full moon \u2014 whatever fits.<\/p>\n    <details>\n      <summary>\"I want a different job, but don't know which\" <span class=\"plus\">+<\/span><\/summary>\n      <div class=\"det-body case-flow\">\n        <div><span class=\"lbl\">What it looks like<\/span>A career question. Which role, which sector, which course.<\/div>\n        <div><span class=\"lbl\">What it often is<\/span>Not \"which job\" but \"I don't feel seen / free / useful\". The job is the packaging; the feeling is the content.<\/div>\n        <div><span class=\"lbl\">The reframe<\/span>Don't search for a job title, search for a feeling: when was work last light? What were you doing? Look for jobs that give <em>that<\/em> feeling, not ones that look good on LinkedIn.<\/div>\n        <div><span class=\"lbl\">First step<\/span>This week, talk to one person doing work you secretly admire. No application \u2014 just curiosity.<\/div>\n      <\/div>\n    <\/details>\n    <details>\n      <summary>\"I feel lonely, but don't know what I'm missing\" <span class=\"plus\">+<\/span><\/summary>\n      <div class=\"det-body case-flow\">\n        <div><span class=\"lbl\">What it looks like<\/span>Too few people around you.<\/div>\n        <div><span class=\"lbl\">What it often is<\/span>Not too few people, but too little contact where you can be yourself. You can be lonely in a full room and not at all at home with one good friend.<\/div>\n        <div><span class=\"lbl\">The reframe<\/span>The question isn't \"how do I meet more people\", but \"around whom do I already feel a bit like myself \u2014 and how do I give <em>that<\/em> more attention?\"<\/div>\n        <div><span class=\"lbl\">First step<\/span>Send one message today to someone where it feels light. \"I was thinking of you.\" Nothing more.<\/div>\n      <\/div>\n    <\/details>\n    <details>\n      <summary>\"I want more money, but feel guilty about it\" <span class=\"plus\">+<\/span><\/summary>\n      <div class=\"det-body case-flow\">\n        <div><span class=\"lbl\">What it looks like<\/span>Greed, or \"not spiritual enough\".<\/div>\n        <div><span class=\"lbl\">What it often is<\/span>A perfectly ordinary, healthy wish to breathe freely, give, and not lie awake. The idea that you must switch off your ego to be allowed to want anything comes from one particular reading of spirituality \u2014 and it's not the only one.<\/div>\n        <div><span class=\"lbl\">The reframe<\/span>Money is energy \u2014 like breath or water. It may flow. Wanting it doesn't make you a bad person; it makes you someone who wants to take good care of yourself and others.<\/div>\n        <div><span class=\"lbl\">First step<\/span>Write down what you'd actually do with more money. Ten to one it's about freedom and care, not greed.<\/div>\n      <\/div>\n    <\/details>\n    <details>\n      <summary>\"I keep falling for the wrong ones\" <span class=\"plus\">+<\/span><\/summary>\n      <div class=\"det-body case-flow\">\n        <div><span class=\"lbl\">What it looks like<\/span>Bad luck in love.<\/div>\n        <div><span class=\"lbl\">What it often is<\/span>A pattern that pulls in what feels familiar \u2014 not what's healthy. We often pick what's familiar, even when it hurts.<\/div>\n        <div><span class=\"lbl\">The reframe<\/span>The question isn't \"where do I find a good one\", but \"what feeling do I seek with someone \u2014 and am I giving that to myself already?\" What you don't believe about your own worth, you'll see confirmed outside yourself.<\/div>\n        <div><span class=\"lbl\">First step<\/span>Make a short list: how do I want to feel around someone? Use it as compass, not the looks or the chemistry.<\/div>\n      <\/div>\n    <\/details>\n    <details>\n      <summary>\"I just don't know what I want with my life\" <span class=\"plus\">+<\/span><\/summary>\n      <div class=\"det-body case-flow\">\n        <div><span class=\"lbl\">What it looks like<\/span>A big, paralysing gap. Everyone seems to have a plan except you.<\/div>\n        <div><span class=\"lbl\">What it often is<\/span>The pressure to \"know it\". Nobody knows the whole picture \u2014 the people who look confident make it up as they go too.<\/div>\n        <div><span class=\"lbl\">The reframe<\/span>You don't have to know your whole life. Just the next interesting step. Direction emerges from moving, not from sitting still and waiting for inspiration.<\/div>\n        <div><span class=\"lbl\">First step<\/span>Do one thing this week that makes you curious. Not useful \u2014 curious. Follow that thread.<\/div>\n      <\/div>\n    <\/details>\n    <details>\n      <summary>\"I want so much I get paralysed and do nothing\" <span class=\"plus\">+<\/span><\/summary>\n      <div class=\"det-body case-flow\">\n        <div><span class=\"lbl\">What it looks like<\/span>Laziness or lack of discipline.<\/div>\n        <div><span class=\"lbl\">What it often is<\/span>Overwhelm. Seeing ten doors open at once isn't a luxury \u2014 it's paralysing. Your brain locks up under too many choices.<\/div>\n        <div><span class=\"lbl\">The reframe<\/span>You don't have to pick what's best for the rest of your life. Pick what attracts you most <em>now<\/em>, and give it two weeks. You may always switch.<\/div>\n        <div><span class=\"lbl\">First step<\/span>Cross out half your list today. Not because it's not allowed \u2014 to make air. <span class=\"wink\">The rest won't run away.<\/span><\/div>\n      <\/div>\n    <\/details>\n  <\/section>\n\n  <section id=\"stuck\">\n    <p class=\"lead it\">Getting stuck is part of every journey. Yours too.<\/p>\n    <p class=\"sub\">Tap what you recognise. No sermon \u2014 just a gentle nudge.<\/p>\n    <details>\n      <summary>\"I don't even know what I want\" <span class=\"plus\">+<\/span><\/summary>\n      <div class=\"det-body\"><p>No one knows that in one go. Don't start with \"what do I want\" but \"what do I <strong>not<\/strong> want anymore\". You usually know that flawlessly. Walk to <span style=\"color:var(--gold);cursor:pointer\" onclick=\"goTo('discover')\">Discover \u2726<\/span> and do the longing radar \u2014 it points the way.<\/p><\/div>\n    <\/details>\n    <details>\n      <summary>\"I want too much at once\" <span class=\"plus\">+<\/span><\/summary>\n      <div class=\"det-body\"><p>Longing isn't the problem; fragmentation is. Pick one. Not forever \u2014 for now. The other wishes don't evaporate if you take one seriously; they wait their turn.<\/p><\/div>\n    <\/details>\n    <details>\n      <summary>\"I don't believe I deserve it\" <span class=\"plus\">+<\/span><\/summary>\n      <div class=\"det-body\"><p>This is the silent interrupter for almost everyone. You don't have to deserve anything to be allowed to want it \u2014 a child doesn't have to earn love either. Start small: allow yourself one small thing this week without justifying it. Deserving is a habit of thought, not a fact of the universe.<\/p><\/div>\n    <\/details>\n    <details>\n      <summary>\"It's taking too long, I'm getting impatient\" <span class=\"plus\">+<\/span><\/summary>\n      <div class=\"det-body\"><p>Something that's growing, you don't see growing \u2014 that's why it feels like nothing is happening. Something is happening. Life has no track &amp; trace, and the stars keep their own clock. Focus on the step, not the arrival.<\/p><\/div>\n    <\/details>\n    <details>\n      <summary>\"I compare myself to everyone\" <span class=\"plus\">+<\/span><\/summary>\n      <div class=\"det-body\"><p>Someone else getting something doesn't take anything from you \u2014 happiness isn't a cake whose slices run out. Be glad for them, send them a message even, and think: \"if she can, I can too.\" That's the right frequency to step into yourself.<\/p><\/div>\n    <\/details>\n    <details>\n      <summary>\"I start things but never finish\" <span class=\"plus\">+<\/span><\/summary>\n      <div class=\"det-body\"><p>Maybe you start things you don't actually want to finish \u2014 that's information, not failure. But if it does matter: make your goal ridiculously small. Not \"I'll exercise\" but \"I'll put on my shoes\". Done is a feeling you train with tiny wins.<\/p><\/div>\n    <\/details>\n  <\/section>\n\n  <div class=\"divider\">\u2726 \u2726 \u2726<\/div>\n  <div style=\"text-align:center\">\n    <button class=\"btn\" id=\"saveBtn\">Save my answers<\/button>\n    <button class=\"btn ghost\" id=\"copyBtn\">Copy as text<\/button>\n    <button class=\"btn ghost\" id=\"clearBtn\">Clear all<\/button>\n    <p class=\"small\" style=\"margin-top:14px\">Your answers stay safe inside your own Aurora. Nothing goes anywhere.<\/p>\n  <\/div>\n\n  <footer>A compass, not an oracle. It points the way \u2014 the walking is yours. \u2726<\/footer>\n<\/div>\n\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\n(function(){\n  const c=document.getElementById('stars');\n  const n=window.innerWidth<600?38:65;\n  for(let i=0;i<n;i++){\n    const s=document.createElement('div');s.className='star';\n    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';\n    s.style.animationDelay=Math.random()*3+'s';\n    s.style.opacity=(Math.random()*0.7+0.2).toFixed(2);\n    const size=Math.random()*2+1;s.style.width=size+'px';s.style.height=size+'px';\n    c.appendChild(s);\n  }\n})();\n\n(function(){\n  function goTo(id){\n    document.querySelectorAll('section').forEach(function(s){s.classList.toggle('active',s.id===id)});\n    document.querySelectorAll('.pill').forEach(function(p){p.classList.toggle('active',p.dataset.s===id)});\n    window.scrollTo({top:0,behavior:'smooth'});\n  }\n  window.goTo=goTo;\n  document.querySelectorAll('.pill').forEach(function(p){p.addEventListener('click',function(){goTo(p.dataset.s)})});\n  document.querySelectorAll('.card.pick').forEach(function(c){c.addEventListener('click',function(){goTo(c.dataset.go)})});\n\n  const SECTION_MAP={start:'start',ontdekken:'discover',verhelderen:'clarify',doen:'act',oefenen:'practice',verhalen:'stories',vast:'stuck'};\n  window.addEventListener('message',function(e){\n    if(e.data && (e.data.__aurora||e.data.__maanlicht) && e.data.section){\n      try{ goTo(SECTION_MAP[e.data.section]||e.data.section);}catch(err){}\n    }\n  });\n\n  var toast=document.getElementById('toast');\n  function ping(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(function(){toast.classList.remove('show')},1900)}\n\n  var areas=['Work','Love','Friendship','Body','Money','Play & joy','Rest','Growth'];\n  var states=['','okay','full','empty'];\n  var radar=document.getElementById('radar'); var radarState={};\n  areas.forEach(function(a){\n    var b=document.createElement('button');b.className='chip';b.textContent=a;radarState[a]=0;\n    b.addEventListener('click',function(){\n      radarState[a]=(radarState[a]+1)%4;\n      var s=states[radarState[a]];\n      b.innerHTML=s?a+' \u00b7 '+s:a;\n      b.classList.toggle('on',radarState[a]===3);\n      b.style.color=radarState[a]===2?'var(--rose)':'';\n      b.style.borderColor=radarState[a]===2?'rgba(192,132,252,.5)':'';\n    });\n    radar.appendChild(b);\n  });\n  document.getElementById('radarBtn').addEventListener('click',function(){\n    var empty=areas.filter(function(a){return radarState[a]===3});\n    var full=areas.filter(function(a){return radarState[a]===2});\n    var out=document.getElementById('radarOut');var t='';\n    if(!empty.length && !full.length){t='Nothing tapped yet \u2014 tap the areas, the radar will point the way.';}\n    else{\n      if(empty.length) t+='<span class=\"em\">Here your longing whispers: '+empty.join(', ')+'.<\/span><br>That isn\\'t a judgment, it\\'s an address. Start with the area that itches most \u2014 not everything at once.';\n      else t+='No area feels truly empty \u2014 perhaps your longing isn\\'t in a gap, but in something you want to build out.';\n      if(full.length) t+='<br><br>And don\\'t forget: <strong>'+full.join(', ')+'<\/strong> already feels full. That\\'s your fuel. Draw from it.';\n    }\n    out.innerHTML=t;out.classList.add('show');\n  });\n\n  var dq=[\n    'When did you last feel truly alive? What were you doing \u2014 and with whom?',\n    'Who are you secretly a bit envious of? What does that person have or do that you want too? (Envy is a poor advisor but a fine compass.)',\n    'If judgment, money, and time didn\\'t exist for a moment \u2014 what would you do tomorrow?'\n  ];\n  var di=0;var discQ=document.getElementById('discQ');\n  function showQ(){\n    if(di>=dq.length){\n      document.getElementById('discNext').style.display='none';\n      var o=document.getElementById('discOut');\n      o.innerHTML='<span class=\"em\">Read your three answers back.<\/span><br>Which word or feeling keeps returning? That recurring word is your direction.';\n      o.classList.add('show');return;\n    }\n    var w=document.createElement('div');w.style.marginTop=di?'18px':'8px';\n    w.innerHTML='<label>'+(di+1)+'. '+dq[di]+'<\/label><textarea data-save=\"discover'+di+'\"><\/textarea>';\n    discQ.appendChild(w);\n    var ta=w.querySelector('textarea');hookSave(ta);ta.focus();di++;\n  }\n  showQ();\n  document.getElementById('discNext').addEventListener('click',showQ);\n\n  var whyN=0;var maxWhy=3;var chain=document.getElementById('whyChain');\n  var whyPrompts=['Why do you want that?','And why is <em>that<\/em> important to you?','And if you had that \u2014 what would that give you?'];\n  document.getElementById('whyBtn').addEventListener('click',function(){\n    var wish=document.getElementById('wish').value.trim();\n    if(!wish){ping('Fill in what you want first');return;}\n    if(whyN>=maxWhy){document.getElementById('feelBlock').style.display='block';return;}\n    var w=document.createElement('div');w.style.marginTop='14px';\n    w.innerHTML='<label>'+whyPrompts[whyN]+'<\/label><textarea data-save=\"why'+whyN+'\"><\/textarea>';\n    chain.appendChild(w);hookSave(w.querySelector('textarea'));w.querySelector('textarea').focus();\n    whyN++;\n    if(whyN>=maxWhy){\n      this.textContent='I\\'m there \u2014 show me the feeling \u2726';\n      document.getElementById('feelBlock').style.display='block';\n    } else {this.textContent='Ask one more layer';}\n  });\n  var feelings=['Freedom','Safety','Connection','Recognition','Rest','Joy','To matter','Pride','Love','Adventure'];\n  var fc=document.getElementById('feelChips');var chosenFeel='';\n  feelings.forEach(function(f){\n    var b=document.createElement('button');b.className='chip';b.textContent=f;\n    b.addEventListener('click',function(){\n      fc.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')});\n      b.classList.add('on');chosenFeel=f;\n    });\n    fc.appendChild(b);\n  });\n  document.getElementById('reframeBtn').addEventListener('click',function(){\n    var wish=document.getElementById('wish').value.trim()||'that';\n    if(!chosenFeel){ping('Pick a feeling first');return;}\n    var o=document.getElementById('reframeOut');\n    o.innerHTML='<span class=\"em\">You don\\'t so much want '+wish.toLowerCase()+' \u2014 you want to feel '+chosenFeel.toLowerCase()+'.<\/span><br>'+\n      '\"'+wish+'\" is one way to get there. A lovely one perhaps, but not the only one. That\\'s good news: it takes the pressure off that one form.<br><br>'+\n      '<strong>Your intention:<\/strong> \"I\\'m moving towards more '+chosenFeel.toLowerCase()+' in my life \u2014 '+wish.toLowerCase()+' can be a beautiful path there.\" Bring this to <span style=\"color:var(--gold);cursor:pointer\" onclick=\"goTo(\\'act\\')\">Act \u2726<\/span>.';\n    o.classList.add('show');\n  });\n\n  document.querySelectorAll('.t-start').forEach(function(btn){\n    var clock=btn.parentElement.querySelector('.clock');\n    var total=parseInt(clock.dataset.t,10);var left=total;var iv=null;\n    function fmt(s){var m=Math.floor(s/60);var r=s%60;return m+':'+(r<10?'0':'')+r}\n    btn.addEventListener('click',function(){\n      if(iv){clearInterval(iv);iv=null;left=total;clock.textContent=fmt(left);btn.textContent='Start';return;}\n      btn.textContent='Stop';\n      iv=setInterval(function(){\n        left--;clock.textContent=fmt(left);\n        if(left<=0){clearInterval(iv);iv=null;clock.textContent='Done \u2726';btn.textContent='Again';left=total;ping('Beautifully done \u2726');}\n /* ---------- opslagbrug parent-kant ---------- */
function wkey(w,k){return w+':'+k;}
async function handleBridge(world,op,key,value){
  try{
    if(op==='get')   return await window.storage.get(wkey(world,key));
    if(op==='set')   return await window.storage.set(wkey(world,key),value);
    if(op==='delete')return await window.storage.delete(wkey(world,key));
    if(op==='list'){ const r=await window.storage.list(wkey(world,key)); if(r&&r.keys){const p=world+':';r.keys=r.keys.map(k=>k.startsWith(p)?k.slice(p.length):k);} return r; }
    if(op==='lset')  return await window.storage.set(wkey(world,'ls:'+key),value);
    if(op==='ldel')  return await window.storage.delete(wkey(world,'ls:'+key));
    if(op==='lclear'){const r=await window.storage.list(world+':ls:');if(r&&r.keys)for(const k of r.keys){try{await window.storage.delete(k);}catch(e){}}return true;}
  }catch(e){return null;}
}
async function primeData(world){
  const out={};
  try{const r=await window.storage.list(world+':ls:');if(r&&r.keys)for(const k of r.keys){try{const v=await window.storage.get(k);if(v)out[k.slice((world+':ls:').length)]=v.value;}catch(e){}}}catch(e){}
  return out;
}
window.addEventListener('message', async (e)=>{
  const d=e.data; if(!d||!d.__storageBridge) return;
  if(d.op==='ready'){ const data=await primeData(d.world); if(e.source)e.source.postMessage({__cachePrimed:true},'*'); return; }
  const result=await handleBridge(d.world,d.op,d.key,d.value);
  if(e.source) e.source.postMessage({__storageBridgeReply:true,id:d.id,result},'*');
});

/* ---------- iframe laden (lazy, met cache-prime ingebakken) ---------- */
const loaded={};
async function ensureLoaded(world){
  if(loaded[world]) return;
  loaded[world]=true;
  let doc=WORLD_DOCS[world];
  const initial=await primeData(world);
  const inject='<scr'+'ipt>window.__INITIAL_CACHE__='+JSON.stringify(initial).replace(/</g,'\\u003c')+';</scr'+'ipt>';
  doc=doc.replace('</head>',inject+'</head>');
  document.getElementById('fr-'+world).srcdoc=doc;
}
function sendToFrame(world,msg){
  const fr=document.getElementById('fr-'+world);
  if(fr&&fr.contentWindow) fr.contentWindow.postMessage(msg,'*');
}

let currentTab='vandaag';
function showFrame(world){
  document.querySelectorAll('iframe.frame').forEach(f=>f.classList.remove('show'));
  document.getElementById('fr-'+world).classList.add('show');
}

async function goTab(tab, btn){
  currentTab=tab;
  document.querySelectorAll('nav.main .nav-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const sec=SECTIONS[tab];
  // bouw subbar met introzin + sub-knoppen
  const sb=document.getElementById('subbar');
  const introHtml = sec.intro ? '<span class="sub-intro">'+sec.intro+'</span>' : '';
  if(sec.subs && sec.subs.length){
    sb.classList.remove('single');
    sb.innerHTML=introHtml+sec.subs.map((s,i)=>`<button class="sub-btn ${i===0?'active':''}" onclick="goSub('${tab}',${i},this)">${s.label}</button>`).join('');
  } else {
    sb.classList.remove('single');
    sb.innerHTML=introHtml;
  }
  // open eerste sub (of de hoofdframe)
  await goSub(tab, 0, null);
}

async function goSub(tab, idx, btn){
  const sec=SECTIONS[tab];
  document.querySelectorAll('#subbar .sub-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  let world=sec.frame, cmd=null;
  if(sec.subs && sec.subs[idx]){ const s=sec.subs[idx]; world=s.frame||sec.frame; cmd=s.cmd; }
  await ensureLoaded(world);
  showFrame(world);
  if(cmd){ setTimeout(()=>sendToFrame(world,cmd), 120); }
}

let wipeScope=null;
function confirmWipe(scope){
  wipeScope=scope;
  const titles={reis:'Clear your 28-day journey?',kaarten:'Clear card draws?',aurora:'Clear plan & evidence?',contact:'Clear Contact Space?',all:'Clear everything?'};
  const descs={reis:'Your path progress, reflections and journey draws will be removed.',kaarten:'Your card history and pattern insights will be removed.',aurora:'Your plan, intentions and evidence archive will be removed.',contact:'What you saved in the Contact Space will be removed.',all:'Alles wordt verwijderd. Maanlicht begint weer als nieuw.'};
  const checks={reis:'Yes, clear my journey.',kaarten:'Yes, clear my draws.',aurora:'Yes, clear plan & evidence.',contact:'Yes, clear Contact Space.',all:'Yes, I understand all my data will be permanently removed.'};
  document.getElementById('wipe-title').textContent=titles[scope];
  document.getElementById('wipe-desc').textContent=descs[scope];
  document.getElementById('wipe-check-label').textContent=checks[scope];
  const chk=document.getElementById('wipe-check'),btn=document.getElementById('wipe-confirm-btn');
  chk.checked=false;btn.disabled=true;chk.onchange=()=>{btn.disabled=!chk.checked;};
  document.getElementById('wipe-modal').classList.add('show');
}
function closeWipe(){document.getElementById('wipe-modal').classList.remove('show');wipeScope=null;}
async function wipeWorld(w){try{const r=await window.storage.list(w+':');if(r&&r.keys)for(const k of r.keys){try{await window.storage.delete(k);}catch(e){}}}catch(e){}}
async function doWipe(){
  if(!document.getElementById('wipe-check').checked)return;
  if(wipeScope==='all'){await wipeWorld('aurora');await wipeWorld('contact');await wipeWorld('reis');await wipeWorld('kaarten');}
  else await wipeWorld(wipeScope);
  // herlaad de betrokken iframes zodat ze vers tonen
  const worlds = wipeScope==='all'?['aurora','contact','reis','kaarten']:[wipeScope];
  worlds.forEach(w=>{ loaded[w]=false; const fr=document.getElementById('fr-'+w); if(fr) fr.srcdoc=''; });
  closeWipe();toast('Gegevens gewist');renderSummary();
  // heropen huidige tab
  const activeBtn=document.querySelector('nav.main .nav-btn.active');
  goTab(currentTab, activeBtn);
}

<button id="installBtn" style="display:none;position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:300;background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#2a1a05;border:none;border-radius:100px;padding:11px 20px;font-family:var(--sans,sans-serif);font-size:13px;font-weight:600;box-shadow:0 8px 26px rgba(251,191,36,.38);cursor:pointer;">Installeer Maanlicht</button>

<script>
/* ---------- PWA: service worker + installprompt ---------- */
(function () {
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function (e) {
        console.warn("Service worker registratie mislukt:", e);
      });
    });
  }
  var deferred = null;
  var btn = document.getElementById("installBtn");
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    if (btn) btn.style.display = "block";
  });
  if (btn) {
    btn.addEventListener("click", function () {
      if (!deferred) return;
      deferred.prompt();
      deferred.userChoice.finally(function () {
        deferred = null;
        btn.style.display = "none";
      });
    });
  }
  window.addEventListener("appinstalled", function () {
    if (btn) btn.style.display = "none";
  });
})();
</script>
