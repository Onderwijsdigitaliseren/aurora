<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0520">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Manifestation">
<meta name="description" content="A grounded space for manifestation, reflection and calm.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Manifestation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#0f0520;--night:#1a0b2e;--violet:#2d1b4e;--plum:#4a2670;
    --orchid:#7c3aed;--rose:#c084fc;--gold:#fbbf24;--gold-soft:#fde68a;--gold-deep:#d97706;
    --green:#6ee7b7;--line:rgba(255,255,255,.10);--mist:rgba(255,255,255,.06);--mist-strong:rgba(255,255,255,.12);
    --text:#f5e6ff;--text-soft:#d4c5e8;--text-dim:#9b89b8;
    --serif:'Cormorant Garamond',Georgia,serif;--sans:'Outfit',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:var(--deep);color:var(--text);font-family:var(--sans);font-weight:300;overflow:hidden;-webkit-font-smoothing:antialiased;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  /* sub-nav (within a section) */
  .subbar{display:flex;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;overflow-x:auto;background:rgba(15,5,32,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);flex-shrink:0;-webkit-overflow-scrolling:touch;}
  .subbar::-webkit-scrollbar{display:none;}
  .sub-btn{white-space:nowrap;background:var(--mist);border:1px solid var(--line);color:var(--text-soft);border-radius:100px;padding:8px 15px;font-family:var(--sans);font-size:13px;cursor:pointer;transition:all .2s;flex-shrink:0;}
  .sub-btn.active{background:rgba(124,58,237,.35);border-color:var(--rose);color:#fff;}
  .subbar.single{display:none;}
  .sub-intro{display:flex;align-items:center;white-space:nowrap;font-family:var(--serif);font-style:italic;font-size:14px;color:var(--text-dim);padding-right:6px;flex-shrink:0;}

  .stage{flex:1;position:relative;overflow:hidden;}
  iframe.frame{position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--deep);display:none;}
  iframe.frame.show{display:block;}

  /* main nav at the bottom */
  nav.main{display:flex;justify-content:space-around;background:rgba(15,5,32,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));flex-shrink:0;}
  .nav-btn{flex:1;background:none;border:none;cursor:pointer;color:var(--text-dim);font-family:var(--sans);font-size:10.5px;font-weight:400;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 2px;transition:color .2s;letter-spacing:.3px;}
  .nav-btn .ico{font-size:19px;transition:transform .2s;}
  .nav-btn.active{color:var(--gold-soft);}
  .nav-btn.active .ico{transform:translateY(-1px) scale(1.08);}

  /* settings overlay */
  #settings{position:fixed;inset:0;z-index:50;background:var(--deep);overflow-y:auto;display:none;}
  #settings.show{display:block;}
  .set-wrap{max-width:560px;margin:0 auto;padding:calc(20px+env(safe-area-inset-top)) 20px 60px;}
  .back-btn{background:none;border:1px solid var(--line);color:var(--text-soft);border-radius:100px;padding:9px 17px;font-family:var(--sans);font-size:14px;cursor:pointer;margin-bottom:20px;}
  .set-wrap h2{font-family:var(--serif);font-size:30px;font-weight:500;margin-bottom:6px;}
  .set-wrap .note{color:var(--text-dim);font-size:14px;margin-bottom:24px;line-height:1.6;}
  .set-card{background:linear-gradient(160deg,var(--mist-strong),var(--mist));border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;}
  .set-card.danger{border-color:rgba(251,113,133,.3);}
  .set-card h3{font-family:var(--serif);font-size:20px;font-weight:500;margin-bottom:12px;}
  .sum-row{display:flex;justify-content:space-between;font-size:14px;color:var(--text-soft);padding:7px 0;border-bottom:1px solid var(--line);}
  .sum-row:last-child{border-bottom:none;}
  .store-note{font-size:13.5px;color:var(--text-dim);line-height:1.6;margin-bottom:16px;}
  .wipe-col{display:flex;flex-direction:column;gap:10px;}
  .wbtn{border-radius:100px;padding:12px 20px;font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;background:transparent;color:var(--text-soft);border:1px solid var(--line);transition:border-color .2s;width:100%;}
  .wbtn.danger{background:linear-gradient(135deg,#fb7185,#be123c);color:#fff;border:none;}
  .gear{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:5;background:rgba(15,5,32,.6);border:1px solid var(--line);color:var(--text-soft);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px;backdrop-filter:blur(10px);}

  .modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(8,3,18,.8);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .25s;}
  .modal-overlay.show{opacity:1;pointer-events:auto;}
  .modal{background:linear-gradient(160deg,var(--violet),var(--night));border:1px solid var(--line);border-radius:24px;padding:26px 24px;max-width:380px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.5);}
  .modal .m-icon{font-size:34px;text-align:center;margin-bottom:12px;}
  .modal h3{font-family:var(--serif);font-size:24px;font-weight:500;text-align:center;margin-bottom:10px;}
  .modal p{font-size:14.5px;color:var(--text-soft);text-align:center;line-height:1.6;margin-bottom:8px;}
  .modal .warn-line{color:#fda4af;font-size:13px;}
  .modal .confirm-check{display:flex;align-items:flex-start;gap:10px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin:16px 0;cursor:pointer;font-size:14px;color:var(--text-soft);line-height:1.4;}
  .modal .confirm-check input{margin-top:3px;width:18px;height:18px;accent-color:#fb7185;flex-shrink:0;}
  .modal-actions{display:flex;gap:10px;}
  .mbtn{flex:1;border-radius:100px;padding:12px 18px;font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;border:none;}
  .mbtn.ghost{background:transparent;color:var(--text-soft);border:1px solid var(--line);}
  .mbtn.danger{background:linear-gradient(135deg,#fb7185,#be123c);color:#fff;}
  .mbtn:disabled{opacity:.4;cursor:not-allowed;}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#2a1a05;padding:12px 22px;border-radius:100px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .35s;z-index:300;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<script src="js/storage.js"></script>
<div id="app">
  <div class="subbar single" id="subbar"></div>
  <div class="stage" id="stage">
    <button class="gear" onclick="openSettings()" title="Settings">⚙</button>
    <iframe class="frame" id="fr-aurora" title="Aurora"></iframe>
    <iframe class="frame" id="fr-contact" title="Contact"></iframe>
    <iframe class="frame" id="fr-reis" title="Reis"></iframe>
    <iframe class="frame" id="fr-kaarten" title="Kaarten"></iframe>
  </div>
  <nav class="main">
    <button class="nav-btn active" data-tab="vandaag" onclick="goTab('vandaag',this)"><span class="ico">🪞</span>Today</button>
    <button class="nav-btn" data-tab="leren" onclick="goTab('leren',this)"><span class="ico">📖</span>Learn</button>
    <button class="nav-btn" data-tab="oefenen" onclick="goTab('oefenen',this)"><span class="ico">🌬️</span>Practice</button>
    <button class="nav-btn" data-tab="kaarten" onclick="goTab('kaarten',this)"><span class="ico">🔮</span>Cards</button>
    <button class="nav-btn" data-tab="reis" onclick="goTab('reis',this)"><span class="ico">✶</span>My journey</button>
  </nav>
</div>

<!-- SETTINGS -->
<div id="settings">
  <div class="set-wrap">
    <button class="back-btn" onclick="closeSettings()">← Back</button>
    <h2>Settings</h2>
    <p class="note">Everything you do in Manifestation stays on this device. Here you can view and clear your data.</p>
    <div class="set-card"><h3>What's saved</h3><div id="storage-summary"><div class="sum-row"><span>Loading…</span><span></span></div></div></div>
    <div class="set-card danger">
      <h3>Clear data</h3>
      <p class="store-note">This can't be undone. Reflections, progress, intentions and draws will be lost.</p>
      <div class="wipe-col">
        <button class="wbtn" onclick="confirmWipe('reis')">Clear your 28-day journey</button>
        <button class="wbtn" onclick="confirmWipe('kaarten')">Clear your card draws</button>
        <button class="wbtn" onclick="confirmWipe('aurora')">Clear your plan & evidence</button>
        <button class="wbtn" onclick="confirmWipe('contact')">Clear Contact Space data</button>
        <button class="wbtn danger" onclick="confirmWipe('all')">Clear everything</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="wipe-modal">
  <div class="modal">
    <div class="m-icon">🕯️</div>
    <h3 id="wipe-title">Are you sure?</h3>
    <p id="wipe-desc"></p>
    <p class="warn-line">This can't be undone.</p>
    <label class="confirm-check"><input type="checkbox" id="wipe-check"><span id="wipe-check-label">Yes, I understand this is permanent.</span></label>
    <div class="modal-actions"><button class="mbtn ghost" onclick="closeWipe()">Cancel</button><button class="mbtn danger" id="wipe-confirm-btn" onclick="doWipe()" disabled>Clear</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>


<script>
/* ---------- iframe loading (lazy, with cache prime baked in) ----------
   Worlds live as real files in worlds/. We fetch the HTML, inject the
   initial localStorage cache for that world, and load it via srcdoc so
   the data is available synchronously before the world's scripts run. */
const loaded={};
async function ensureLoaded(world){
  if(loaded[world]) return;
  loaded[world]=true;
  const res=await fetch('worlds/'+world+'.html');
  let doc=await res.text();
  const initial=await primeData(world);
  const inject='<scr'+'ipt>window.__INITIAL_CACHE__='+JSON.stringify(initial).replace(/</g,'\u003c')+';</scr'+'ipt>';
  doc=doc.replace('</head>',inject+'</head>');
  document.getElementById('fr-'+world).srcdoc=doc;
}
function sendToFrame(world,msg){
  const fr=document.getElementById('fr-'+world);
  if(fr&&fr.contentWindow) fr.contentWindow.postMessage(msg,'*');
}

/* ---------- sections -> which iframe + which view ---------- */
// Each section: frame + optional sub-views (label -> view/panel command)
const SECTIONS={
  vandaag:{ frame:'aurora', intro:'A soft beginning. Just arrive.', subs:[
    {label:'Mirror', cmd:{__maanlicht:1,view:'welcome'}},
    {label:'Spark',    cmd:{__maanlicht:1,view:'inspire'}},
    {label:'Attune',frame:'contact', cmd:{__maanlicht:1,panel:'afstemmen'}},
  ]},
  leren:{ frame:'aurora', intro:'Understanding how it works — calmly, without dogma.', subs:[
    {label:'What it is', cmd:{__maanlicht:1,view:'uitleg'}},
    {label:'How to do it', cmd:{__maanlicht:1,view:'handleiding'}},
    {label:'When it stalls', cmd:{__maanlicht:1,view:'stuck'}},
    {label:'Longing & ego', frame:'contact', cmd:{__maanlicht:1,panel:'ego'}},
  ]},
  oefenen:{ frame:'aurora', intro:'Not to read, but to do.', subs:[
    {label:'Exercises', cmd:{__maanlicht:1,view:'oefeningen'}},
    {label:'Rituals', frame:'contact', cmd:{__maanlicht:1,panel:'tools'}},
  ]},
  kaarten:{ frame:'kaarten', intro:'Choose a deck, breathe in, and draw.', subs:[] },
  reis:{ frame:'reis', intro:'What you record, and what came back.', subs:[
    {label:'The path', cmd:{__maanlicht:1}},
    {label:'Plan & intention', frame:'aurora', cmd:{__maanlicht:1,view:'plan'}},
    {label:'Evidence', frame:'aurora', cmd:{__maanlicht:1,view:'bewijs'}},
    {label:'Moon phase', frame:'aurora', cmd:{__maanlicht:1,view:'moon'}},
  ]},
};

let currentTab='vandaag';
function showFrame(world){
  document.querySelectorAll('iframe.frame').forEach(f=>f.classList.remove('show'));
  document.getElementById('fr-'+world).classList.add('show');
}

async function goTab(tab, btn){
  currentTab=tab;
  document.querySelectorAll('nav.main .nav-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const sec=SECTIONS[tab];
  // build subbar with intro line + sub buttons
  const sb=document.getElementById('subbar');
  const introHtml = sec.intro ? '<span class="sub-intro">'+sec.intro+'</span>' : '';
  if(sec.subs && sec.subs.length){
    sb.classList.remove('single');
    sb.innerHTML=introHtml+sec.subs.map((s,i)=>`<button class="sub-btn ${i===0?'active':''}" onclick="goSub('${tab}',${i},this)">${s.label}</button>`).join('');
  } else {
    sb.classList.remove('single');
    sb.innerHTML=introHtml;
  }
  // open the first sub (or the main frame)
  await goSub(tab, 0, null);
}

async function goSub(tab, idx, btn){
  const sec=SECTIONS[tab];
  document.querySelectorAll('#subbar .sub-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  let world=sec.frame, cmd=null;
  if(sec.subs && sec.subs[idx]){ const s=sec.subs[idx]; world=s.frame||sec.frame; cmd=s.cmd; }
  await ensureLoaded(world);
  showFrame(world);
  if(cmd){ setTimeout(()=>sendToFrame(world,cmd), 120); }
}

/* ---------- settings ---------- */
function openSettings(){document.getElementById('settings').classList.add('show');renderSummary();}
function closeSettings(){document.getElementById('settings').classList.remove('show');}
async function renderSummary(){
  const box=document.getElementById('storage-summary');
  async function cnt(w){try{const r=await window.storage.list(w+':');return(r&&r.keys)?r.keys.length:0;}catch(e){return 0;}}
  const re=await cnt('reis'),k=await cnt('kaarten'),a=await cnt('aurora'),c=await cnt('contact');
  box.innerHTML=
    '<div class="sum-row"><span>Your 28-day journey</span><span>'+re+'</span></div>'+
    '<div class="sum-row"><span>Card draws</span><span>'+k+'</span></div>'+
    '<div class="sum-row"><span>Plan & evidence</span><span>'+a+'</span></div>'+
    '<div class="sum-row"><span>Contact Space</span><span>'+c+'</span></div>';
}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
let wipeScope=null;
function confirmWipe(scope){
  wipeScope=scope;
  const titles={reis:'Clear your 28-day journey?',kaarten:'Clear card draws?',aurora:'Clear plan & evidence?',contact:'Clear Contact Space?',all:'Clear everything?'};
  const descs={reis:'Your path progress, reflections and journey draws will be removed.',kaarten:'Your card history and pattern insights will be removed.',aurora:'Your plan, intentions and evidence archive will be removed.',contact:'What you saved in the Contact Space will be removed.',all:'Everything will be removed. Manifestation starts fresh.'};
  const checks={reis:'Yes, clear my journey.',kaarten:'Yes, clear my draws.',aurora:'Yes, clear plan & evidence.',contact:'Yes, clear Contact Space.',all:'Yes, I understand all my data will be permanently removed.'};
  document.getElementById('wipe-title').textContent=titles[scope];
  document.getElementById('wipe-desc').textContent=descs[scope];
  document.getElementById('wipe-check-label').textContent=checks[scope];
  const chk=document.getElementById('wipe-check'),btn=document.getElementById('wipe-confirm-btn');
  chk.checked=false;btn.disabled=true;chk.onchange=()=>{btn.disabled=!chk.checked;};
  document.getElementById('wipe-modal').classList.add('show');
}
function closeWipe(){document.getElementById('wipe-modal').classList.remove('show');wipeScope=null;}
async function wipeWorld(w){try{const r=await window.storage.list(w+':');if(r&&r.keys)for(const k of r.keys){try{await window.storage.delete(k);}catch(e){}}}catch(e){}}
async function doWipe(){
  if(!document.getElementById('wipe-check').checked)return;
  if(wipeScope==='all'){await wipeWorld('aurora');await wipeWorld('contact');await wipeWorld('reis');await wipeWorld('kaarten');}
  else await wipeWorld(wipeScope);
  // reload the affected iframes so they show fresh
  const worlds = wipeScope==='all'?['aurora','contact','reis','kaarten']:[wipeScope];
  worlds.forEach(w=>{ loaded[w]=false; const fr=document.getElementById('fr-'+w); if(fr) fr.srcdoc=''; });
  closeWipe();toast('Data cleared');renderSummary();
  // reopen current tab
  const activeBtn=document.querySelector('nav.main .nav-btn.active');
  goTab(currentTab, activeBtn);
}

/* ---------- start ---------- */
goTab('vandaag', document.querySelector('nav.main .nav-btn'));
</script>

<!-- App install button (appears only when the browser offers installation) -->
<button id="installBtn" style="display:none;position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:300;background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#2a1a05;border:none;border-radius:100px;padding:11px 20px;font-family:var(--sans,sans-serif);font-size:13px;font-weight:600;box-shadow:0 8px 26px rgba(251,191,36,.38);cursor:pointer;">Install Manifestation</button>

<script>
/* ---------- PWA: service worker + installprompt ---------- */
(function () {
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function (e) {
        console.warn("Service worker registration failed:", e);
      });
    });
  }
  var deferred = null;
  var btn = document.getElementById("installBtn");
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    if (btn) btn.style.display = "block";
  });
  if (btn) {
    btn.addEventListener("click", function () {
      if (!deferred) return;
      deferred.prompt();
      deferred.userChoice.finally(function () {
        deferred = null;
        btn.style.display = "none";
      });
    });
  }
  window.addEventListener("appinstalled", function () {
    if (btn) btn.style.display = "none";
  });
})();
</script>
</body>
</html>
