.6s cubic-bezier(.2,.7,.3,1)}\n.panel.show{display:block}\n@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}\n.section-title{font-family:var(--serif);font-weight:500;font-size:30px;text-align:center;margin-bottom:8px}\n.section-note{text-align:center;color:var(--ink-soft);max-width:540px;margin:0 auto 34px;font-size:15.5px}\n\n.btn{font-family:var(--sans);font-weight:400;letter-spacing:.04em;font-size:14.5px;color:var(--bg);background:linear-gradient(180deg,var(--gold),var(--gold-soft));border:none;padding:14px 30px;border-radius:999px;cursor:pointer;transition:transform .25s,box-shadow .25s;box-shadow:0 8px 30px rgba(217,184,120,.18)}\n.btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(217,184,120,.3)}\n.btn:active{transform:translateY(0) scale(.98)}\n.btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);box-shadow:none}\n.btn.ghost:hover{color:var(--ink);border-color:var(--gold-soft)}\n\n.ground-card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid var(--line-soft);border-radius:24px;padding:46px 32px;text-align:center;backdrop-filter:blur(6px)}\n.breath{width:120px;height:120px;margin:8px auto 26px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}\n.breath::before{content:\"\";position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle,rgba(217,184,120,.4),transparent 70%);animation:breathe 8s infinite ease-in-out}\n.breath i{font-style:normal;color:var(--gold);font-size:13px;letter-spacing:.25em;text-transform:uppercase;z-index:1}\n@keyframes breathe{0%,100%{transform:scale(.7);opacity:.5}50%{transform:scale(1.25);opacity:1}}\n.ground-text{font-family:var(--serif);font-size:25px;line-height:1.45;min-height:80px;display:flex;align-items:center;justify-content:center}\n\n.deck-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:30px}\n@media(max-width:620px){.deck-grid{grid-template-columns:repeat(2,1fr)}}\n@media(max-width:400px){.deck-grid{grid-template-columns:1fr}}\n.deck-btn{font-family:var(--sans);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid var(--line-soft);border-radius:18px;padding:18px 12px;cursor:pointer;text-align:center;color:var(--ink-soft);transition:all .4s cubic-bezier(.2,.7,.3,1)}\n.deck-btn .dot{width:28px;height:28px;border-radius:50%;margin:0 auto 11px;opacity:.9}\n.deck-btn .dn{font-family:var(--serif);font-size:18px;color:var(--ink);display:block;margin-bottom:2px;line-height:1.2}\n.deck-btn .dd{font-size:11px;letter-spacing:.05em;text-transform:uppercase}\n.deck-btn:hover{transform:translateY(-3px);border-color:var(--line)}\n.deck-btn.active{border-color:var(--gold);background:linear-gradient(180deg,rgba(217,184,120,.12),rgba(217,184,120,.03))}\n\n.stage{display:flex;flex-direction:column;align-items:center;gap:24px}\n.card{width:290px;height:410px;cursor:pointer;perspective:1400px;position:relative}\n.card.drawing{animation:cardGlow 1.1s ease-in-out}\n@keyframes cardGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(217,184,120,0))}50%{filter:drop-shadow(0 0 28px rgba(217,184,120,.65))}}\n.card-inner{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.2,.8,.25,1);transform-style:preserve-3d}\n.card.flipped .card-inner{transform:rotateY(180deg)}\n.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;border:1px solid var(--line)}\n.face-back{background:repeating-linear-gradient(45deg,rgba(217,184,120,.05) 0 8px,transparent 8px 16px),radial-gradient(circle at 50% 38%,rgba(217,184,120,.18),transparent 60%),linear-gradient(160deg,#1a2236,#11182a)}\n.face-back .glyph{font-family:var(--serif);font-size:46px;color:var(--gold);margin-bottom:14px;animation:glyphPulse 3.5s ease-in-out infinite}\n@keyframes glyphPulse{0%,100%{opacity:.6;text-shadow:0 0 0 rgba(217,184,120,0)}50%{opacity:1;text-shadow:0 0 18px rgba(217,184,120,.7)}}\n.face-back .tap{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-soft)}\n.face-front{transform:rotateY(180deg);flex-direction:column;gap:14px;background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(255,255,255,.015));backdrop-filter:blur(8px);justify-content:flex-start;padding-top:38px;overflow:hidden;position:relative}\n.face-front::after{content:\"\";position:absolute;top:0;left:-60%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.13),transparent);transform:skewX(-18deg)}\n.card.flipped .face-front::after{animation:shimmer 1.4s ease-out .5s}\n@keyframes shimmer{0%{left:-60%}100%{left:120%}}\n.face-front .inner-scroll{overflow-y:auto;display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;height:100%}\n.face-front .deck-tag{font-size:11px;letter-spacing:.26em;text-transform:uppercase}\n.face-front .msg{font-family:var(--serif);font-weight:500;font-size:24px;line-height:1.34}\n.face-front .expl{font-size:14px;color:var(--ink-soft);line-height:1.6}\n.face-front .doing{font-family:var(--serif);font-style:italic;font-size:15.5px;color:var(--gold);line-height:1.5;border-top:1px solid var(--line-soft);padding-top:13px;margin-top:4px}\n\n.note-box{background:linear-gradient(180deg,rgba(232,200,127,.1),rgba(232,200,127,.02));border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:30px}\n.note-box p{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--gold);line-height:1.5}\n.seeds{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:30px}\n@media(max-width:480px){.seeds{grid-template-columns:1fr}}\n.seed-btn{font-family:var(--sans);font-size:14.5px;color:var(--ink-soft);background:rgba(255,255,255,.03);border:1px solid var(--line-soft);border-radius:14px;padding:15px 16px;cursor:pointer;text-align:left;transition:all .35s;display:flex;align-items:center;gap:10px}\n.seed-btn .ic{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none}\n.seed-btn:hover{color:var(--ink);border-color:var(--line);transform:translateX(3px)}\n.seed-btn.active{border-color:var(--gold);background:rgba(217,184,120,.1);color:var(--ink)}\n.affirm-stage{text-align:center;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}\n.affirm{font-family:var(--serif);font-size:27px;line-height:1.45;max-width:560px;transition:opacity .4s}\n.custom-row{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap;justify-content:center}\n.custom-row input{flex:1;min-width:220px;font-family:var(--sans);font-size:15px;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px;outline:none;transition:border-color .3s}\n.custom-row input::placeholder{color:var(--ink-faint)}\n.custom-row input:focus{border-color:var(--gold-soft)}\n\n.tool-card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012));border:1px solid var(--line-soft);border-radius:20px;padding:26px 24px;margin-bottom:18px;transition:border-color .3s}\n.tool-card.open{border-color:var(--line)}\n.tool-head{display:flex;align-items:center;gap:14px;cursor:pointer}\n.tool-head .num{font-family:var(--serif);font-size:22px;color:var(--gold);width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}\n.tool-head .tt{font-family:var(--serif);font-size:22px;color:var(--ink);flex:1;line-height:1.2}\n.tool-head .chev{color:var(--gold-soft);transition:transform .35s;font-size:18px}\n.tool-card.open .chev{transform:rotate(90deg)}\n.tool-body{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.2,.7,.3,1)}\n.tool-body-inner{padding-top:18px}\n.tool-body p{color:var(--ink-soft);font-size:15px;margin-bottom:14px}\n.tool-body .step{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-soft)}\n.tool-body .step:last-child{border-bottom:none}\n.tool-body .step .s-dot{color:var(--gold);font-size:13px;margin-top:5px;flex:none}\n.tool-body .step .s-txt{font-size:15.5px;color:var(--ink)}\n.tool-body .reflect{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--gold);line-height:1.5;border-left:2px solid var(--gold);padding-left:18px;margin:16px 0 4px}\n\n.breath-tool{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012));border:1px solid var(--line-soft);border-radius:22px;padding:38px 28px;text-align:center;margin-bottom:24px}\n.bt-orb{width:160px;height:160px;margin:6px auto 22px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;transition:transform 4s ease-in-out}\n.bt-orb::before{content:\"\";position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle,rgba(217,184,120,.45),transparent 70%)}\n.bt-phase{font-family:var(--serif);font-size:24px;color:var(--ink);z-index:1}\n.bt-orb.inhale{transform:scale(1.28)}\n.bt-orb.exhale{transform:scale(.78)}\n.bt-count{font-size:14px;color:var(--ink-faint);letter-spacing:.1em;margin-bottom:20px;min-height:18px}\n\n.daily{background:linear-gradient(160deg,rgba(217,184,120,.12),rgba(217,184,120,.02));border:1px solid var(--line);border-radius:22px;padding:36px 28px;text-align:center}\n.daily .label{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:18px}\n.daily .text{font-family:var(--serif);font-size:25px;line-height:1.5;color:var(--ink);min-height:80px;display:flex;align-items:center;justify-content:center;transition:opacity .4s}\n\n.essay{max-width:660px;margin:0 auto}\n.essay .lead{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.55;text-align:center;margin-bottom:36px}\n.essay h3{font-family:var(--serif);font-weight:500;font-size:24px;color:var(--gold);margin:36px 0 12px}\n.essay p{color:var(--ink-soft);font-size:16px;margin-bottom:16px}\n.essay p strong{color:var(--ink);font-weight:400}\n.pull{border-left:2px solid var(--gold);padding:6px 0 6px 22px;margin:26px 0;font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.5}\n.mantra-list{list-style:none;margin:18px 0}\n.mantra-list li{font-family:var(--serif);font-size:19px;padding:13px 0;border-bottom:1px solid var(--line-soft);position:relative;padding-left:26px}\n.mantra-list li::before{content:\"\u2726\";position:absolute;left:0;color:var(--gold);font-size:13px;top:16px}\n\nfooter{text-align:center;margin-top:58px;padding-top:28px;border-top:1px solid var(--line-soft);color:var(--ink-faint);font-size:13px}\nfooter .glyph{color:var(--gold);font-size:20px;font-family:var(--serif);display:block;margin-bottom:10px}\n  nav,.nav,.bottom-nav{display:none!important;} body{padding-bottom:20px!important;}\n<\/style>\n<\/head>\n<body>\n<script>window.__WORLD_PREFIX__='contact';<\/script>\n<script>/* ============================================================\n   OPSLAGBRUG \u2014 ge\u00efnjecteerd in elke wereld-iframe.\n   Vervangt localStorage en window.storage door een proxy\n   die via postMessage met de hoofdapp praat (die de echte\n   window.storage heeft). Sleutels worden geprefixt per wereld.\n   ============================================================ */\n(function(){\n  const WORLD = window.__WORLD_PREFIX__ || 'x';\n  const parent = window.parent;\n  let reqId = 0;\n  const pending = {};\n\n  function call(op, key, value){\n    return new Promise((resolve)=>{\n      const id = ++reqId;\n      pending[id] = resolve;\n      parent.postMessage({ __storageBridge:true, id, op, world:WORLD, key, value }, '*');\n    });\n  }\n  window.addEventListener('message', (e)=>{\n    const d = e.data;\n    if(d && d.__storageBridgeReply && pending[d.id]){ pending[d.id](d.result); delete pending[d.id]; }\n  });\n\n  /* --- async window.storage proxy (voor Reis) --- */\n  window.storage = {\n    get:    (key)        => call('get', key),\n    set:    (key, value) => call('set', key, value),\n    delete: (key)        => call('delete', key),\n    list:   (prefix)     => call('list', prefix || ''),\n  };\n\n  /* --- synchrone localStorage-shim (voor Aurora) ---\n     Maintains an in-memory cache filled at init, reads synchronously,\n     en schrijft async door naar de parent. --- */\n  const cache = {};\n  // initi\u00eble cache is al ingebakken door de parent v\u00f3\u00f3r deze iframe laadde\n  try { if (window.__INITIAL_CACHE__) Object.assign(cache, window.__INITIAL_CACHE__); } catch(e){}\n  window.__primeCache = function(obj){ Object.assign(cache, obj || {}); };\n  try {\n    Object.defineProperty(window, 'localStorage', {\n      configurable:true,\n      value: {\n        getItem(k){ return (k in cache) ? cache[k] : null; },\n        setItem(k,v){ cache[k] = String(v); call('lset', k, String(v)); },\n        removeItem(k){ delete cache[k]; call('ldel', k); },\n        clear(){ for(const k in cache) delete cache[k]; call('lclear'); },\n        key(i){ return Object.keys(cache)[i] || null; },\n        get length(){ return Object.keys(cache).length; }\n      }\n    });\n  } catch(e){ /* localStorage already defined; ignore */ }\n\n  /* signaal aan parent dat iframe klaar is en de cache wil */\n  parent.postMessage({ __storageBridge:true, op:'ready', world:WORLD }, '*');\n})();\n<\/script>\n\n<div class=\"stars\" id=\"stars\"><\/div>\n<div class=\"wrap\">\n\n  <header>\n    <div class=\"eyebrow\">A place to attune<\/div>\n    <h1>My <em>Contact space<\/em><\/h1>\n    <p class=\"sub\">Breathe, ask, draw, practise \u2014 and experience it for real<\/p>\n    <div class=\"divider\"><span id=\"secretStar\" style=\"cursor:pointer;transition:transform .3s\" title=\"\u2026\">\u2726<\/span><\/div>\n  <\/header>\n\n  <nav>\n    <button class=\"nav-btn active\" data-tab=\"afstemmen\">Attune<\/button>\n    <button class=\"nav-btn\" data-tab=\"kaart\">Draw a card<\/button>\n    <button class=\"nav-btn\" data-tab=\"manifest\">Manifest<\/button>\n    <button class=\"nav-btn\" data-tab=\"respect\">Loving respect<\/button>\n    <button class=\"nav-btn\" data-tab=\"tools\">Exercises<\/button>\n    <button class=\"nav-btn\" data-tab=\"ego\">On longing<\/button>\n  <\/nav>\n\n  <section class=\"panel show\" id=\"afstemmen\">\n    <h2 class=\"section-title\">Just land<\/h2>\n    <p class=\"section-note\">No silence required. Follow the words at your own pace, and let the breath circle give you rhythm.<\/p>\n    <div class=\"ground-card\">\n      <div class=\"breath\"><i>breathe<\/i><\/div>\n      <p class=\"ground-text\" id=\"groundText\">Ready to begin?<\/p>\n      <div style=\"margin-top:26px\"><button class=\"btn\" id=\"groundBtn\" onclick=\"nextGround()\">Begin attuning<\/button><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"panel\" id=\"kaart\">\n    <h2 class=\"section-title\">Draw a card<\/h2>\n    <p class=\"section-note\">Choose a deck, breathe in, and tap the card. Beneath each message you'll find a short note and something to do.<\/p>\n    <div class=\"deck-grid\" id=\"deckGrid\"><\/div>\n    <div class=\"stage\">\n      <div class=\"card\" id=\"card\" onclick=\"drawCard()\">\n        <div class=\"card-inner\">\n          <div class=\"face face-back\"><div><div class=\"glyph\">\u2726<\/div><div class=\"tap\">Tap to draw<\/div><\/div><\/div>\n          <div class=\"face face-front\">\n            <div class=\"inner-scroll\">\n              <span class=\"deck-tag\" id=\"deckTag\"><\/span>\n              <span class=\"msg\" id=\"cardMsg\"><\/span>\n              <span class=\"expl\" id=\"cardExpl\"><\/span>\n              <span class=\"doing\" id=\"cardDoing\"><\/span>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <button class=\"btn ghost\" onclick=\"drawCard()\">Draw again<\/button>\n    <\/div>\n  <\/section>\n\n  <section class=\"panel\" id=\"manifest\">\n    <h2 class=\"section-title\">Manifest<\/h2>\n    <p class=\"section-note\">What do you want to attune to today?<\/p>\n    <div class=\"note-box\"><p>Everything you long for may be here \u2014 money, abundance, space, rest. Longing isn\\'t an ego you must switch off. It\\'s your life wanting to be nourished.<\/p><\/div>\n    <div class=\"seeds\">\n      <button class=\"seed-btn\" onclick=\"seed('geld',this)\"><span class=\"ic\"><\/span>Money &amp; abundance<\/button>\n      <button class=\"seed-btn\" onclick=\"seed('rust',this)\"><span class=\"ic\"><\/span>Rest &amp; being carried<\/button>\n      <button class=\"seed-btn\" onclick=\"seed('liefde',this)\"><span class=\"ic\"><\/span>Love &amp; connection<\/button>\n      <button class=\"seed-btn\" onclick=\"seed('gezondheid',this)\"><span class=\"ic\"><\/span>Health &amp; energy<\/button>\n      <button class=\"seed-btn\" onclick=\"seed('respect',this)\"><span class=\"ic\"><\/span>Respect &amp; appreciation<\/button>\n      <button class=\"seed-btn\" onclick=\"seed('leren',this)\"><span class=\"ic\"><\/span>Learning &amp; growing<\/button>\n    <\/div>\n    <div class=\"affirm-stage\">\n      <p class=\"affirm\" id=\"affirm\">Pick a theme to let an intention appear\u2026<\/p>\n      <button class=\"btn ghost\" id=\"affirmShuffle\" style=\"display:none\" onclick=\"shuffleAffirm()\">Other words<\/button>\n    <\/div>\n    <div class=\"custom-row\">\n      <input type=\"text\" id=\"customInput\" placeholder=\"\u2026or type your own longing here\" />\n      <button class=\"btn\" onclick=\"customAffirm()\">Create intention<\/button>\n    <\/div>\n  <\/section>\n\n  <section class=\"panel\" id=\"respect\">\n    <h2 class=\"section-title\">Loving respect<\/h2>\n    <p class=\"section-note\">For yourself <em>and<\/em> the other \u2014 without erasing yourself or pleasing everyone. Tap an exercise open and follow along.<\/p>\n    <div id=\"respectTools\"><\/div>\n  <\/section>\n\n  <section class=\"panel\" id=\"tools\">\n    <h2 class=\"section-title\">Exercises to experience<\/h2>\n    <p class=\"section-note\">Not to read through, but to do. Take a moment.<\/p>\n    <div class=\"breath-tool\">\n      <div style=\"font-family:var(--serif);font-size:21px;margin-bottom:18px;color:var(--ink)\">Guided breathing<\/div>\n      <div class=\"bt-orb\" id=\"btOrb\"><span class=\"bt-phase\" id=\"btPhase\">klaar?<\/span><\/div>\n      <div class=\"bt-count\" id=\"btCount\"><\/div>\n      <button class=\"btn\" id=\"btBtn\" onclick=\"toggleBreath()\">Start breathing<\/button>\n      <p style=\"font-size:13px;color:var(--ink-faint);margin-top:16px\">Breathe in as the circle grows, breathe out as it shrinks. Four counts each.<\/p>\n    <\/div>\n    <div class=\"daily\">\n      <div class=\"label\">Today's intention<\/div>\n      <div class=\"text\" id=\"dailyText\">Tap to receive your intention<\/div>\n      <div style=\"margin-top:22px\"><button class=\"btn ghost\" onclick=\"newDaily()\">Give me an intention<\/button><\/div>\n    <\/div>\n\n    <div class=\"daily\" style=\"margin-top:24px;background:linear-gradient(160deg,rgba(216,176,106,.13),rgba(216,176,106,.02))\">\n      <div class=\"label\">Today's mini challenge<\/div>\n      <div class=\"text\" id=\"challengeText\" style=\"font-size:22px\">Tap for a small, concrete challenge<\/div>\n      <div style=\"margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap\">\n        <button class=\"btn\" onclick=\"newChallenge()\">Give me a challenge<\/button>\n        <button class=\"btn ghost\" id=\"challengeDone\" style=\"display:none\" onclick=\"markDone()\">Gedaan \u2713<\/button>\n      <\/div>\n      <p id=\"challengeCheer\" style=\"font-family:var(--serif);font-style:italic;font-size:17px;color:var(--gold);margin-top:18px;min-height:20px\"><\/p>\n    <\/div>\n  <\/section>\n\n  <section class=\"panel\" id=\"ego\">\n    <h2 class=\"section-title\">On longing, ego, respect and learning<\/h2>\n    <div class=\"essay\">\n      <p class=\"lead\">Longing isn't the ego you must overcome. It's often your soul telling you where life wants to go.<\/p>\n      <h3>The misunderstanding about the ego<\/h3>\n      <p>There exists an idea \u2014 popular in some spiritual circles \u2014 that everything you want for yourself \"ego\" is, en dat je pas \u00e9cht spiritueel bent als je geen long fors meer hebt. Money willen? Ego. Erkenning willen? Ego. En dus voelt elk long for ineens als een tekortkoming.<\/p>\n      <p>But that's a narrowing. In almost no wisdom tradition are you asked to switch off your <strong>weg te cijferen<\/strong>. What they describe is subtler: not clinging, not hanging your whole identity on what you own. That\\'s something very different from being forbidden to want anything.<\/p>\n      <div class=\"pull\">The problem is never the longing itself. It\\'s only the fear beneath it \u2014 and you don\\'t solve that by denying the longing.<\/div>\n      <h3>Money is simply energy<\/h3>\n      <p>Money is exchanged trust, a way that flow becomes visible. Asking for it is as legitimate as asking for health or love. <strong>Genoeg hebben<\/strong> gives calm, room to give, and freedom to care for others without exhausting yourself.<\/p>\n      <h3>Respect and recognition may be there<\/h3>\n      <p>Wanting to be seen and appreciated isn\\'t vanity \u2014 it\\'s a deeply human need. It only becomes shaky when you <strong>eigenwaarde volledig<\/strong> in andermans handen legt. The healthy version: I may long for respect <em>and<\/em> I know my worth doesn\\'t disappear if someone doesn\\'t give it to me for a moment.<\/p>\n      <h3>Loving respect for yourself<\/h3>\n      <p>Respecting yourself also means taking your boundaries seriously. Constantly pleasing others and erasing yourself feels like love, but exhausts you and teaches people that your needs don\\'t count. <strong>Setting a boundary isn\\'t rejection<\/strong>  \u2014 it\\'s a form of honesty that actually makes real connection possible.<\/p>\n      <h3>Learning as a form of reverence<\/h3>\n      <p>The wish to grow is your life force itself. It\\'s your way of showing reverence for the gift that your life is: doing something with it, going deeper, becoming more.<\/p>\n      <div class=\"pull\">You don\\'t have to make yourself small to come close to the sacred. You may long greatly <em>and<\/em> stay soft.<\/div>\n      <h3>To carry with you<\/h3>\n      <ul class=\"mantra-list\">\n        <li>I may long without judging myself.<\/li>\n        <li>Wanting enough is taking care of myself, not selfishness.<\/li>\n        <li>Money is energy, and it may flow to me.<\/li>\n        <li>I may ask for respect, <em>and<\/em> I carry my worth within me.<\/li>\n        <li>My boundaries protect my love, they don\\'t block it.<\/li>\n        <li>I don\\'t have to please everyone to be worthwhile.<\/li>\n      <\/ul>\n    <\/div>\n  <\/section>\n\n  <footer><span class=\"glyph\">\u2726<\/span>Your space. Open it whenever you want to attune.<\/footer>\n<\/div>\n\n<script>\n(function(){const s=document.getElementById('stars');let h='';for(let i=0;i<70;i++){h+='<span style=\"left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;animation-delay:'+(Math.random()*4).toFixed(1)+'s\"><\/span>';}s.innerHTML=h;})();\n// floating golden motes\n(function(){const m=document.createElement('div');m.className='motes';document.body.appendChild(m);let h='';for(let i=0;i<22;i++){const sz=(2+Math.random()*4).toFixed(1),dur=(14+Math.random()*16).toFixed(1),delay=(Math.random()*18).toFixed(1),left=(Math.random()*100).toFixed(1),drift=((Math.random()*120-60)).toFixed(0)+'px';h+='<div class=\"mote\" style=\"left:'+left+'%;width:'+sz+'px;height:'+sz+'px;--drift:'+drift+';animation-duration:'+dur+'s;animation-delay:'+delay+'s\"><\/div>';}m.innerHTML=h;})();\n\nconst navBtns=document.querySelectorAll('.nav-btn'),panels=document.querySelectorAll('.panel');\nnavBtns.forEach(b=>b.addEventListener('click',()=>{navBtns.forEach(x=>x.classList.remove('active'));b.classList.add('active');panels.forEach(p=>p.classList.remove('show'));document.getElementById(b.dataset.tab).classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}));\n\nconst grounding=['Breathe calmly in through your nose\u2026 and release.','Feel your feet on the ground, your body carried.','Place a hand on your heart. You are here, that is enough.','Invite your guide, angel or a warm presence to come close.','Imagine that there is a zacht, gouden licht om je heen is.','You are open and connected. Draw or manifest when you\\'re ready.'];\nlet gi=-1;\nfunction nextGround(){gi++;const t=document.getElementById('groundText'),b=document.getElementById('groundBtn');if(gi>=grounding.length){gi=-1;t.textContent='Done om te beginnen?';b.textContent='Begin afstemmen';return;}t.style.transition='opacity .25s';t.style.opacity=0;setTimeout(()=>{t.textContent=grounding[gi];t.style.opacity=1;},220);b.textContent=(gi===grounding.length-1)?'Opnieuw':'Next ademhaling \u2192';}\n\nconst decks={\n  engelen:{c:'var(--engel)',name:'Engelen & gidsen',dd:'Zachte steun',cards:[\n    {m:'You are carried.',e:'Even if you don\\'t feel it, you are not alone. There\\'s more support around you than is visible.',d:'Ask silently: \"Let me feel today that I am carried.\" And keep softly noticing.'},\n    {m:'Help is on the way.',e:'What you\\'ve asked has been set in motion \u2014 even if you don\\'t see the result yet.',d:'Consciously let go of control once today, and trust it will be okay.'},\n    {m:'Ask, and it will be given.',e:'You don\\'t have to do it alone. Asking for help isn\\'t weakness, it\\'s openness.',d:'Speak one concrete question aloud today to your guide or angel.'},\n    {m:'Something loving watches over you.',e:'A warm presence is closer than you think, especially in your heavier moments.',d:'Place a hand on your heart for a moment and say: \"I feel that I\\'m not alone.\"'},\n    {m:'Let go of what is heavy.',e:'You don\\'t have to keep carrying everything. Some burdens may leave your hands.',d:'Breathe out and imagine handing something heavy to something larger than you.'},\n    {m:'You are where you\\'re meant to be.',e:'This phase too, with all its uncertainty, belongs to your path.',d:'Name one thing you\\'re grateful for, exactly as your life is right now.'},\n    {m:'A sign is coming to you.',e:'In the coming days watch for repetitions, coincidences, a song, a word.',d:'Ask for a specific sign, then let it go.'},\n    {m:'Your prayers have been heard.',e:'Nothing you\\'ve asked from the heart is lost.',d:'Write or say: \"Thank you for listening\" \u2014 before you see the answer.'}]},\n  orakel:{c:'var(--orakel)',name:'Orakel',dd:'Intu\u00eftie',cards:[\n    {m:'A new door opens.',e:'Something new is presenting itself. You don\\'t have to understand it fully yet.',d:'Ask yourself: where am I lately feeling a soft \"yes\" come up?'},\n    {m:'What ends makes room.',e:'A closure isn\\'t loss but a clearing for what fits better.',d:'Name something that may end, and thank it for what it brought you.'},\n    {m:'Follow what feels light.',e:'Your intuition speaks through lightness, not through force or fear.',d:'Think of a choice. Which option makes your body lighter? That\\'s your clue.'},\n    {m:'You already know the answer.',e:'Diep van binnen is de richting er al. Je hoeft hem alleen toe te laten.',d:'Pose your question, place a hand on your belly, and listen for the first quiet response.'},\n    {m:'Patience \u2014 it\\'s still ripening.',e:'Not everything is ready to be harvested. Forcing has the opposite effect.',d:'Give yourself permission to let something be for a moment without fixing it.'},\n    {m:'Look at what returns.',e:'A recurring feeling, theme or person wants to make something clear to you.',d:'Ask: what is this pattern trying to teach me?'},\n    {m:'Your intuition points, not your fear.',e:'Learn to feel the difference: fear squeezes, intuition is calm and clear.',d:'Bij twijfel: adem drie keer rustig, en vraag opnieuw vanuit rust.'},\n    {m:'Let it flow.',e:'Holding on slows; letting go lets life move.',d:'Open letterlijk je handen, palmen omhoog, en adem uit.'}]},\n  overvloed:{c:'var(--overvloed)',name:'Overvloed',dd:'Zonder schuld',cards:[\n    {m:'You may receive.',e:'Abundance isn\\'t a reward for perfection. It\\'s your right, simply because you exist.',d:'Say aloud: \"I may receive\" and notice what resistance comes \u2014 and let it be soft.'},\n    {m:'Money is energy.',e:'It may flow, like breath or water. Asking for it isn\\'t greedy.',d:'Visualise money coming to you with ease, without earning it through exhaustion.'},\n    {m:'Longing isn\\'t guilt.',e:'Wanting what you want is your life growing, not your ego conquering.',d:'Name one longing you usually push away, and give it the right to exist today.'},\n    {m:'There is enough, and you belong.',e:'Abundance isn\\'t a pie you take from others. There\\'s room for everyone, including you.',d:'Replace one \"I\\'m not allowed\" with \"I\\'m allowed too\".'},\n    {m:'Open your hands.',e:'With clenched fists you can receive nothing. Receiving asks openness.',d:'Sit with open hands on your lap and breathe calmly \u2014 a posture of receiving.'},\n    {m:'You deserve space and freedom.',e:'Comfort and ease aren\\'t shallow; they give you the calm to live and give.',d:'Today allow yourself one small moment of comfort, consciously and without guilt.'},\n    {m:'What you give returns.',e:'Giving from abundance (not from exhaustion) sets a stream in motion.',d:'Today give something small with an open heart \u2014 and receive something too.'},\n    {m:'The flow has already begun.',e:'You don\\'t have to force it. Trust that it\\'s already in motion.',d:'Thank in advance for what\\'s on the way, as if it\\'s already here.'}]},\n  chakra:{c:'var(--chakra)',name:'Chakras',dd:'Energy',cards:[\n    {m:'Root chakra \u2014 safety.',e:'Your foundation asks attention: do you feel safe and grounded in your life?',d:'Stand with bare feet on the ground and feel your connection to the earth.'},\n    {m:'Sacral \u2014 creativity & pleasure.',e:'Your zest for life and enjoyment want space. Are you allowed to enjoy?',d:'Today do something purely because it\\'s fun, with no purpose.'},\n    {m:'Solar plexus \u2014 personal power.',e:'Your ability to say \"I want\" and \"I can\" asks strengthening.',d:'Stand straight, breathe into your belly, and say: \"I may take up my space.\"'},\n    {m:'Heart \u2014 love & connection.',e:'Love for yourself and others wants to flow, in balance.',d:'Breathe into your heart and send warmth first to yourself, then to someone else.'},\n    {m:'Throat \u2014 speaking your truth.',e:'There is something that wants to be said or expressed.',d:'Today speak or write one thing you\\'ve been holding in.'},\n    {m:'Third eye \u2014 insight.',e:'Your intuition and inner knowing ask trust.',d:'Close your eyes for a moment and ask: what do I already know, but ignore?'},\n    {m:'Crown \u2014 connection with the greater.',e:'Your bond with something larger than yourself wants to deepen.',d:'Imagine a light entering through your crown and filling you.'}]},\n  element:{c:'var(--element)',name:'Elements',dd:'Nature',cards:[\n    {m:'Earth \u2014 grounding.',e:'Time to slow down, ground, and tend to your foundation.',d:'Go outside or touch a plant or stone; feel something tangible.'},\n    {m:'Water \u2014 feeling & flow.',e:'Your emotions want to be acknowledged and felt through, not pushed away.',d:'Let one feeling be fully there today, without judging it.'},\n    {m:'Fire \u2014 passion & action.',e:'There\\'s energy and willpower that wants to come out.',d:'Take one small, courageous step toward something you want.'},\n    {m:'Air \u2014 clarity & thoughts.',e:'It\\'s time to clear your head and gain perspective.',d:'Breathe deeply and briefly write out your thoughts to make room.'},\n    {m:'Ether \u2014 connection & rest.',e:'The silent, spacious element invites you to surrender.',d:'Sit silently for a minute and let everything be as it is.'}]},\n  kind:{c:'var(--kind)',name:'Inner child',dd:'Self-love',cards:[\n    {m:'You are worthy, simply as you are.',e:'You don\\'t have to perform to earn love. That was true then, and is true now.',d:'Say to yourself what the child in you would have wanted to hear back then.'},\n    {m:'You may make mistakes.',e:'The younger you was afraid to do it wrong. You\\'re now safe to learn.',d:'Forgive yourself one thing today, aloud or in silence.'},\n    {m:'Your feelings matter.',e:'What you feel is valid, even if others once dismissed it.',d:'Ask the child in you: what do you need now? And give it, even if small.'},\n    {m:'You may play and be light.',e:'Not everything has to be heavy or useful. Joy is sacred.',d:'Today do something playful or silly, purely for the joy.'},\n    {m:'You don\\'t have to please to be loved.',e:'You may have learned that love had to be earned. That wasn\\'t true.',d:'Say \"no\" or \"I don\\'t want this\" once, without apologising.'},\n    {m:'You are safe now.',e:'The fear of long ago belongs to back then. Now you may allow calm and safety.',d:'Place a hand on your heart and say: \"I am here for you now.\"'}]},\n  maan:{c:'var(--maan)',name:'Moon phases',dd:'Cycle',cards:[\n    {m:'New moon \u2014 a new beginning.',e:'The silent, dark moon is the moment to sow. What do you want to grow?',d:'Write one intention, as concrete as possible, and place it somewhere you\\'ll see it.'},\n    {m:'Waxing moon \u2014 building.',e:'Energy is swelling. This is the time for action and perseverance.',d:'Today take one step toward something you started at the new moon.'},\n    {m:'Full moon \u2014 fullness & release.',e:'Everything stands in full light. What has ripened, and what may now go?',d:'Name something to be grateful for <em>and<\/em> something you release under this full light.'},\n    {m:'Waning moon \u2014 clearing.',e:'The moon withdraws. Time to let go of what no longer serves.',d:'Today clear one thing \u2014 physical or in your head \u2014 that takes up room.'},\n    {m:'Dark moon \u2014 rest & turning inward.',e:'Before the new begins, you may be empty and quiet. Doing isn\\'t required for now.',d:'Today grant yourself conscious do-nothing time, without guilt.'}]},\n  kracht:{c:'var(--kracht)',name:'Inner power',dd:'Self-worth',cards:[\n    {m:'Your no is as valuable as your yes.',e:'A boundary isn\\'t rejection but honesty. It makes your yes more sincere.',d:'Today practice one small, friendly \"no\" without long explanation.'},\n    {m:'Your worth doesn\\'t depend on approval.',e:'Even when someone doesn\\'t see it for a moment, you\\'re not worth less.',d:'Name one quality of yourself that you value, regardless of what others think.'},\n    {m:'You may take up space.',e:'You don\\'t have to make yourself small to put others at ease.',d:'Today consciously stand or sit straight, and breathe into your full length.'},\n    {m:'You don\\'t have to keep everyone satisfied.',e:'It\\'s impossible and it exhausts you. Some people may be dissatisfied.',d:'Consciously leave something unresolved once \u2014 someone\\'s displeasure that isn\\'t yours to carry.'},\n    {m:'Caring for yourself isn\\'t selfish.',e:'An empty jug pours nothing. Filling yourself is what enables you to give.',d:'Today do something purely for your own wellbeing, without justifying it.'},\n    {m:'You are already enough.',e:'Not when you achieve more, not when you\\'re more perfect. Now, exactly as you are.',d:'Say three times: \"I am enough\" \u2014 and notice what responds inside.'}]}\n};\nlet curDeck='engelen';\n(function(){const g=document.getElementById('deckGrid');let h='';const order=['engelen','orakel','overvloed','chakra','element','kind','maan','kracht'];order.forEach((k,i)=>{const d=decks[k];h+='<button class=\"deck-btn'+(i===0?' active':'')+'\" data-deck=\"'+k+'\" onclick=\"pickDeck(\\''+k+'\\',this)\"><div class=\"dot\" style=\"background:'+d.c+'\"><\/div><span class=\"dn\">'+d.name+'<\/span><span class=\"dd\">'+d.dd+'<\/span><\/button>';});g.innerHTML=h;})();\nfunction pickDeck(name,el){curDeck=name;document.querySelectorAll('.deck-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.getElementById('card').classList.remove('flipped');}\nfunction drawCard(){const c=document.getElementById('card'),d=decks[curDeck],p=d.cards[Math.floor(Math.random()*d.cards.length)];c.classList.remove('drawing');void c.offsetWidth;c.classList.add('drawing');sparkleBurst(c);if(c.classList.contains('flipped')){c.classList.remove('flipped');setTimeout(()=>setFront(d,p),450);setTimeout(()=>c.classList.add('flipped'),480);}else{setFront(d,p);setTimeout(()=>c.classList.add('flipped'),60);}}\nfunction sparkleBurst(el){const r=el.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;for(let i=0;i<14;i++){const s=document.createElement('div');s.className='spark';const ang=Math.random()*Math.PI*2,dist=60+Math.random()*90;s.style.left=cx+'px';s.style.top=cy+'px';s.style.setProperty('--bx',Math.cos(ang)*dist+'px');s.style.setProperty('--by',Math.sin(ang)*dist+'px');s.style.animation='burst '+(0.6+Math.random()*0.5)+'s ease-out forwards';document.body.appendChild(s);setTimeout(()=>s.remove(),1200);}}\nfunction setFront(d,p){const t=document.getElementById('deckTag');t.textContent=d.name;t.style.color=d.c;document.getElementById('cardMsg').textContent=p.m;document.getElementById('cardExpl').textContent=p.e;document.getElementById('cardDoing').textContent='\u2726 '+p.d;}\n\nconst affirms={geld:['I am open to receive money and abundance, and I may long for that without guilt.','Money flows to me with ease, and I let it in.','I am worthy of living spaciously and freely.'],rust:['I am calm, safe and carried. I don\\'t have to force anything.','I may pause and catch my breath. There is enough time.','Peace fills me from within.'],liefde:['Love flows to me and through me. I am worth it.','I am surrounded by warm, sincere connections.','I open my heart and let love in.'],gezondheid:['My body heals and my energy grows with each day.','I listen to my body and it carries me with strength.','Vitality flows through me.'],respect:['I am seen and appreciated, and I carry my worth within myself.','I may ask for and receive respect, with my head held high.','My boundaries are allowed to exist, and they make my yes more sincere.'],leren:['I grow every day, and my curiosity is a gift.','I may learn, make mistakes and keep going deeper.','My desire to grow is reverence for my life.']};\nlet curTheme=null,curIdx=0;\nfunction seed(t,el){curTheme=t;curIdx=0;document.querySelectorAll('.seed-btn').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');showAffirm(affirms[t][0]);document.getElementById('affirmShuffle').style.display=affirms[t].length>1?'inline-block':'none';}\nfunction shuffleAffirm(){if(!curTheme)return;const a=affirms[curTheme];curIdx=(curIdx+1)%a.length;showAffirm(a[curIdx]);}\nfunction customAffirm(){const v=document.getElementById('customInput').value.trim();if(!v)return;curTheme=null;document.querySelectorAll('.seed-btn').forEach(b=>b.classList.remove('active'));document.getElementById('affirmShuffle').style.display='none';showAffirm('I am open to receive '+v+', and I may long for that without guilt.');}\nfunction showAffirm(t){const a=document.getElementById('affirm');a.style.opacity=0;setTimeout(()=>{a.textContent=t;a.style.opacity=1;},250);}\n\nconst respectTools=[\n  {t:'Stop people-pleasing',p:'This affects you most, so we start here. Pleasing feels like love, but often comes from fear of rejection. Real connection can handle your honesty.',steps:['At a choice, ask yourself: am I doing this for myself, or to keep someone satisfied?','If it\\'s pleasing: pause. You don\\'t have to answer right away.','Say: \"I\\'ll let you know later\" and give yourself time to think.','Then choose from what fits, not from fear of their reaction.','Notice afterwards: the world didn\\'t collapse. You may do this more often.'],r:'What am I afraid would happen if I stopped pleasing?'},\n  {t:'No longer erasing yourself',p:'Erasing yourself starts small: your need always comes last. This exercise puts you back on the list.',steps:['Write or name three things that <em>you<\/em> need \u2014 separate from what others want.','Choose one of them today, however small, and give it space.','Notice the urge to postpone it \"until the rest is done\". Do it first anyway.','Say to yourself: \"My need counts just as much as anyone else\\'s.\"'],r:'If I put myself at the front for a moment, what would I choose?'},\n  {t:'Feeling a boundary in your body',p:'Your body often knows before your head where your boundary lies. This exercise teaches you to recognise that signal.',steps:['Think of a situation where you said \"yes\" but actually felt \"no\".','Notice where you felt it in your body \u2014 a cramp, pressure on your chest, a sigh.','Breathe into that spot and say: \"Thank you for warning me.\"','Practise taking that signal seriously from now on, before you answer.'],r:'What would happen if I could trust this body signal?'},\n  {t:'Saying no without guilt',p:'A no to someone else is often a yes to yourself. You don\\'t have to extensively defend a boundary.',steps:['Think of a request you actually want to say no to.','Practise a short sentence: \"That doesn\\'t work for me\" or \"That\\'s not my choice.\"','Notice: you don\\'t have to give a long explanation or excuse.','Breathe out after the no. The other may be disappointed \u2014 that\\'s not your job to fix.'],r:'For whom do I care so well that I forget myself?'},\n  {t:'Unhooking your self-worth from what others think',p:'If your worth depends on approval, it sways with every glance. This exercise anchors it back inside you.',steps:['Think of something you\\'re proud of that no one else has seen or praised.','Feel that it counts even <em>without<\/em> applause. It was already there.','Say: \"My worth doesn\\'t change if someone doesn\\'t see it for a moment.\"','Imagine your worth is a light burning from within, not switched on by others.'],r:'Who would I be if I no longer needed anyone\\'s approval?'},\n  {t:'Softening the inner critic',p:'The voice that tears you down usually isn\\'t the truth, but old fear. You may speak more lovingly to yourself.',steps:['Catch your critic at a harsh sentence (\"you\\'re doing it wrong again\").','Ask: would I say this to someone I love?','Reformulate it gently: \"I\\'m doing my best, and that\\'s enough.\"','Place a hand on your heart while saying the gentle version.'],r:'How would a loving friend speak to me now?'},\n  {t:'Respect for the other <em>and<\/em> yourself',p:'Respect isn\\'t a choice between yourself <em>or<\/em> the other. It may exist both at once.',steps:['Think of a tension with someone.','First acknowledge the other: \"I understand you need this.\"','Then acknowledge yourself: \"And I need this.\"','Find the sentence that honours both: \"I want to help you, <em>and<\/em> I have to rest first.\"'],r:'Where can I honour both, without erasing myself?'}\n];\n(function(){const w=document.getElementById('respectTools');let h='';respectTools.forEach((x,i)=>{let steps='';x.steps.forEach(s=>{steps+='<div class=\"step\"><span class=\"s-dot\">\u2726<\/span><span class=\"s-txt\">'+s+'<\/span><\/div>';});h+='<div class=\"tool-card\" id=\"rt'+i+'\"><div class=\"tool-head\" onclick=\"toggleTool('+i+')\"><div class=\"num\">'+(i+1)+'<\/div><div class=\"tt\">'+x.t+'<\/div><div class=\"chev\">\u203a<\/div><\/div><div class=\"tool-body\"><div class=\"tool-body-inner\"><p>'+x.p+'<\/p>'+steps+'<div class=\"reflect\">'+x.r+'<\/div><\/div><\/div><\/div>';});w.innerHTML=h;})();\nfunction toggleTool(i){const c=document.getElementById('rt'+i),b=c.querySelector('.tool-body');if(c.classList.contain :uppercase; color:var(--green); margin-bottom:9px; }\n  .reflect-card .q { font-family:var(--serif); font-size:19px; margin-bottom:12px; line-height:1.3; }\n\n  .day-nav { display:flex; gap:10px; margin-top:8px; }\n  .day-nav .btn { flex:1; }\n\n  /* ---- ORAKEL ---- */\n  .stage { display:flex; flex-direction:column; align-items:center; margin:8px 0 4px; }\n  .ocard {\n    width:230px; height:340px; cursor:pointer; perspective:1200px; margin-bottom:20px;\n  }\n  .ocard-inner { position:relative; width:100%; height:100%; transition:transform .8s cubic-bezier(.2,.8,.2,1); transform-style:preserve-3d; }\n  .ocard.flipped .ocard-inner { transform:rotateY(180deg); }\n  .face {\n    position:absolute; inset:0; backface-visibility:hidden; border-radius:22px;\n    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:26px; text-align:center;\n    border:1px solid var(--line); box-shadow:0 14px 40px rgba(0,0,0,.4);\n  }\n  .face-back {\n    background:linear-gradient(160deg,var(--plum),var(--violet));\n    background-image:radial-gradient(circle at 50% 30%, rgba(251,191,36,.15), transparent 60%);\n  }\n  .face-back .glyph { font-size:40px; color:var(--gold); text-shadow:0 0 22px rgba(251,191,36,.6); margin-bottom:14px; }\n  .face-back .tap { font-size:13px; color:var(--text-dim); letter-spacing:1px; }\n  .face-back .border-orn { position:absolute; inset:12px; border:1px solid rgba(251,191,36,.25); border-radius:16px; pointer-events:none; }\n  .face-front {\n    transform:rotateY(180deg);\n    background:linear-gradient(160deg,var(--night),var(--violet));\n    background-image:radial-gradient(circle at 50% 20%, rgba(192,132,252,.18), transparent 60%);\n  }\n  .face-front .oname { font-family:var(--serif); font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); margin-bottom:16px; }\n  .face-front .omsg { font-family:var(--serif); font-size:21px; line-height:1.4; color:var(--text); }\n  .face-front .border-orn { position:absolute; inset:12px; border:1px solid rgba(192,132,252,.3); border-radius:16px; pointer-events:none; }\n\n  .insight {\n    background:linear-gradient(160deg,rgba(110,231,183,.12),var(--mist)); border:1px solid rgba(110,231,183,.3);\n    border-radius:18px; padding:18px; margin-top:8px; animation:fade .5s ease;\n  }\n  .insight .tag { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--green); margin-bottom:8px; }\n  .insight p { font-size:15px; color:var(--text-soft); line-height:1.6; }\n  .insight .pat { font-family:var(--serif); font-style:italic; font-size:18px; color:var(--gold-soft); margin-top:6px; }\n\n  .odraws { margin-top:8px; }\n  .odraw { display:flex; gap:12px; align-items:baseline; padding:11px 0; border-bottom:1px solid var(--line); font-size:14px; }\n  .odraw .od { font-size:11.5px; color:var(--text-dim); letter-spacing:.5px; white-space:nowrap; }\n  .odraw .oc { color:var(--gold-soft); font-family:var(--serif); font-size:16px; }\n  .odraw .om { color:var(--text-dim); font-size:13px; }\n\n  /* Nav */\n  nav {\n    position:fixed; bottom:0; left:0; right:0; z-index:20; display:flex; justify-content:space-around;\n    background:rgba(15,5,32,.82); backdrop-filter:blur(18px); border-top:1px solid var(--line);\n    padding:9px 6px calc(9px + env(safe-area-inset-bottom));\n  }\n  .nav-btn {\n    flex:1; background:none; border:none; cursor:pointer; color:var(--text-dim);\n    font-family:var(--sans); font-size:10.5px; font-weight:400; display:flex; flex-direction:column;\n    align-items:center; gap:4px; padding:5px 2px; transition:color .2s; letter-spacing:.3px;\n  }\n  .nav-btn .ico { font-size:19px; transition:transform .2s; }\n  .nav-btn.active { color:var(--gold-soft); }\n  .nav-btn.active .ico { transform:translateY(-1px) scale(1.08); }\n\n  .toast {\n    position:fixed; left:50%; bottom:calc(110px + env(safe-area-inset-bottom));\n    transform:translateX(-50%) translateY(20px);\n    background:linear-gradient(135deg,var(--gold),var(--gold-deep)); color:#2a1a05;\n    padding:12px 22px; border-radius:100px; font-weight:600; font-size:14px;\n    box-shadow:0 10px 30px rgba(251,191,36,.4); opacity:0; pointer-events:none;\n    transition:all .35s cubic-bezier(.2,.8,.2,1); z-index:50; max-width:90vw; text-align:center;\n  }\n  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }\n  .divlabel { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text-dim); text-align:center; margin:24px 0 14px; }\n\n  /* Instellingen */\n  .section-title { font-family:var(--serif); font-size:27px; font-weight:500; margin:10px 0 4px; }\n  .section-note { color:var(--text-dim); font-size:14px; margin-bottom:20px; }\n  .settings-card {\n    background:linear-gradient(160deg,var(--mist-strong),var(--mist)); border:1px solid var(--line);\n    border-radius:20px; padding:20px; margin-bottom:16px; backdrop-filter:blur(8px);\n  }\n  .settings-card.danger { border-color:rgba(251,113,133,.3); }\n  .settings-card h3 { font-family:var(--serif); font-size:20px; font-weight:500; margin-bottom:12px; }\n  .store-sum { font-size:14px; color:var(--text-soft); line-height:1.7; }\n  .store-sum .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); }\n  .store-sum .row:last-child { border-bottom:none; }\n  .store-note { font-size:13.5px; color:var(--text-dim); line-height:1.6; margin-bottom:16px; }\n  .wipe-row { display:flex; flex-direction:column; gap:10px; }\n  .danger-btn {\n    background:linear-gradient(135deg,#fb7185,#be123c); color:#fff; border:none;\n    box-shadow:0 6px 20px rgba(190,18,60,.3);\n  }\n\n  /* Confirmings-modal */\n  .modal-overlay {\n    position:fixed; inset:0; z-index:100; background:rgba(8,3,18,.78); backdrop-filter:blur(6px);\n    display:flex; align-items:center; justify-content:center; padding:24px;\n    opacity:0; pointer-events:none; transition:opacity .25s;\n  }\n  .modal-overlay.show { opacity:1; pointer-events:auto; }\n  .modal {\n    background:linear-gradient(160deg,var(--violet),var(--night)); border:1px solid var(--line);\n    border-radius:24px; padding:26px 24px; max-width:380px; width:100%;\n    box-shadow:0 24px 60px rgba(0,0,0,.5); transform:translateY(16px) scale(.96); transition:transform .25s cubic-bezier(.2,.8,.2,1);\n  }\n  .modal-overlay.show .modal { transform:translateY(0) scale(1); }\n  .modal .m-icon { font-size:34px; text-align:center; margin-bottom:12px; }\n  .modal h3 { font-family:var(--serif); font-size:24px; font-weight:500; text-align:center; margin-bottom:10px; }\n  .modal p { font-size:14.5px; color:var(--text-soft); text-align:center; line-height:1.6; margin-bottom:8px; }\n  .modal .warn-line { color:#fda4af; font-size:13px; }\n  .modal .confirm-check {\n    display:flex; align-items:flex-start; gap:10px; background:rgba(0,0,0,.25);\n    border:1px solid var(--line); border-radius:13px; padding:13px 14px; margin:16px 0; cursor:pointer;\n    font-size:14px; color:var(--text-soft); line-height:1.4;\n  }\n  .modal .confirm-check input { margin-top:3px; width:18px; height:18px; accent-color:#fb7185; flex-shrink:0; }\n  .modal-actions { display:flex; gap:10px; margin-top:6px; }\n  .modal-actions .btn { flex:1; }\n  nav{display:none!important;} body{padding-bottom:20px!important;}\n<\/style>\n<\/head>\n<body>\n<script>window.__WORLD_PREFIX__='reis';<\/script>\n<script>/* ============================================================\n   OPSLAGBRUG \u2014 ge\u00efnjecteerd in elke wereld-iframe.\n   Vervangt localStorage en window.storage door een proxy\n   die via postMessage met de hoofdapp praat (die de echte\n   window.storage heeft). Sleutels worden geprefixt per wereld.\n   ============================================================ */\n(function(){\n  const WORLD = window.__WORLD_PREFIX__ || 'x';\n  const parent = window.parent;\n  let reqId = 0;\n  const pending = {};\n\n  function call(op, key, value){\n    return new Promise((resolve)=>{\n      const id = ++reqId;\n      pending[id] = resolve;\n      parent.postMessage({ __storageBridge:true, id, op, world:WORLD, key, value }, '*');\n    });\n  }\n  window.addEventListener('message', (e)=>{\n    const d = e.data;\n    if(d && d.__storageBridgeReply && pending[d.id]){ pending[d.id](d.result); delete pending[d.id]; }\n  });\n\n  /* --- async window.storage proxy (voor Reis) --- */\n  window.storage = {\n    get:    (key)        => call('get', key),\n    set:    (key, value) => call('set', key, value),\n    delete: (key)        => call('delete', key),\n    list:   (prefix)     => call('list', prefix || ''),\n  };\n\n  /* --- synchrone localStorage-shim (voor Aurora) ---\n     Houdt een in-memory cache die bij init gevuld is, leest synchroon,\n     en schrijft async door naar de parent. --- */\n  const cache = {};\n  // initi\u00eble cache is al ingebakken door de parent v\u00f3\u00f3r deze iframe laadde\n  try { if (window.__INITIAL_CACHE__) Object.assign(cache, window.__INITIAL_CACHE__); } catch(e){}\n  window.__primeCache = function(obj){ Object.assign(cache, obj || {}); };\n  try {\n    Object.defineProperty(window, 'localStorage', {\n      configurable:true,\n      value: {\n        getItem(k){ return (k in cache) ? cache[k] : null; },\n        setItem(k,v){ cache[k] = String(v); call('lset', k, String(v)); },\n        removeItem(k){ delete cache[k]; call('ldel', k); },\n        clear(){ for(const k in cache) delete cache[k]; call('lclear'); },\n        key(i){ return Object.keys(cache)[i] || null; },\n        get length(){ return Object.keys(cache).length; }\n      }\n    });\n  } catch(e){ /* localStorage already defined; ignore */ }\n\n  /* signaal aan parent dat iframe klaar is en de cache wil */\n  parent.postMessage({ __storageBridge:true, op:'ready', world:WORLD }, '*');\n})();\n<\/script>\n\n<div class=\"stars\" id=\"stars\"><\/div>\n\n<div class=\"wrap\">\n  <header>\n    <div class=\"crest\">\u2726<\/div>\n    <h1>The <em>Journey<\/em><\/h1>\n    <p>28 days that unfold day by day \u2014 and an oracle that gets to know you.<\/p>\n  <\/header>\n\n  <!-- PAD -->\n  <section class=\"panel active\" id=\"pad\">\n    <div id=\"pad-overview\"><\/div>\n    <div id=\"pad-day\" style=\"display:none\"><\/div>\n  <\/section>\n\n  <!-- ORAKEL -->\n  <section class=\"panel\" id=\"orakel\">\n    <div class=\"stage\">\n      <div class=\"ocard\" id=\"ocard\" onclick=\"flipCard()\">\n        <div class=\"ocard-inner\">\n          <div class=\"face face-back\">\n            <div class=\"border-orn\"><\/div>\n            <div class=\"glyph\">\u2726<\/div>\n            <div class=\"tap\">Breathe in \u2014 tap to draw<\/div>\n          <\/div>\n          <div class=\"face face-front\">\n            <div class=\"border-orn\"><\/div>\n            <div class=\"oname\" id=\"o-name\"><\/div>\n            <div class=\"omsg\" id=\"o-msg\"><\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <button class=\"btn\" id=\"o-btn\" onclick=\"drawOracle()\">Draw a card<\/button>\n    <\/div>\n    <div id=\"o-insight\"><\/div>\n    <div class=\"divlabel\" id=\"o-hist-label\" style=\"display:none\">What you drew<\/div>\n    <div class=\"odraws\" id=\"o-history\"><\/div>\n  <\/section>\n\n  <!-- INSTELLINGEN -->\n  <section class=\"panel\" id=\"instellingen\">\n    <h2 class=\"section-title\">Settings<\/h2>\n    <p class=\"section-note\">Your data is stored only on this device. You can clear it here.<\/p>\n\n    <div class=\"settings-card\">\n      <h3>What's saved<\/h3>\n      <div id=\"storage-summary\" class=\"store-sum\">Laden\u2026<\/div>\n    <\/div>\n\n    <div class=\"settings-card danger\">\n      <h3>Clear data<\/h3>\n      <p class=\"store-note\">This can't be undone. Your reflections, progress and draws will be lost.<\/p>\n      <div class=\"wipe-row\">\n        <button class=\"btn ghost full\" onclick=\"confirmWipe('path')\">Clear only the 28-day path<\/button>\n        <button class=\"btn ghost full\" onclick=\"confirmWipe('oracle')\">Clear only the oracle history<\/button>\n        <button class=\"btn danger-btn full\" onclick=\"confirmWipe('all')\">Clear everything<\/button>\n      <\/div>\n    <\/div>\n  <\/section>\n<\/div>\n\n<nav>\n  <button class=\"nav-btn active\" data-panel=\"pad\" onclick=\"go('pad',this)\"><span class=\"ico\">\u2736<\/span>The path<\/button>\n  <button class=\"nav-btn\" data-panel=\"orakel\" onclick=\"go('orakel',this)\"><span class=\"ico\">\u263e<\/span>Oracle<\/button>\n  <button class=\"nav-btn\" data-panel=\"instellingen\" onclick=\"go('instellingen',this)\"><span class=\"ico\">\u2699<\/span>Settings<\/button>\n<\/nav>\n\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<!-- Wis-bevestiging modal -->\n<div class=\"modal-overlay\" id=\"wipe-modal\">\n  <div class=\"modal\">\n    <div class=\"m-icon\">\ud83d\udd6f\ufe0f<\/div>\n    <h3 id=\"wipe-title\">Are you sure?<\/h3>\n    <p id=\"wipe-desc\"><\/p>\n    <p class=\"warn-line\">This can't be undone.<\/p>\n    <label class=\"confirm-check\">\n      <input type=\"checkbox\" id=\"wipe-check\">\n      <span id=\"wipe-check-label\">Yes, I understand this is final.<\/span>\n    <\/label>\n    <div class=\"modal-actions\">\n      <button class=\"btn ghost\" onclick=\"closeWipe()\">Cancel<\/button>\n      <button class=\"btn danger-btn\" id=\"wipe-confirm-btn\" onclick=\"doWipe()\" disabled>Clear<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n/* ============================================================\n   DATA \u2014 28-days pad + orakelkaarten\n   Apart gehouden zodat samenvoegen later makkelijk is.\n   ============================================================ */\n\nconst WEEKS = [\n  { n: 1, title: 'Ruimte maken', sub: 'Letting go what no longer fits', color: '#c084fc' },\n  { n: 2, title: 'Helder zien', sub: 'Knowing what you really want', color: '#fbbf24' },\n  { n: 3, title: 'Afstemmen', sub: 'Je openen om te ontvangen', color: '#6ee7b7' },\n  { n: 4, title: 'Vertrouwen', sub: 'Living as if it\\'s already here', color: '#fb923c' },\n];\n\n/* Elke day:\n   thema, les (2-3 alinea's), oefening (concreet, met titel), affirmatie, reflectievraag */\nconst DAYS = [\n// ---------- WEEK 1 \u2014 MAKING ROOM ----------\n  {\n    day:1, week:1, theme:'The first breath',\n    lesson:`Manifesting doesn't begin with longing \u2014 it begins with room. As long as you're full of old stories, busyness and tension, there's nowhere for anything new to land. Today we do nothing but arrive. No long lists, no big plans. Just a body that breathes again, in a room where you exist. That's already a lot.`,\n    exTitle:'Three breaths, three times a day',\n    exercise:`Set three moments for yourself today \u2014 morning, midday, evening. At each moment: stop, and take three slow breaths. Breathe in for four counts, out for six. That's all. You train your body to know: I am allowed to pause. Without you noticing, this changes everything.`,\n    affirm:'I make room. Something new may come.',\n    reflect:'Where in your life do you currently feel the most busyness or noise?'\n  },\n  {\n    day:2, week:1, theme:'What you hold holds you',\n    lesson:`Anything you're still clinging to \u2014 an old grudge, a disappointment, a version of yourself you've outgrown \u2014 takes up space. Not as punishment, but simply as fact: your hands can't receive while they're squeezing something. Today is about noticing what you're holding on to, not yet about letting go. Awareness is the first half of the work.`,\n    exTitle:'The one thing',\n    exercise:`Write on one note (paper, not your phone) one thing you're carrying with you that no longer serves you. Fold it up. Place it somewhere you'll see it in the coming days. We'll come back to it at the end of week one.`,\n    affirm:'I may set down what\\'s heavy.',\n    reflect:'What are you carrying that no longer needs to be yours?'\n  },\n  {\n    day:3, week:1, theme:'The room of forgiveness',\n    lesson:`Forgiveness is often misunderstood. It doesn't mean what happened was okay. It means you refuse to give it free room in your head any longer. Forgiveness is something you do mostly for yourself \u2014 not because the other deserves it, but because you deserve to be free of it. Today is about that.`,\n    exTitle:'A sentence of forgiveness',\n    exercise:`Choose one person (it can be yourself) and finish this sentence: \"I forgive [name] for [...] \u2014 not because it was okay, but because I no longer want to carry it.\" Say it aloud, write it down, or whisper it into your pillow. Whatever fits.`,\n    affirm:'I give myself the peace of letting go.',\n    reflect:'To whom \u2014 or to which part of yourself \u2014 may you forgive something?'\n  },\n  {\n    day:4, week:1, theme:'Tidy what you see',\n    lesson:`Your outer world and inner world talk to each other. A messy corner, a drawer full of old junk, a phone full of notifications \u2014 they're all small leaks where your attention drains away. You don't have to renovate your whole house. One spot is enough. The energy you free up is greater than you expect.`,\n    exTitle:'One spot, ten minutes',\n    exercise:`Pick one small spot \u2014 a drawer, a shelf, your wallet, your inbox. Set a timer for ten minutes. Clear, throw out, organise. Stop when the timer rings, even if you're not done. Done is better than perfect.`,\n    affirm:'Outer order helps my inner calm.',\n    reflect:'Which spot in your home or life drains the most energy from you?'\n  },\n  {\n    day:5, week:1, theme:'The words you use',\n    lesson:`Listen today to how you talk about your own life. \"It never works for me.\" \"I'm just like that.\" \"That's not for me.\" Those aren't descriptions \u2014 they're instructions you give yourself, over and over. Your brain is loyal: it goes looking for evidence that you're right. Today you check what you keep telling yourself.`,\n    exTitle:'Catch and trade',\n    exercise:`Listen today to your own sentences \u2014 especially the negative ones about yourself. Pick one and trade it for something kinder. Not falsely positive (\"I am amazing\"), but more honest (\"I am still learning, and that's okay\"). Try out the new sentence at least three times today.`,\n    affirm:'I choose words that carry me.',\n    reflect:'Which sentence do you tell yourself that no longer serves you?'\n  },\n  {\n    day:6, week:1, theme:'Enough',\n    lesson:`Before you long for more, today is a day to feel what is already enough. Not as a lesson in contentment that sweeps your wishes under the rug, but as fuel: from enough you attract more strongly than from lack. Lack is a broadcast that you don't have it. Enough is a broadcast that you're already at home in your life.`,\n    exTitle:'Three times enough',\n    exercise:`Name three things today that are already enough. Out loud or on paper. Doesn't have to be big: your bed, that you can read, a friend who exists. Add an honest \"thank you\" \u2014 even just to yourself.`,\n    affirm:'What I have is already enough for now.',\n    reflect:'What do you already have that you usually overlook?'\n  },\n  {\n    day:7, week:1, theme:'Releasing the note',\n    lesson:`At the end of this first week we return to the note from day two. You've noticed it lying there a few times this week. Maybe something has already shifted in how you look at it. Today you don't have to do anything difficult \u2014 only finish what you started.`,\n    exTitle:'The note, the choice',\n    exercise:`Take the note from day two. Read what's on it. Now choose: do you tear it up, burn it safely, bury it, or throw it away with words spoken aloud? It doesn't matter which \u2014 choose what feels right. After: a hand on your heart. Done.`,\n    affirm:'I release what no longer needs to be mine.',\n    reflect:'How does it feel now that you\\'ve let it go \u2014 relief, grief, both?'\n  },\n  // ---------- WEEK 2 \u2014 KNOWING WHAT YOU WANT ----------\n  {\n    day:8, week:2, theme:'What do you really want?',\n    lesson:`Vague longings give vague results. Many people know better what they don't want than what they do want. That's protection: if you choose nothing, you can miss nothing. But you also manifest nothing. This week it gets concrete. Today is about daring to know what you really want.`,\n    exTitle:'The list of ten',\n    exercise:`Set a timer for seven minutes. Write down ten things you really want in your life \u2014 large or small, practical or impossible. Don't think too long, don't censor. Just keep writing until the timer rings. Then read it back.`,\n    affirm:'I dare to know what I want.',\n    reflect:'What surprised you in your list?'\n  },\n  {\n    day:9, week:2, theme:'The feeling under the longing',\n    lesson:`Under every longing lies a feeling. You don't want a house \u2014 you want a feeling of home. Not money \u2014 a feeling of freedom or safety. Not \"him\" or \"her\" \u2014 a feeling of belonging. Today you look for the feeling behind your longing, because that's where the real magnet is.`,\n    exTitle:'Three layers deep',\n    exercise:`Pick one wish from yesterday's list. Ask three times why: \"I want X \u2014 why? Because then I'd feel Y \u2014 why is that important? Because that gives me Z.\" Write down what comes up. The third answer is usually the most honest.`,\n    affirm:'I feel what I really seek.',\n    reflect:'Which feeling lies beneath your biggest wish?'\n  },\n  {\n    day:10, week:2, theme:'Do you allow yourself?',\n    lesson:`Sometimes you don't yet know what you want, but you do know what you don't dare to want. That's not laziness or vagueness \u2014 that's a deeper layer: you don't yet allow yourself to long for it. Often because someone once made it clear \"that's not for you\" or \"don't ask too much\". Today you investigate which permission is missing.`,\n    exTitle:'The forbidden wish',\n    exercise:`Finish this sentence three times: \"If I were truly allowed to want anything, I would want...\" Don't filter. The wishes you find too big, too greedy or too vulnerable \u2014 those are exactly the ones that ask attention.`,\n    affirm:'I give myself permission to want.',\n    reflect:'Which wish have you not yet dared to say aloud?'\n  },\n  {\n    day:11, week:2, theme:'The future image',\n    lesson:`Your brain doesn't sharply distinguish between vividly imagined and actually experienced. Both shape who you become. That's why visualisation works \u2014 not as magic, but as training. The brain learns: this is normal, this is who I am. Today you build a scene of one ordinary day in your future, as concretely as possible.`,\n    exTitle:'One ordinary day, in detail',\n    exercise:`Close your eyes for five minutes. Walk through one ordinary day, two years from now, in a life where the most important things are in place. Where do you wake? What do you eat? Who's there? How does your body feel? Not the big scenes \u2014 the small. Then write down a few details.`,\n    affirm:'I already live the version I am becoming.',\n    reflect:'Which detail of that day touched you most?'\n  },\n  {\n    day:12, week:2, theme:'One clear intention',\n    lesson:`After all this clarification it's time to focus. Trying to manifest ten things at once disperses your energy. Picking one for now isn't a betrayal of the rest \u2014 they get their turn. Today you pick one clear intention to carry as the centre of your weeks ahead. Concrete, in present tense, with a feeling.`,\n    exTitle:'My intention, one sentence',\n    exercise:`Write one sentence in present tense that describes what you intend. Format: \"I... [verb], and feel... [feeling].\" Example: \"I work in a place where my energy grows, and I feel useful.\" Refine it until it really fits. Read it aloud.`,\n    affirm:'I am clear about what I want.',\n    reflect:'What does this intention give you that you didn\\'t have yet?'\n  },\n  {\n    day:13, week:2, theme:'The fear that comes along',\n    lesson:`Every clear longing brings a shadow: fear. What if I want this and it doesn't happen? What if I get it and lose it? What if I'm not worthy of it? That's all normal. Fear isn't a sign to stop, but a sign that this matters. Today you let your fears speak \u2014 not to combat them, but to acknowledge them.`,\n    exTitle:'The fear-letter',\n    exercise:`Write a letter \u2014 addressed to your fear. \"Dear fear, I see you. You're worried about...\" Let the fear say what it's worried about. Then write a short answer: not arguing with it, just acknowledging. \"I hear you. I'm going anyway.\"`,\n    affirm:'My fear may come along \u2014 it doesn\\'t drive.',\n    reflect:'Which fear came along this week?'\n  },\n  {\n    day:14, week:2, theme:'Clear and carried',\n    lesson:`This is the end of week two. You know now what you want, you know why, and you know what's afraid of it. That's already more than most people know about themselves. Today is a day to acknowledge that \u2014 and to rest before next week, when it becomes more practical.`,\n    exTitle:'A small ritual of acknowledgement',\n    exercise:`Take five minutes today, alone, without your phone. Read back what you wrote on day twelve \u2014 your one sentence. Place a hand on your heart and say: \"I know what I want, and I dare to walk towards it.\" Then drink water, breathe out, and continue with your day.`,\n    affirm:'I know my way, and I am carried.',\n    reflect:'What did the past two weeks bring you?'\n  },\n  // ---------- WEEK 3 \u2014 FEELING & TRUSTING ----------\n  {\n    day:15, week:3, theme:'Receiving is a skill',\n    lesson:`Many people can ask, few can receive. The moment something good comes \u2014 a compliment, help, a chance \u2014 they smile it away, minimise it, give back too fast. That's how an opening closes. Receiving is allowing something to actually land. This week begins with a small training in receiving.`,\n    exTitle:'The full \"thank you\"',\n    exercise:`Today say one thing: \"Thank you.\" Without \"but no really\", without \"oh that wasn't anything\", without immediately giving back. Just: thank you, with a breath. Notice your discomfort, and stay with it. The more often, the better.`,\n    affirm:'I am allowed to receive.',\n    reflect:'When did you most recently feel that someone gave you something?'\n  },\n  {\n    day:16, week:3, theme:'Learning to see signs',\n    lesson:`Not everything that happens is \"a sign\" \u2014 but if you only look for hard proof, you miss the soft language of life. A recurring word, an unexpected encounter, a song that suddenly plays. Are they signs or coincidence? It hardly matters. What matters is that the practice of softly watching makes you more open to what comes.`,\n    exTitle:'The sign-list',\n    exercise:`Today gently watch what stands out. A word that returns. A number you keep seeing. A song at the right moment. Write down three observations this evening, without judging them. Not \"what does this mean\" \u2014 just \"I saw this\".`,\n    affirm:'Signs are around me \u2014 I see them.',\n    reflect:'Did anything catch your attention today that you would normally have missed?'\n  },\n  {\n    day:17, week:3, theme:'The art of letting go without giving up',\n    lesson:`This is the trickiest balance in manifesting. Letting go doesn't mean stopping caring. Holding on doesn't mean trying harder. It's like riding a bike: too tight on the handlebars and you wobble, too loose and you fall. Soft trust is what's needed: I'm aiming there, and I let the way to it breathe.`,\n    exTitle:'Soften the grip',\n    exercise:`Pick one thing this week that you're holding tightly \u2014 a wish, a worry, a question that runs through your head. Write: \"I want [...], and I trust the timing.\" Read it once, breathe out, then close the page. Don't check it ten times today.`,\n    affirm:'I aim with a soft hand.',\n    reflect:'Where do you notice you\\'re clutching too hard?'\n  },\n  {\n    day:18, week:3, theme:'Acting from trust',\n    lesson:`Manifesting isn't sitting back. It's acting from a different kind of energy. Action from panic is loud, hectic, draining. Action from trust is calm, light, sometimes even playful. Today you learn the difference \u2014 by paying attention to what your body does when you're about to do something.`,\n    exTitle:'The light step',\n    exercise:`Today pick one action that fits your intention. Check before you do it: does this feel light or heavy? If heavy, ask why. Maybe it's the wrong step, maybe the wrong moment. Take only the action that feels light \u2014 even if it's small.`,\n    affirm:'I move from trust, not from panic.',\n    reflect:'Which action felt light today? Which heavy?'\n  },\n  {\n    day:19, week:3, theme:'Your environment tunes in',\n    lesson:`You are not an island. The people you spend time with, the spaces you sit in, the content you consume \u2014 it all shapes your vibration. Not in a strict way (\"avoid negative people!\"), but soft: notice what fills you and what drains you. Choose more often what fills, where you can.`,\n    exTitle:'The energy-check',\n    exercise:`Today gently check your environment. Which person, app, place or activity gave you energy? Which took it? Don't have to do anything drastic \u2014 just notice. This week, choose once consciously for something that fills you.`,\n    affirm:'I choose what feeds me.',\n    reflect:'Who or what gives you energy without you having to ask for it?'\n  },\n  {\n    day:20, week:3, theme:'Forward with gratitude',\n    lesson:`Gratitude is the shortest path back to your frequency. Not the gratitude of \"you must always be grateful, others have it worse\" \u2014 that doesn't work. Honest gratitude: the small things you actually notice. The first sip of coffee. Your bed. Someone who texted. From that gratitude you move forward, not from a list of complaints.`,\n    exTitle:'Three sips of gratitude',\n    exercise:`Three times today, pause for a moment of gratitude. Morning: one thing for your body. Afternoon: one person. Evening: one thing about your life that surprises you. Write it down, say it, or just feel it. Three times is enough.`,\n    affirm:'Gratitude is my fastest key.',\n    reflect:'Which gratitude surprised you today?'\n  },\n  {\n    day:21, week:3, theme:'Attuned',\n    lesson:`This is the end of week three. You're now more familiar with the feeling, with trusting, with acting lightly. That's a different state than three weeks ago \u2014 even if you don't see it yet. Today is a moment to feel how attuned you are now. Without overthinking.`,\n    exTitle:'A still ten minutes',\n    exercise:`Take ten minutes today, alone, in silence. No phone. No music. Just sit, breathe, and feel where you are now. Don't think \u2014 feel. After ten minutes, write one sentence: \"Right now I feel...\"`,\n    affirm:'I am attuned to my life.',\n    reflect:'What is different now compared to three weeks ago?'\n  },\n  // ---------- WEEK 4 \u2014 LIVING AS IF ----------\n  {\n    day:22, week:4, theme:'Living as if',\n    lesson:`The deepest manifestation principle: you become what you act like. Not \"fake it till you make it\" in a forced way \u2014 but genuinely behaving like the version of you who already has what you want. How does she walk? How does she answer the phone? How does she handle setbacks? Today you become her for one day.`,\n    exTitle:'One day as her/him',\n    exercise:`Pick one day this week \u2014 could be today \u2014 to live consciously as the version of you who already has your intention. Small choices: how she eats, how she rests, what she says yes or no to. Notice what feels strange, and what feels familiar.`,\n    affirm:'I am already who I am becoming.',\n    reflect:'Which detail did \"she\" do differently than the old you?'\n  },\n  {\n    day:23, week:4, theme:'Patience without doubt',\n    lesson:`Patience is hard, especially when you long. Doubt creeps in: \"is it actually coming?\" That doubt is itself a broadcast on \"it isn't here.\" So patience is more than waiting \u2014 it's keeping faith without checking constantly. The trick: trust isn't a feeling, it's a practice. You do it, again and again.`,\n    exTitle:'The trust-line',\n    exercise:`Pick one sentence today that you repeat when impatience comes up. Example: \"It's on the way, and I'm at peace with the timing.\" Use it three times today. Notice that it's a choice, not a feeling. The feeling follows.`,\n    affirm:'I trust the timing of my life.',\n    reflect:'Where does impatience grab you most often?'\n  },\n  {\n    day:24, week:4, theme:'When things go against you',\n    lesson:`No manifestation goes in a straight line. There will be days when you lose faith, when something seems to go backwards, when fear takes over. That's not failure. It's part of the way. Today is about how you handle setback \u2014 not by ignoring it, but by relating to it differently.`,\n    exTitle:'The 60-second reset',\n    exercise:`Next time something goes against you, do this: stop. One hand on your chest, one on your belly. Breathe in for four, out for six, five times. Then say: \"This is a moment, not the whole story.\" Then take one small step that fits with trust.`,\n    affirm:'A setback is a moment, not a verdict.',\n    reflect:'Which setback this week told you something?'\n  },\n  {\n    day:25, week:4, theme:'Generosity opens the flow',\n    lesson:`When you give from abundance (not from duty or emptiness), something strange happens: you feel richer, not poorer. Giving is a broadcast that there's enough. And what you broadcast, you receive back. Today is about giving \u2014 not big, but generous.`,\n    exTitle:'Three small gifts',\n    exercise:`Give three small things today. Could be material (something from your home that someone else can use), time (a message to someone you've been thinking of), or attention (a sincere compliment). Give without expecting anything back. Notice how it feels.`,\n    affirm:'I give from abundance, and the flow stays open.',\n    reflect:'Which giving today felt best?'\n  },\n  {\n    day:26, week:4, theme:'Your own evidence',\n    lesson:`You don't need anyone else's belief to see that something is shifting. Your own evidence is sufficient. Look back at these four weeks: what's different? Maybe small things \u2014 a calmer morning, a thought that no longer chased itself, an action that felt light. That's the proof. Collect it.`,\n    exTitle:'The evidence-list',\n    exercise:`Write down five small things that are different now compared to four weeks ago. Don't have to be impressive \u2014 small counts. \"I breathed once before I answered.\" \"I noticed a sign.\" \"I rested without guilt.\" That's your evidence.`,\n    affirm:'My own evidence is enough.',\n    reflect:'Which change makes you most proud?'\n  },\n  {\n    day:27, week:4, theme:'It becomes a way of life',\n    lesson:`This isn't a 28-day project \u2014 it's an introduction. What you've practised here doesn't end after day 28. It becomes how you live, in flexible form. Not strict, not mandatory. Just available, when you need it. Today you make a simple plan for after.`,\n    exTitle:'My three keepers',\n    exercise:`Pick three things from these weeks that you want to keep. Not all of them \u2014 three is enough. Write them down, in your own words. Example: \"Three breaths, three times a day. One thing of gratitude in the evening. Catching limiting sentences.\" That's your practice from now on.`,\n    affirm:'This is my way, not a project.',\n    reflect:'Which three keepers are coming with you?'\n  },\n  {\n    day:28, week:4, theme:'The end that\\'s a beginning',\n    lesson:`Today is the last day, and at the same time a beginning. What started four weeks ago as something new is now a layer in you. Softly. Not as method, but as way of being. You don't have to do anything special today. Just be \u2014 and notice that you're slightly different than four weeks ago.`,\n
