exTitle:'A letter to yourself, one year on',\n    exercise:`Write a short letter to yourself from one year ago, just before you began. Tell her or him what shifted, what you've learned, what surprised you. Be honest, gentle, brief. After: fold the letter and put it somewhere where, in a year, you'll come across it again.`,\n    affirm:'I keep walking, soft and clear.',\n    reflect:'What did these 28 days bring that you hadn\\'t expected?'\n  }\n\n];\n\n/* ---------- ORACLE ---------- */\n/* Cards with theme-tag so the app can detect patterns */\nconst ORACLE = [\n  { card:'Letting go', msg:'Something in your life is asking to be released. Not by force, but with an open hand.', tag:'letting-go' },\n  { card:'Trust', msg:'You\\'re about to force something that would come on its own. Breathe. It\\'s on the way.', tag:'trust' },\n  { card:'Patience', msg:'What you want is still ripening. That it isn\\'t here doesn\\'t mean it isn\\'t coming.', tag:'patience' },\n  { card:'Receiving', msg:'Open your hands. Something is coming that you can only catch if you don\\'t grab.', tag:'receiving' },\n  { card:'Courage', msg:'The fear you feel is a sign that it matters to you. Move, even if you tremble.', tag:'courage' },\n  { card:'Rest', msg:'You don\\'t have to achieve anything today. The silence itself is the work.', tag:'rest' },\n  { card:'Abundance', msg:'There is more than enough. Give something away and feel the flow restart.', tag:'abundance' },\n  { card:'Clarity', msg:'You actually already know what you want. Stop talking yourself into doubt.', tag:'clarity' },\n  { card:'Signs', msg:'Watch softly in the coming days. You\\'re being winked at, more often than you think.', tag:'signs' },\n  { card:'Self-worth', msg:'You may want this. You are worthy, even if an old voice says otherwise.', tag:'self-worth' },\n  { card:'Connection', msg:'Reach out to someone today. The bridge you\\'re seeking goes through another.', tag:'connection' },\n  { card:'Inspired action', msg:'A small step is presenting itself. Don\\'t postpone \u2014 do it today.', tag:'action' },\n  { card:'Gratitude', msg:'Briefly count what\\'s already here. From enough you attract more strongly than from lack.', tag:'gratitude' },\n  { card:'Forgiveness', msg:'Someone \u2014 maybe yourself \u2014 is still waiting for your forgiveness. It\\'s for your peace.', tag:'forgiveness' },\n  { card:'Protection', msg:'Protect what\\'s still tender. Not every dream belongs out loud, not yet.', tag:'protection' },\n  { card:'Timing', msg:'The detour isn\\'t a mistake. Trust a plan you can\\'t yet oversee.', tag:'timing' },\n  { card:'Embodiment', msg:'Be now who you want to become. Circumstances follow who you are, not the other way around.', tag:'embodiment' },\n  { card:'Space', msg:'Empty something \u2014 a drawer, a schedule, a thought. The new needs room.', tag:'space' },\n];\n\n<\/script>\n<script>\n  /* ---------- Sterren ---------- */\n  (function(){\n    const c=document.getElementById('stars');\n    for(let i=0;i<46;i++){ const s=document.createElement('div'); s.className='star';\n      const sz=Math.random()*2+1; s.style.width=sz+'px'; s.style.height=sz+'px';\n      s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%';\n      s.style.setProperty('--dur',(Math.random()*4+3)+'s'); s.style.setProperty('--max',(Math.random()*.6+.3).toFixed(2));\n      s.style.animationDelay=(Math.random()*5)+'s'; c.appendChild(s);\n    }\n  })();\n\n  function esc(s){ return (s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); }\n  let toastT;\n  function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }\n\n  function go(id,el){\n    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));\n    document.getElementById(id).classList.add('active');\n    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));\n    el.classList.add('active');\n    window.scrollTo({top:0,behavior:'smooth'});\n    if(id==='pad') renderPad();\n    if(id==='orakel') renderOracle();\n    if(id==='instellingen') renderSettings();\n  }\n\n  /* ============================================================\n     PAD \u2014 voortgang & day-ontvouwing\n     Opslag:\n       path:progress  -> { unlocked:int (hoogste vrijgespeelde day), done:[daynummers], started:ts, lastDone:dateStr }\n     Een nieuwe day komt vrij als de vorige is afgerond \u00c9N er een nieuwe kalenderday is.\n     ============================================================ */\n  const todayStr = ()=> new Date().toISOString().slice(0,10);\n\n  async function getProgress(){\n    try{ const r=await window.storage.get('path:progress'); if(r) return JSON.parse(r.value); }catch(e){}\n    return { unlocked:1, done:[], started:null, lastDone:null };\n  }\n  async function setProgress(p){ try{ await window.storage.set('path:progress', JSON.stringify(p)); }catch(e){} }\n\n  let viewingDay = null;\n\n  async function renderPad(){\n    const p = await getProgress();\n    const ov = document.getElementById('pad-overview');\n    const dv = document.getElementById('pad-day');\n    dv.style.display='none'; ov.style.display='block';\n\n    const doneCount = p.done.length;\n    const pct = Math.round(doneCount/28*100);\n\n    let weeksHtml = WEEKS.map(w=>{\n      const days = DAYS.filter(d=>d.week===w.n);\n      const dots = days.map(d=>{\n        const done = p.done.includes(d.day);\n        const unlocked = d.day <= p.unlocked;\n        const today = d.day===p.unlocked && !done;\n        let cls='day-dot'; if(done)cls+=' done'; else if(!unlocked)cls+=' locked'; if(today)cls+=' today';\n        const inner = unlocked ? d.day : '<span class=\"lock\">\ud83d\udd12<\/span>';\n        const onclick = unlocked ? `onclick=\"openDay(${d.day})\"` : '';\n        return `<div class=\"${cls}\" ${onclick}>${inner}<\/div>`;\n      }).join('');\n      return `<div class=\"week-block\">\n        <div class=\"week-head\"><span class=\"wn\">Week ${w.n}<\/span><span class=\"wt\" style=\"color:${w.color}\">${w.title}<\/span><\/div>\n        <div style=\"font-size:12.5px;color:var(--text-dim);margin:-8px 0 12px 2px\">${w.sub}<\/div>\n        <div class=\"day-grid\">${dots}<\/div>\n      <\/div>`;\n    }).join('');\n\n    const goBtn = (p.unlocked>0 && !p.done.includes(p.unlocked))\n      ? '<div style=\"text-align:center;margin-bottom:20px\"><button class=\"btn\" onclick=\"openDay('+p.unlocked+')\">Go to day '+p.unlocked+' \u2192<\/button><\/div>'\n      : '';\n\n    ov.innerHTML = `\n      <div class=\"progress-ring\">\n        <div class=\"big\">${doneCount}<span style=\"font-size:24px;color:var(--text-dim)\">/28<\/span><\/div>\n        <div class=\"small\">days completed${doneCount===28?' \u2014 je hebt het pad afgerond \u2726':''}<\/div>\n        <div class=\"track-bar\"><div class=\"track-fill\" style=\"width:${pct}%\"><\/div><\/div>\n      <\/div>\n      ${goBtn}\n      ${weeksHtml}\n      <p class=\"hint\" style=\"text-align:center;margin-top:8px\">Each day opens one new step. A new day wakes only after you\\'ve completed the previous one <em>and<\/em> a new morning has arrived.<\/p>\n    `;\n  }\n\n  async function openDay(n){\n    const p = await getProgress();\n    if(n > p.unlocked) return;\n    viewingDay = n;\n    const d = DAYS.find(x=>x.day===n);\n    const w = WEEKS.find(x=>x.n===d.week);\n    const done = p.done.includes(n);\n    const ov=document.getElementById('pad-overview'); const dv=document.getElementById('pad-day');\n    ov.style.display='none'; dv.style.display='block'; dv.className='day-view';\n\n    const lessonHtml = d.lesson.split('\\n\\n').map(par=>`<p>${esc(par)}<\/p>`).join('');\n\n    dv.innerHTML = `\n      <button class=\"btn ghost sm\" onclick=\"renderPad()\" style=\"margin-bottom:16px\">\u2190 Overzicht<\/button>\n      <div class=\"day-meta\">\n        <span class=\"wk\" style=\"color:${w.color}\">Week ${w.n} \u00b7 ${esc(w.title)}<\/span>\n        <span class=\"day-num\">Day ${d.day}<\/span>\n      <\/div>\n      <div class=\"day-theme\">${esc(d.theme)}<\/div>\n      <div class=\"lesson\">${lessonHtml}<\/div>\n\n      <div class=\"ex-card\">\n        <div class=\"tag\">Exercise van vandaag<\/div>\n        <h4>${esc(d.exTitle)}<\/h4>\n        <p>${esc(d.exercise)}<\/p>\n      <\/div>\n\n      <div class=\"affirm-card\">\n        <div class=\"tag\">Affirmation<\/div>\n        <div class=\"txt\">\"${esc(d.affirm)}\"<\/div>\n      <\/div>\n\n      <div class=\"reflect-card\">\n        <div class=\"tag\">Reflection<\/div>\n        <div class=\"q\">${esc(d.reflect)}<\/div>\n        <textarea id=\"reflect-input\" placeholder=\"Write what comes up\u2026 (will be saved)\"><\/textarea>\n        <div class=\"status\" id=\"reflect-status\"><\/div>\n      <\/div>\n\n      <div class=\"day-nav\">\n        ${ done\n          ? '<button class=\"btn ghost full\" onclick=\"saveReflection('+n+')\">Save reflection<\/button>'\n          : '<button class=\"btn full\" onclick=\"completeDay('+n+')\">Day '+n+' afronden \u2726<\/button>' }\n      <\/div>\n      ${ done && n<28 ? (\n          '<div style=\"margin-top:14px; text-align:center\">' +\n          ( p.unlocked > n\n            ? '<button class=\"btn full\" onclick=\"openDay('+(n+1)+')\">Continue to day '+(n+1)+' \u2192<\/button>'\n            : '<p class=\"hint\">Day '+(n+1)+' opens automatically tomorrow morning \u2014 that\\'s how the path keeps its rhythm.<\/p>'+\n              '<button class=\"btn ghost sm\" style=\"margin-top:10px\" onclick=\"unlockNextNow('+n+')\">Ik wil vandaag al verder \u2192<\/button>'\n          ) + '<\/div>'\n        ) : '' }\n      ${ done && n===28 ? '<p class=\"hint\" style=\"text-align:center;margin-top:14px\">You\\'ve completed all 28 days. \u2726 You may start the path again whenever you wish \u2014 via the overview.<\/p>' : '' }\n    `;\n\n    // bestaande reflectie laden\n    try{ const r=await window.storage.get('path:reflect:'+n); if(r){ document.getElementById('reflect-input').value=JSON.parse(r.value).text||''; } }catch(e){}\n    window.scrollTo({top:0,behavior:'smooth'});\n  }\n\n  async function saveReflection(n){\n    const txt = document.getElementById('reflect-input').value.trim();\n    try{ await window.storage.set('path:reflect:'+n, JSON.stringify({text:txt, ts:Date.now()})); \n      const st=document.getElementById('reflect-status'); st.textContent='Saved \u2726'; setTimeout(()=>st.textContent='',2500);\n    }catch(e){}\n  }\n\n  async function completeDay(n){\n    await saveReflection(n);\n    const p = await getProgress();\n    if(!p.done.includes(n)) p.done.push(n);\n    if(!p.started) p.started = Date.now();\n    p.lastDone = todayStr();\n    await setProgress(p);\n    toast(n===28 ? 'Je hebt het pad completed \u2726' : 'Day '+n+' afgerond \u2726');\n    await maybeUnlockNext();\n    openDay(n); // herlaad de day zodat de juiste vervolgknop verschijnt\n  }\n\n  // Handmatig de volgende day vrijspelen (eigen tempo)\n  async function unlockNextNow(n){\n    const p = await getProgress();\n    if(n === p.unlocked && n < 28){ p.unlocked = n+1; await setProgress(p); }\n    openDay(n+1);\n  }\n\n  // Speelt de volgende day vrij als laatste afgeronde day op een eerdere kalenderday was\n  async function maybeUnlockNext(){\n    const p = await getProgress();\n    const top = p.unlocked;\n    if(p.done.includes(top) && top<28){\n      // is er sinds afronden een nieuwe day aangebroken?\n      if(p.lastDone && p.lastDone !== todayStr()){\n        p.unlocked = top+1; await setProgress(p);\n      }\n    }\n  }\n\n  /* ============================================================\n     ORAKEL \u2014 trekken + patroonherkenning\n     Opslag: oracle:history -> [{ts, card, msg, tag}]  (max ~60 bewaard)\n     ============================================================ */\n  let currentDraw = null, isFlipped=false;\n\n  async function getHistory(){\n    try{ const r=await window.storage.get('oracle:history'); if(r) return JSON.parse(r.value); }catch(e){}\n    return [];\n  }\n  async function setHistory(h){ try{ await window.storage.set('oracle:history', JSON.stringify(h.slice(-60))); }catch(e){} }\n\n  function flipCard(){\n    if(!currentDraw) return;\n    isFlipped=!isFlipped;\n    document.getElementById('ocard').classList.toggle('flipped',isFlipped);\n  }\n\n  async function drawOracle(){\n    const card = ORACLE[Math.floor(Math.random()*ORACLE.length)];\n    currentDraw = card;\n    document.getElementById('o-name').textContent = card.card;\n    document.getElementById('o-msg').textContent = card.msg;\n    // flip animatie\n    const oc=document.getElementById('ocard');\n    oc.classList.remove('flipped'); isFlipped=false;\n    setTimeout(()=>{ oc.classList.add('flipped'); isFlipped=true; },80);\n    document.getElementById('o-btn').textContent='Trek opnieuw';\n\n    // opslaan\n    const h = await getHistory();\n    h.push({ ts:Date.now(), card:card.card, msg:card.msg, tag:card.tag });\n    await setHistory(h);\n    setTimeout(()=>renderInsight(h), 850);\n    renderHistory(h);\n  }\n\n  function fmtShort(ts){ const d=new Date(ts); return d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'}); }\n\n  function renderInsight(h){\n    const box=document.getElementById('o-insight');\n    if(h.length<3){ box.innerHTML=''; return; }\n    // kijk naar laatste 7 trekkingen\n    const recent = h.slice(-7);\n    const counts = {};\n    recent.forEach(x=>{ counts[x.tag]=(counts[x.tag]||0)+1; });\n    const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);\n    const [topTag, topN] = sorted[0];\n    const topCardName = (recent.slice().reverse().find(x=>x.tag===topTag)||{}).card || topTag;\n\n    const themeWord = {\n      loslaten:'loslaten', vertrouwen:'vertrouwen', geduld:'geduld', ontvangen:'ontvangen',\n      moed:'moed', rust:'rust', overvloed:'overvloed', helderheid:'helderheid', tekens:'tekens lezen',\n      eigenwaarde:'je eigenwaarde', verbinding:'verbinding', handelen:'in actie komen',\n      dankbaarheid:'dankbaarheid', vergeving:'vergeving', bescherming:'bescherming',\n      timing:'timing', belichaming:'belichaming', ruimte:'ruimte maken'\n    }[topTag] || topTag;\n\n    let body;\n    if(topN>=3){\n      body = `<p>The cards keep bringing you back to <span class=\"pat\">${esc(themeWord)}<\/span>. Three or more times in your last draws. That\\'s no coincidence \u2014 this theme truly asks your attention now.<\/p>`;\n    } else if(topN===2){\n      body = `<p>Je trekt de laatste tijd vaker rond <span class=\"pat\">${esc(themeWord)}<\/span>. Something in you knows what it\\'s about. Stay softly with it.<\/p>`;\n    } else {\n      body = `<p>Your draws are varied \u2014 you\\'re open to what comes. The thread now lies mainly in <span class=\"pat\">${esc(themeWord)}<\/span>.<\/p>`;\n    }\n    box.innerHTML = `<div class=\"insight\"><div class=\"tag\">What the oracle sees in you<\/div>${body}<\/div>`;\n  }\n\n  function renderHistory(h){\n    const lab=document.getElementById('o-hist-label');\n    const wrap=document.getElementById('o-history');\n    if(!h.length){ lab.style.display='none'; wrap.innerHTML=''; return; }\n    lab.style.display='block';\n    wrap.innerHTML = h.slice().reverse().slice(0,12).map(x=>`\n      <div class=\"odraw\"><span class=\"od\">${fmtShort(x.ts)}<\/span><span class=\"oc\">${esc(x.card)}<\/span><\/div>\n    `).join('');\n  }\n\n  async function renderOracle(){\n    const h = await getHistory();\n    renderHistory(h);\n    if(h.length>=3) renderInsight(h); else document.getElementById('o-insight').innerHTML='';\n  }\n\n  /* ============================================================\n     INSTELLINGEN \u2014 overzicht + wissen met dubbele bevestiging\n     ============================================================ */\n  async function renderSettings(){\n    const sum = document.getElementById('storage-summary');\n    const p = await getProgress();\n    const h = await getHistory();\n    // tel reflecties\n    let reflectCount = 0;\n    try{\n      const res = await window.storage.list('path:reflect:');\n      if(res && res.keys) reflectCount = res.keys.length;\n    }catch(e){}\n    sum.innerHTML =\n      '<div class=\"row\"><span>Voltooide days<\/span><span>'+p.done.length+' / 28<\/span><\/div>' +\n      '<div class=\"row\"><span>Geschreven reflecties<\/span><span>'+reflectCount+'<\/span><\/div>' +\n      '<div class=\"row\"><span>Orakel-trekkingen<\/span><span>'+h.length+'<\/span><\/div>';\n  }\n\n  let wipeScope = null;\n  function confirmWipe(scope){\n    wipeScope = scope;\n    const titles = { path:'Het 28-days pad wissen?', oracle:'Orakel-geschiedenis wissen?', all:'Alles wissen?' };\n    const descs = {\n      path:'Je voortgang en alle geschreven reflecties van het pad worden verwijderd. Het orakel blijft bewaard.',\n      oracle:'All your oracle draws and pattern insight will be deleted. Your path stays saved.',\n      all:'Everything will be deleted: your path progress, your reflections <em>and<\/em> your oracle history. The app starts fresh.'\n    };\n    const checkLabels = {\n      path:'Ja, wis mijn pad-voortgang en reflecties.',\n      oracle:'Ja, wis mijn orakel-geschiedenis.',\n      all:'Yes, I understand that <em>all<\/em> my data will be permanently deleted.'\n    };\n    document.getElementById('wipe-title').textContent = titles[scope];\n    document.getElementById('wipe-desc').textContent = descs[scope];\n    document.getElementById('wipe-check-label').textContent = checkLabels[scope];\n    const chk = document.getElementById('wipe-check');\n    const btn = document.getElementById('wipe-confirm-btn');\n    chk.checked = false; btn.disabled = true;\n    chk.onchange = ()=>{ btn.disabled = !chk.checked; };\n    document.getElementById('wipe-modal').classList.add('show');\n  }\n  function closeWipe(){\n    document.getElementById('wipe-modal').classList.remove('show');\n    wipeScope = null;\n  }\n  async function doWipe(){\n    if(!document.getElementById('wipe-check').checked) return;\n    try{\n      if(wipeScope==='path' || wipeScope==='all'){\n        await window.storage.delete('path:progress');\n        const res = await window.storage.list('path:');\n        if(res && res.keys){ for(const k of res.keys){ try{ await window.storage.delete(k); }catch(e){} } }\n      }\n      if(wipeScope==='oracle' || wipeScope==='all'){\n        await window.storage.delete('oracle:history');\n      }\n    }catch(e){}\n    closeWipe();\n    toast('Gegevens gewist');\n    // herlaad relevante schermen\n    currentDraw=null; isFlipped=false;\n    const oc=document.getElementById('ocard'); if(oc) oc.classList.remove('flipped');\n    document.getElementById('o-name').textContent=''; document.getElementById('o-msg').textContent='';\n    document.getElementById('o-btn').textContent='Draw a card';\n    document.getElementById('o-insight').innerHTML='';\n    await maybeUnlockNext();\n    renderSettings();\n    renderPad();\n    renderOracle();\n  }\n\n  /* ---------- init ---------- */\n  (async function(){\n    await maybeUnlockNext();\n    renderPad();\n  })();\n<\/script>\n<\/body>\n<\/html>\n", kaarten: "<!DOCTYPE html>\n<html lang=\"nl\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n<title>Cards \u2014 preview<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --deep:#0f0520;--night:#1a0b2e;--violet:#2d1b4e;--plum:#4a2670;\n    --orchid:#7c3aed;--rose:#c084fc;--gold:#fbbf24;--gold-soft:#fde68a;--gold-deep:#d97706;\n    --green:#6ee7b7;--line:rgba(255,255,255,.10);--mist:rgba(255,255,255,.06);--mist-strong:rgba(255,255,255,.12);\n    --text:#f5e6ff;--text-soft:#d4c5e8;--text-dim:#9b89b8;\n    --serif:'Cormorant Garamond',Georgia,serif;--sans:'Outfit',system-ui,sans-serif;\n  }\n  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}\n  html,body{background:var(--deep);color:var(--text);font-family:var(--sans);font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased;}\n  body{background:radial-gradient(ellipse at 20% 0%,rgba(124,58,237,.28) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(251,191,36,.12) 0%,transparent 50%),linear-gradient(180deg,var(--deep),var(--night) 50%,var(--deep));background-attachment:fixed;min-height:100vh;padding:30px 0 60px;}\n  .wrap{max-width:640px;margin:0 auto;padding:0 18px;}\n  h1{font-family:var(--serif);font-weight:500;font-size:34px;text-align:center;margin-bottom:6px;}\n  h1 em{font-style:italic;color:var(--gold-soft);}\n  .lead{text-align:center;color:var(--text-dim);font-size:14px;margin-bottom:26px;}\n\n  /* deck-keuze */\n  .deck-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}\n  .deck-btn{\n    text-align:left;background:linear-gradient(160deg,var(--mist-strong),var(--mist));border:1px solid var(--line);\n    border-radius:18px;padding:16px;cursor:pointer;transition:transform .2s,border-color .2s;\n  }\n  .deck-btn:hover,.deck-btn.active{transform:translateY(-2px);border-color:var(--rose);}\n  .deck-btn .dn{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:18px;font-weight:500;margin-bottom:3px;}\n  .deck-btn .dot{width:9px;height:9px;border-radius:50%;}\n  .deck-btn .ds{font-size:12px;color:var(--text-dim);line-height:1.4;}\n  .deck-btn .dc{font-size:11px;color:var(--text-dim);margin-top:6px;opacity:.7;}\n\n  /* kaart */\n  .stage{display:flex;flex-direction:column;align-items:center;margin:6px 0;}\n  .card{width:250px;height:370px;cursor:pointer;perspective:1300px;margin-bottom:18px;}\n  .card-inner{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;}\n  .card.flipped .card-inner{transform:rotateY(180deg);}\n  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;border:1px solid var(--line);box-shadow:0 16px 44px rgba(0,0,0,.45);}\n  .face-back{background:linear-gradient(160deg,var(--plum),var(--violet));background-image:radial-gradient(circle at 50% 30%,rgba(251,191,36,.16),transparent 60%);}\n  .face-back .glyph{font-size:44px;color:var(--gold);text-shadow:0 0 24px rgba(251,191,36,.6);margin-bottom:14px;animation:breathe 4s ease-in-out infinite;}\n  @keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}\n  .face-back .tap{font-size:13px;color:var(--text-dim);letter-spacing:1px;}\n  .orn{position:absolute;inset:13px;border:1px solid rgba(251,191,36,.25);border-radius:17px;pointer-events:none;}\n  .face-front{transform:rotateY(180deg);background:linear-gradient(160deg,var(--night),var(--violet));background-image:radial-gradient(circle at 50% 18%,rgba(192,132,252,.18),transparent 60%);overflow-y:auto;}\n  .face-front .csym{font-size:34px;margin-bottom:10px;}\n  .face-front .cname{font-family:var(--serif);font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;}\n  .face-front .cmsg{font-family:var(--serif);font-size:20px;line-height:1.4;color:var(--text);margin-bottom:12px;}\n  .face-front .cexpl{font-size:13px;color:var(--text-soft);line-height:1.55;margin-bottom:10px;}\n  .face-front .cdoing{font-size:13px;color:var(--gold-soft);font-style:italic;}\n  .face-front .cby{font-size:12px;color:var(--text-dim);margin-top:8px;}\n  .face-front .orn{border-color:rgba(192,132,252,.3);}\n\n  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#2a1a05;border:none;border-radius:100px;padding:13px 26px;font-family:var(--sans);font-weight:600;font-size:15px;cursor:pointer;transition:transform .15s;box-shadow:0 6px 20px rgba(251,191,36,.3);}\n  .btn:active{transform:scale(.97);}\n\n  .insight{background:linear-gradient(160deg,rgba(110,231,183,.12),var(--mist));border:1px solid rgba(110,231,183,.3);border-radius:18px;padding:18px;margin-top:20px;animation:fade .5s ease;}\n  @keyframes fade{from{opacity:0}to{opacity:1}}\n  .insight .tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-bottom:8px;}\n  .insight p{font-size:15px;color:var(--text-soft);line-height:1.6;}\n  .insight .pat{font-family:var(--serif);font-style:italic;color:var(--gold-soft);}\n  .divlabel{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);text-align:center;margin:26px 0 12px;}\n  .hist{font-size:13.5px;}\n  .hrow{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);}\n  .hrow .hd{font-size:11.5px;color:var(--text-dim);white-space:nowrap;}\n  .hrow .hc{color:var(--gold-soft);font-family:var(--serif);font-size:16px;}\n  .hrow .hk{margin-left:auto;font-size:11px;color:var(--text-dim);}\n<\/style>\n<\/head>\n<body>\n<script>window.__WORLD_PREFIX__='kaarten';<\/script>\n<script>/* ============================================================\n   OPSLAGBRUG \u2014 ge\u00efnjecteerd in elke wereld-iframe.\n   Vervangt localStorage en window.storage door een proxy\n   die via postMessage met de hoofdapp praat (die de echte\n   window.storage heeft). Sleutels worden geprefixt per wereld.\n   ============================================================ */\n(function(){\n  const WORLD = window.__WORLD_PREFIX__ || 'x';\n  const parent = window.parent;\n  let reqId = 0;\n  const pending = {};\n\n  function call(op, key, value){\n    return new Promise((resolve)=>{\n      const id = ++reqId;\n      pending[id] = resolve;\n      parent.postMessage({ __storageBridge:true, id, op, world:WORLD, key, value }, '*');\n    });\n  }\n  window.addEventListener('message', (e)=>{\n    const d = e.data;\n    if(d && d.__storageBridgeReply && pending[d.id]){ pending[d.id](d.result); delete pending[d.id]; }\n  });\n\n  /* --- async window.storage proxy (voor Reis) --- */\n  window.storage = {\n    get:    (key)        => call('get', key),\n    set:    (key, value) => call('set', key, value),\n    delete: (key)        => call('delete', key),\n    list:   (prefix)     => call('list', prefix || ''),\n  };\n\n  /* --- synchrone localStorage-shim (voor Aurora) ---\n     Houdt een in-memory cache die bij init gevuld is, leest synchroon,\n     en schrijft async door naar de parent. --- */\n  const cache = {};\n  // initi\u00eble cache is al ingebakken door de parent v\u00f3\u00f3r deze iframe laadde\n  try { if (window.__INITIAL_CACHE__) Object.assign(cache, window.__INITIAL_CACHE__); } catch(e){}\n  window.__primeCache = function(obj){ Object.assign(cache, obj || {}); };\n  try {\n    Object.defineProperty(window, 'localStorage', {\n      configurable:true,\n      value: {\n        getItem(k){ return (k in cache) ? cache[k] : null; },\n        setItem(k,v){ cache[k] = String(v); call('lset', k, String(v)); },\n        removeItem(k){ delete cache[k]; call('ldel', k); },\n        clear(){ for(const k in cache) delete cache[k]; call('lclear'); },\n        key(i){ return Object.keys(cache)[i] || null; },\n        get length(){ return Object.keys(cache).length; }\n      }\n    });\n  } catch(e){ /* localStorage already defined; ignore */ }\n\n  /* signaal aan parent dat iframe klaar is en de cache wil */\n  parent.postMessage({ __storageBridge:true, op:'ready', world:WORLD }, '*');\n})();\n<\/script>\n\n<div class=\"wrap\">\n  <h1>The <em>Cards<\/em><\/h1>\n  <p class=\"lead\">Choose a deck that fits where you are now. Breathe in, and draw.<\/p>\n\n  <div class=\"deck-row\" id=\"deck-row\"><\/div>\n\n  <div class=\"stage\">\n    <div class=\"card\" id=\"card\" onclick=\"flipCard()\">\n      <div class=\"card-inner\">\n        <div class=\"face face-back\"><div class=\"orn\"><\/div><div class=\"glyph\">\u2726<\/div><div class=\"tap\">Tap to draw<\/div><\/div>\n        <div class=\"face face-front\"><div class=\"orn\"><\/div>\n          <div class=\"csym\" id=\"c-sym\"><\/div>\n          <div class=\"cname\" id=\"c-name\"><\/div>\n          <div class=\"cmsg\" id=\"c-msg\"><\/div>\n          <div class=\"cexpl\" id=\"c-expl\"><\/div>\n          <div class=\"cdoing\" id=\"c-doing\"><\/div>\n          <div class=\"cby\" id=\"c-by\"><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <button class=\"btn\" id=\"draw-btn\" onclick=\"drawCard()\">Draw a card<\/button>\n  <\/div>\n\n  <div id=\"insight\"><\/div>\n  <div class=\"divlabel\" id=\"hist-label\" style=\"display:none\">What you drew<\/div>\n  <div class=\"hist\" id=\"hist\"><\/div>\n<\/div>\n\n<script>const DECKS = [{\"id\": \"dag\", \"naam\": \"Daily card\", \"sub\": \"A line to colour your day with\", \"kleur\": \"#fbbf24\", \"type\": \"quote\", \"cards\": [{\"msg\": \"You don't attract what you want. You attract what you are.\", \"by\": \"Unknown\"}, {\"msg\": \"Thoughts become things. Choose the beautiful ones.\", \"by\": \"Mike Dooley\"}, {\"msg\": \"The universal law is: be, do, have. Not: do, have, be.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"It's done from the moment you truly feel it.\", \"by\": \"Neville Goddard\"}, {\"msg\": \"Nothing in nature blooms all year. Don't expect that of yourself.\", \"by\": \"Unknown\"}, {\"msg\": \"What is meant for you won't miss you.\", \"by\": \"Unknown\"}, {\"msg\": \"Be grateful for what you have. You'll receive more in the end.\", \"by\": \"Oprah Winfrey\"}, {\"msg\": \"Imagination is the workshop of the universe.\", \"by\": \"Albert Einstein\"}, {\"msg\": \"Trust is courage in silence.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"You don't have to know how. You only have to say yes when it comes.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"The how isn't your work. The why is.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"Waiting without living is a prison. Living without waiting is a miracle.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"Letting go isn't stopping. It's letting go of the squeeze.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"Frequency changes. Circumstances follow.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"The outer world is the echo of your inner world.\", \"by\": \"Unknown\"}, {\"msg\": \"Your future is listening. Speak softly and beautifully.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"Manifestation isn't a wish. It's a state.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"You're manifesting right now too. Ask yourself: what am I broadcasting?\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"The universe doesn't respond to what you ask. It responds to who you are.\", \"by\": \"Unknown\"}, {\"msg\": \"Happiness isn't a place to arrive. It's a way of travelling.\", \"by\": \"Margaret Lee Runbeck\"}, {\"msg\": \"You aren't a drop in the ocean. You are the whole ocean in a drop.\", \"by\": \"Rumi\"}, {\"msg\": \"When you change how you look at things, the things you look at change.\", \"by\": \"Wayne Dyer\"}, {\"msg\": \"What you resist, persists. What you embrace, transforms.\", \"by\": \"Carl Jung\"}, {\"msg\": \"Don't give the universe a wish. Give it a feeling.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"Your dreams know the way. Walk with them, not ahead of them.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"What you radiate today, you'll meet tomorrow.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"The most beautiful things often manifest in ways you could never have planned.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"Trust the rhythm. Not everything is always spring.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"The universe isn't in a hurry. You are. That's the difference.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"How you talk about yourself is a spell. Be careful with your words.\", \"by\": \"Unknown\"}, {\"msg\": \"You don't change the world by pulling at it. You change it by shining into it.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"Not everything that grows slowly grows wrong.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"Pretend \u2014 not to lie, but to remind yourself who you already are.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"What you truly want, wants you too.\", \"by\": \"Unknown\"}, {\"msg\": \"A content heart is the strongest magnet.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"Manifestation without rest is just work in spiritual clothes.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"Change doesn't begin with doing. It begins with believing you're allowed to.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"It isn't \\\"believing and seeing\\\". It's believing, and <em>then<\/em> seeing.\", \"by\": \"Unknown\"}, {\"msg\": \"Pleasure isn't a luxury. Pleasure is frequency.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"The right people find you when you're yourself. The wrong ones disappear on their own.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"Between longing and receiving lies trust. Not waiting \u2014 trusting.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"You're not late. You're right on time for your own life.\", \"by\": \"Unknown\"}, {\"msg\": \"What you can't see may already be on the way.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"Be gentle with the version of you still learning.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"Stop surviving. Start attuning.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"What you say to yourself each morning builds a life.\", \"by\": \"Unknown\"}, {\"msg\": \"The universe doesn't send letters. It sends feelings.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"Enjoying where you are now is the fastest path to where you want to go.\", \"by\": \"Abraham Hicks\"}, {\"msg\": \"Asking, believing, receiving. Especially the third.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"One breath can turn a day around. Move, breathe, recover.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"Doubt isn't the absence of belief. It's belief under stress.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"Every day is a new offer. What are you saying yes to today?\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"Manifestation is a dance, not a request.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"Be the person you're looking for now.\", \"by\": \"Manifestation Guide\"}, {\"msg\": \"Magic doesn't ask for perfection. Only for consistency.\", \"by\": \"Manifestation Guide\"}]}, {\"id\": \"orakel\", \"naam\": \"The Oracle\", \"sub\": \"A message to reflect on\", \"kleur\": \"#c084fc\", \"type\": \"oracle\", \"cards\": [{\"name\": \"Letting go\", \"symbol\": \"\ud83d\udd4a\ufe0f\", \"msg\": \"You're holding on to something that's already gone. The universe can't bring anything new into full hands. Open them.\"}, {\"name\": \"Beginning\", \"symbol\": \"\ud83c\udf31\", \"msg\": \"What you're postponing is exactly what you must start. The perfect conditions arrive while walking, not before.\"}, {\"name\": \"Patience\", \"symbol\": \"\u23f3\", \"msg\": \"It's on the way. Don't speed it up by worrying \u2014 speed it up by trusting it.\"}, {\"name\": \"Self-worth\", \"symbol\": \"\ud83c\udf39\", \"msg\": \"You attract what you think you're worth. The work isn't in doing more \u2014 it's in believing you deserve it.\"}, {\"name\": \"Action\", \"symbol\": \"\ud83d\udd25\", \"msg\": \"Visualising alone isn't enough. The universe also expects a step from you. Which small action are you avoiding?\"}, {\"name\": \"Flow\", \"symbol\": \"\ud83c\udf0a\", \"msg\": \"Stop pushing. The current knows the way. Your job is rowing, not digging the river.\"}, {\"name\": \"Mirror\", \"symbol\": \"\ud83e\ude9e\", \"msg\": \"What you see in others is a mirror. What irritates you today? There's a message there for yourself.\"}, {\"name\": \"Value\", \"symbol\": \"\ud83d\udc8e\", \"msg\": \"The longing you feel isn't coincidence. You aren't greedy \u2014 you're on your way.\"}, {\"name\": \"Key\", \"symbol\": \"\ud83d\udddd\ufe0f\", \"msg\": \"You've already received the answer to your question. Maybe yesterday, maybe a week ago. Look back.\"}, {\"name\": \"Silence\", \"symbol\": \"\ud83c\udf19\", \"msg\": \"Not everything asks for action. Sometimes the highest manifestation is: rest and don't decide. Trust the emptiness.\"}, {\"name\": \"Clarity\", \"symbol\": \"\u2600\ufe0f\", \"msg\": \"You know the answer. You doubt whether you're allowed to know. You are.\"}, {\"name\": \"Lightness\", \"symbol\": \"\ud83c\udf43\", \"msg\": \"You've made it too heavy. Pleasure isn't a distraction from manifestation \u2014 it's fuel for it.\"}, {\"name\": \"Transition\", \"symbol\": \"\ud83c\udf09\", \"msg\": \"You're between two versions of yourself. That feels unstable. That's good news.\"}, {\"name\": \"Transformation\", \"symbol\": \"\ud83e\udd8b\", \"msg\": \"What looks like loss is a rearrangement. You're not getting less \u2014 you're becoming different.\"}, {\"name\": \"Trust\", \"symbol\": \"\ud83c\udf1f\", \"msg\": \"You've manifested things before. Look back \u2014 evidence already surrounds you.\"}, {\"name\": \"Inner guide\", \"symbol\": \"\ud83d\udd6f\ufe0f\", \"msg\": \"Stop asking others. Your gut already knows. Listen there.\"}, {\"name\": \"Tenderness\", \"symbol\": \"\ud83c\udf38\", \"msg\": \"Be softer with yourself today. Strictness speeds nothing up. Tenderness does.\"}, {\"name\": \"Balance\", \"symbol\": \"\u2696\ufe0f\", \"msg\": \"You're giving too much or too little. Investigate which side tips \u2014 and restore balance.\"}, {\"name\": \"Focus\", \"symbol\": \"\ud83c\udfaf\", \"msg\": \"You're spreading energy across too many longings. Pick one. The rest comes later.\"}, {\"name\": \"Hope\", \"symbol\": \"\ud83c\udf08\", \"msg\": \"After rain, light. You're closer to something beautiful than you can see.\"}, {\"name\": \"Message\", \"symbol\": \"\ud83e\udeb6\", \"msg\": \"Watch for signs this week. A word, a song, a chance meeting. The universe is speaking.\"}, {\"name\": \"Change\", \"symbol\": \"\ud83c\udf2c\ufe0f\", \"msg\": \"Something new is blowing in. Don't cling to how it was. Stretch your arms.\"}, {\"name\": \"Light\", \"symbol\": \"\ud83c\udf3b\", \"msg\": \"Turn to what feeds you, not what drains you. Choosing light isn't selfish.\"}, {\"name\": \"Path\", \"symbol\": \"\ud83d\udee4\ufe0f\", \"msg\": \"You stand at a crossroads. Both paths are good \u2014 but one feels true. Follow feeling, not logic.\"}, {\"name\": \"Harvest\", \"symbol\": \"\ud83c\udf3e\", \"msg\": \"What you receive now is the harvest of what you sowed a while back. Be grateful \u2014 and sow consciously for later.\"}, {\"name\": \"Peace\", \"symbol\": \"\ud83d\udd4a\ufe0f\", \"msg\": \"Stop waging an inner war against where you are. Acceptance isn't surrender \u2014 it's the gateway.\"}, {\"name\": \"Authenticity\", \"symbol\": \"\ud83c\udfad\", \"msg\": \"You carry a mask that's grown heavy. What if you took it off this week \u2014 with one person?\"}, {\"name\": \"Shadow\", \"symbol\": \"\ud83c\udf11\", \"msg\": \"You're avoiding something in yourself. But what you don't face keeps steering. One honest moment with yourself opens everything.\"}, {\"name\": \"Height\", \"symbol\": \"\ud83c\udfd4\ufe0f\", \"msg\": \"You're further than you think. Stop looking at what's left \u2014 look at what you've already climbed.\"}, {\"name\": \"Bloom\", \"symbol\": \"\ud83e\udeb7\", \"msg\": \"Beautiful things often grow from mud. Your hardest period is the seedbed of something gorgeous.\"}, {\"name\": \"Answer\", \"symbol\": \"\ud83d\udc8c\", \"msg\": \"What you're asking is already answered. Not in words \u2014 in a feeling that lingers. Trust that.\"}, {\"name\": \"Fire\", \"symbol\": \"\ud83c\udf0b\", \"msg\": \"Something is brewing in you that wants out. Don't suppress it any longer. Creativity, anger, longing \u2014 give it air.\"}, {\"name\": \"Direction\", \"symbol\": \"\ud83e\udded\", \"msg\": \"You aren't lost, you're orienting. Pause. Breathe. The next step will become clear.\"}, {\"name\": \"Pleasure\", \"symbol\": \"\ud83c\udf3a\", \"msg\": \"Pleasure isn't a luxury. It's a frequency. Doing something today purely for its beauty \u2014 that's manifesting.\"}, {\"name\": \"Steadiness\", \"symbol\": \"\ud83e\udea8\", \"msg\": \"You have more foundation than you feel. Beneath the doubt lies something that doesn't waver. Stand there a moment.\"}, {\"name\": \"Longing\", \"symbol\": \"\ud83c\udf20\", \"msg\": \"What you really want isn't coincidence. Longing points \u2014 like a compass needle \u2014 towards who you may become.\"}, {\"name\": \"Letting go 2.0\", \"symbol\": \"\ud83e\udee7\", \"msg\": \"Not everything you let go is loss. Some things had long been gone \u2014 you were only holding on to the idea.\"}, {\"name\": \"Roots\", \"symbol\": \"\ud83c\udf33\", \"msg\": \"You don't always have to grow. Sometimes it's time to let your roots go deeper, right where you are.\"}, {\"name\": \"Grace\", \"symbol\": \"\ud83e\udda2\", \"msg\": \"Be gracious with the version of you who made a mistake yesterday. She/he did the best with what she had then.\"}, {\"name\": \"Halfway\", \"symbol\": \"\ud83c\udf17\", \"msg\": \"You're halfway through something. It feels uncomfortable, because it's neither a beginning nor an end. That's exactly how transformation feels.\"}, {\"name\": \"Perspective\", \"symbol\": \"\ud83e\ude90\", \"msg\": \"Zoom out. What feels overwhelming today will be a chapter in a bigger story a year from now. And you're writing it.\"}, {\"name\": \"Tenderness 2\", \"symbol\": \"\ud83c\udf37\", \"msg\": \"Someone around you needs your softness today \u2014 maybe that someone is yourself.\"}, {\"name\": \"Attention\", \"symbol\": \"\ud83d\udd14\", \"msg\": \"There's a signal you're ignoring. The body, the heart, a friend. Stop. Listen. Otherwise it will get louder.\"}, {\"name\": \"Intention\", \"symbol\": \"\ud83c\udff9\", \"msg\": \"Clarity beats motivation. Not working harder \u2014 aiming more clearly. What exactly are you aiming at?\"}, {\"name\": \"Synchronicity\", \"symbol\": \"\ud83d\udcab\", \"msg\": \"That meeting, that message, that one song playing \u2014 it wasn't chance. Follow the threads.\"}, {\"name\": \"Start of something\", \"symbol\": \"\ud83c\udf12\", \"msg\": \"Something new has just begun, too small to be visible yet. Protect it from your own impatience.\"}, {\"name\": \"Letting-go season\", \"symbol\": \"\ud83c\udf42\", \"msg\": \"Leaves don't fall from failure \u2014 they let go to make room. What in your life is at its natural end?\"}, {\"name\": \"Anchor\", \"symbol\": \"\u2693\", \"msg\": \"In busy times you need something that doesn't move. A ritual, a person, a place. What is your anchor?\"}, {\"name\": \"New day\", \"symbol\": \"\ud83c\udf05\", \"msg\": \"You get a new try tomorrow morning. Today doesn't have to become perfect. That's a beautiful grace.\"}, {\"name\": \"Magic\", \"symbol\": \"\u2728\", \"msg\": \"You are the magical thing you're searching for. Not in a while, not when everything aligns \u2014 now, in this version.\"}, {\"name\": \"\", \"symbol\": \"\u2726\", \"msg\": \"A new door opens.\"}, {\"name\": \"\", \"symbol\": \"\u2726\", \"msg\": \"What ends makes room.\"}, {\"name\": \"\", \"symbol\": \"\u2726\", \"msg\": \"Follow what feels light.\"}, {\"name\": \"\", \"symbol\": \"\u2726\", \"msg\": \"You already know the answer.\"}, {\"name\": \"\", \"symbol\": \"\u2726\", \"msg\": \"Patience \u2014 it's still ripening.\"}, {\"name\": \"\", \"symbol\": \"\u2726\", \"msg\": \"Look at what returns.\"}, {\"name\": \"\", \"symbol\": \"\u2726\", \"msg\": \"Your intuition points, not your fear.\"}, {\"name\": \"\", \"symbol\": \"\u2726\", \"msg\": \"Let it flow.\"}]}, {\"id\": \"engelen\", \"naam\": \"Angels & guides\", \"sub\": \"Gentle support from your guides\", \"kleur\": \"#fde68a\", \"type\": \"guide\", \"cards\": [{\"msg\": \"You are carried.\", \"expl\": \"Even if you don't feel it, you are not alone. There's more support around you than is visible.\", \"doing\": \"Ask silently: \\\"Let me feel today that I am carried.\\\" And keep softly noticing.\"}, {\"msg\": \"Help is on the way.\", \"expl\": \"What you've asked has been set in motion \u2014 even if you don't see the result yet.\", \"doing\": \"Consciously let go of control once today, and trust it will be okay.\"}, {\"msg\": \"Ask, and it will be given.\", \"expl\": \"You don't have to do it alone. Asking for help isn't weakness, it's openness.\", \"doing\": \"Speak one concrete question aloud today to your guide or angel.\"}, {\"msg\": \"Something loving watches over you.\", \"expl\": \"A warm presence is closer than you think, especially in your heavier moments.\", \"doing\": \"Place a hand on your heart and say: \\\"I feel that I'm not alone.\\\"\"}, {\"msg\": \"Let go of what's heavy.\", \"expl\": \"You don't have to keep carrying everything. Some burdens may leave your hands.\", \"doing\": \"Breathe out and imagine handing something heavy over to something larger than you.\"}, {\"msg\": \"You are where you're meant to be.\", \"expl\": \"This phase too, with all its uncertainty, belongs to your path.\", \"doing\": \"Name one thing you're grateful for, exactly as your life is right now.\"}, {\"msg\": \"A sign is coming to you.\", \"expl\": \"In the coming days watch for repetitions, coincidences, a song, a word.\", \"doing\": \"Ask for a specific sign, then let it go.\"}, {\"msg\": \"Your prayers have been heard.\", \"expl\": \"Nothing you've asked from the heart is lost.\", \"doing\": \"Write or say: \\\"Thank you for listening\\\" \u2014 before you see the answer.\"}, {\"msg\": \"You don't have to understand it.\", \"expl\": \"Not every answer comes as words. Sometimes guidance comes as a feeling, a calm, a direction.\", \"doing\": \"Today don't ask for explanation, but for a feeling of 'yes' or 'no' about something you're doubting.\"}, {\"msg\": \"Rest is allowed.\", \"expl\": \"Your guides aren't asking you to work harder. They're inviting you to slow down, so you can hear them.\", \"doing\": \"Take three minutes of silence today, with no goal. Just being present.\"}, {\"msg\": \"What you lost wasn't for nothing.\", \"expl\": \"Even difficult goodbyes shaped and guided you, even if it seemed meaningless at the time.\", \"doing\": \"Name one loss that brought you something in hindsight \u2014 even if only wisdom.\"}, {\"msg\": \"Your intuition is a voice.\", \"expl\": \"That soft knowing you often ignore is the very channel through which guidance comes.\", \"doing\": \"Follow one small inspiration today, however illogical, and see what happens.\"}, {\"msg\": \"You are more deeply loved than you know.\", \"expl\": \"The love watching over you asks nothing back. You don't have to earn it.\", \"doing\": \"Allow yourself to receive: say 'I let myself be loved' and feel if resistance comes up.\"}, {\"msg\": \"Doubt doesn't mean you're wrong.\", \"expl\": \"Standing on a threshold feels uncertain. That's not a sign to turn back, but to breathe through.\", \"doing\": \"Name where you're doubting, and ask your guide: 'help me see the next small step.'\"}, {\"msg\": \"Your words are heard.\", \"expl\": \"Whether you speak aloud or think in silence \u2014 someone is listening, without judgment.\", \"doing\": \"Speak something aloud today that you normally keep to yourself. One sentence, addressed to your guide.\"}, {\"msg\": \"Slow down, there's no rush.\", \"expl\": \"The urgency you feel often comes from fear, not truth. The right moment arrives on its own.\", \"doing\": \"Do one thing slower than usual today, and notice what it does for your calm.\"}, {\"msg\": \"You may ask for help, again.\", \"expl\": \"You don't have to act strong. Asking for support \u2014 even for the same thing, again \u2014 isn't failure.\", \"doing\": \"Today ask for help with something you're ashamed you can't yet do alone.\"}, {\"msg\": \"A door closes so a better one can open.\", \"expl\": \"What ends makes room. Your guides sometimes lead you away from what you thought you wanted.\", \"doing\": \"Think of something that recently went wrong, and ask: 'where might this be leading me?'\"}, {\"msg\": \"You are not your thoughts.\", \"expl\": \"The noise in your head isn't who you are. Beneath it is a quiet place that always stays calm.\", \"doing\": \"Breathe in, and on the exhale say: 'I am the silence beneath the thoughts.'\"}, {\"msg\": \"Forgive yourself today.\", \"expl\": \"You did the best you could with what you knew then. That goes for your yesterday too.\", \"doing\": \"Place your hand on your heart and say: 'I forgive myself for what I didn't yet know.'\"}, {\"msg\": \"The heaviness is temporary.\", \"expl\": \"No night lasts forever. What feels leaden now will shift.\", \"doing\": \"Write: 'this will pass.' And let that be enough for today.\"}, {\"msg\": \"Your heart knows the way.\", \"expl\": \"The mind makes lists; the heart points the way. Today, trust the latter.\", \"doing\": \"Picture yourself making a choice and notice where your body lightens. That's your answer.\"}, {\"msg\": \"Someone is coming onto your path.\", \"expl\": \"Not all guidance comes from within. Sometimes life sends a person who fits exactly.\", \"doing\": \"Today be open to a conversation you'd normally avoid.\"}, {\"msg\": \"You may make mistakes.\", \"expl\": \"No misstep puts you outside the love that carries you. You aren't being judged.\", \"doing\": \"Think of a mistake bothering you, and say: 'this also belonged to my learning.'\"}, {\"msg\": \"Silence is also an answer.\", \"expl\": \"Sometimes there's no sign, and that is the sign: not yet, trust the waiting.\", \"doing\": \"Today leave one question unanswered, and practise peace with not knowing.\"}, {\"msg\": \"You are safer than you feel.\", \"expl\": \"Fear magnifies danger. The reality of this moment is usually softer.\", \"doing\": \"Look around and name three things that, in this moment, are truly okay.\"}, {\"msg\": \"Gratitude opens the door.\", \"expl\": \"What you appreciate grows. Gratitude isn't a duty, but a key.\", \"doing\": \"Name three small things from today you're sincerely grateful for.\"}, {\"msg\": \"You feel more than you think.\", \"expl\": \"Your sensitivity isn't a burden but your antenna. With it you catch the subtle guidance.\", \"doing\": \"Today watch for a moment when you feel 'something' without knowing why. Trust it.\"}, {\"msg\": \"Let yourself be carried, even in joy.\", \"expl\": \"Support isn't only for dark days. You may share your happiness too.\", \"doing\": \"Silently share a beautiful moment today: 'thank you, this feels good.'\"}, {\"msg\": \"The answer lies in the rest.\", \"expl\": \"You don't find it by searching harder, but by pausing the search.\", \"doing\": \"Pose your question, then do something relaxing. Let the answer come to you.\"}, {\"msg\": \"You may begin again.\", \"expl\": \"Every moment is a new threshold. What was yesterday doesn't have to determine today.\", \"doing\": \"Choose one thing you'll do differently today than usual, however small.\"}, {\"msg\": \"Your boundaries are sacred.\", \"expl\": \"Saying no is also a form of self-respect. Your guides cheer for your boundaries.\", \"doing\": \"Today say 'no' once without apologising.\"}, {\"msg\": \"It comes in a way different from what you thought.\", \"expl\": \"What you asked can come through an unexpected door. Don't stare rigidly in one direction.\", \"doing\": \"Today release <em>how<\/em> your longing should come true, and stay open to surprise.\"}, {\"msg\": \"You are enough, right now.\", \"expl\": \"You don't have to first be better, stronger or further to be worthy of support and love.\", \"doing\": \"Say: 'I am enough, right now' \u2014 and notice what stirs in you.\"}, {\"msg\": \"Tears may flow.\", \"expl\": \"Crying isn't weakness but a cleansing. Your guides hold you when you break.\", \"doing\": \"Today give your sadness room, even briefly, without pushing it away.\"}, {\"msg\": \"You may share a burden.\", \"expl\": \"You don't have to carry everything alone. Hand a piece to something larger.\", \"doing\": \"Imagine placing one worry into hands stronger than yours.\"}, {\"msg\": \"You're doing better than you think.\", \"expl\": \"You're hard on yourself. From a distance you're getting further than you realise.\", \"doing\": \"Name three things you've done well lately, however small.\"}, {\"msg\": \"You are being cared for.\", \"expl\": \"Even in uncertainty there's a thread that carries your life. You won't fall through the net.\", \"doing\": \"Today trust that one thing you're worrying about will be okay.\"}, {\"msg\": \"Listen to your body.\", \"expl\": \"Fatigue, tension, unrest \u2014 they are messengers. Your body speaks for your soul.\", \"doing\": \"Ask your body: 'what do you need now?' and give it, even just partially.\"}, {\"msg\": \"The light is closer than you think.\", \"expl\": \"Right when it feels darkest, you're often just before the breakthrough.\", \"doing\": \"Today keep going with something you almost wanted to stop. One step more.\"}, {\"msg\": \"Your past doesn't define you.\", \"expl\": \"What happened to you isn't who you are. You may free yourself from old stories.\", \"doing\": \"Name one story about yourself that's no longer true, and let it go today.\"}, {\"msg\": \"Ask for a dream.\", \"expl\": \"In your sleep the channel stands wide open. Guidance often comes through images in the night.\", \"doing\": \"Before sleeping pose a question, and write down in the morning what you remember.\"}, {\"msg\": \"You may learn it slowly.\", \"expl\": \"Growth isn't a race. Your guides have infinite patience with your pace.\", \"doing\": \"Today be gentle about something you 'should have been able to do by now.'\"}, {\"msg\": \"Joy is also a prayer.\", \"expl\": \"Fun, laughter, enjoyment \u2014 they are ways of feeling connection, just as much as silence.\", \"doing\": \"Today consciously do something purely because it makes you happy, with no purpose.\"}, {\"msg\": \"You are in the right place.\", \"expl\": \"Even if it doesn't feel like you'd hoped, this moment is part of the route.\", \"doing\": \"Say: 'I am exactly where I need to be to see the next step.'\"}, {\"msg\": \"It may go easily.\", \"expl\": \"Not everything has to be a struggle. Sometimes the way is open and you may simply walk it.\", \"doing\": \"Today choose the easy way at something, without guilt that it was too simple.\"}, {\"msg\": \"You are a channel of love.\", \"expl\": \"The warmth you feel for others flows through you from a greater source.\", \"doing\": \"Today silently send warmth to someone, and feel how it fills you too.\"}, {\"msg\": \"Don't wait until you're ready.\", \"expl\": \"You'll never feel completely ready. Begin with trembling hands \u2014 that's allowed.\", \"doing\": \"Today take one step toward something you feel 'not ready' for.\"}, {\"msg\": \"Your prayer doesn't have to be beautiful.\", \"expl\": \"You may ask messily, angrily or confusedly. Honesty counts more than tidy words.\", \"doing\": \"Say exactly what's in your heart, even if it sounds ugly. It is heard.\"}, {\"msg\": \"There's more in store for you.\", \"expl\": \"What you know now isn't the whole picture. Your life has chapters you haven't seen yet.\", \"doing\": \"Be open to the idea that the most beautiful hasn't happened yet.\"}, {\"msg\": \"Return to your breath.\", \"expl\": \"When everything becomes too much, your breath is the way back to now, and to connection.\", \"doing\": \"Today breathe deeply three times consciously when you notice you're getting distracted.\"}]}, {\"id\": \"overvloed\", \"naam\": \"Abundance\", \"sub\": \"Receiving without guilt\", \"kleur\": \"#6ee7b7\", \"type\": \"guide\", \"cards\": [{\"msg\": \"You may receive.\", \"expl\": \"Abundance isn't a reward for perfection. It's your right, simply because you exist.\", \"doing\": \"Say aloud: \\\"I may receive\\\" and notice what resistance comes \u2014 and let it be soft.\"}, {\"msg\": \"Money is energy.\", \"expl\": \"It may flow, like breath or water. Asking for it isn't greedy.\", \"doing\": \"Visualise money coming to you with ease, without earning it through exhaustion.\"}, {\"msg\": \"Longing isn't guilt.\", \"expl\": \"Wanting what you want is your life growing, not your ego conquering.\", \"doing\": \"Name one longing you usually push away, and give it the right to exist today.\"}, {\"msg\": \"There is enough, and you belong.\", \"expl\": \"Abundance isn't a pie you take from others. There's room for everyone, including you.\", \"doing\": \"Replace one \\\"I'm not allowed\\\" with \\\"I'm allowed too\\\".\"}, {\"msg\": \"Open your hands.\", \"expl\": \"With clenched fists you can receive nothing. Receiving asks openness.\", \"doing\": \"Sit with open hands on your lap and breathe calmly \u2014 a posture of receiving.\"}, {\"msg\": \"You deserve space and freedom.\", \"expl\": \"Comfort and ease aren't shallow; they give you the calm to live and give.\", \"doing\": \"Today allow yourself one small moment of comfort, consciously and without guilt.\"}, {\"msg\": \"What you give returns.\", \"expl\": \"Giving from abundance (not from exhaustion) sets a stream in motion.\", \"doing\": \"Today give something small with an open heart \u2014 and receive something too.\"}, {\"msg\": \"The flow has already begun.\", \"expl\": \"You don't have to force it. Trust that it's already in motion.\", \"doing\": \"Thank in advance for what's on the way, as if it's already here.\"}, {\"msg\": \"Money may be your friend.\", \"expl\": \"You don't have to fight with money. It may become a calm, friendly presence.\", \"doing\": \"Today speak one neutral, friendly sentence about money instead of a worry.\"}, {\"msg\": \"Your wealth is more than your balance.\", \"expl\": \"Time, health, people, rest \u2014 abundance has many forms with no price tag.\", \"doing\": \"Name three forms of wealth in your life that have nothing to do with money.\"}, {\"msg\": \"Receiving isn't owing.\", \"expl\": \"Accepting something \u2014 help, a gift, a compliment \u2014 obliges you to nothing. You may simply keep it.\", \"doing\": \"Today receive something fully, without immediately wanting to give back.\"}, {\"msg\": \"There's more where that came from.\", \"expl\": \"What you once received wasn't chance or last chance. The source hasn't dried up.\", \"doing\": \"Today trust that what you need can come to you again.\"}, {\"msg\": \"You deserve ease.\", \"expl\": \"It doesn't have to be heavy to be valuable. Ease isn't laziness but grace.\", \"doing\": \"Today consciously choose the easy way for something, and feel that's okay.\"}, {\"msg\": \"Prosperity begins within.\", \"expl\": \"A feeling of enough attracts more than a feeling of lack. It begins in you.\", \"doing\": \"Before you buy or plan something, say: 'there is enough, and I belong to the abundance.'\"}, {\"msg\": \"You may long greatly.\", \"expl\": \"Dreaming small doesn't protect you. You may long for a spacious, full life.\", \"doing\": \"Write one longing that you normally find too big to say aloud.\"}, {\"msg\": \"Giving doesn't make you poorer.\", \"expl\": \"Generosity from abundance (not from duty or emptiness) keeps the flow open.\", \"doing\": \"Today give something away \u2014 money, time, attention \u2014 from the feeling: there is enough.\"}, {\"msg\": \"Your worth isn't your performance.\", \"expl\": \"You don't have to earn to be valuable. You already are, even on lazy days.\", \"doing\": \"Say: 'my worth doesn't depend on what I produce today.'\"}, {\"msg\": \"Abundance houdt van vreugde.\", \"expl\": \"What you do with pleasure attracts more than what you force with reluctance.\", \"doing\": \"Today do something related to money or work in a way you enjoy.\"}, {\"msg\": \"You may be rich <em>and<\/em> good.\", \"expl\": \"Prosperity doesn't make you greedy. With more you can also mean more to others.\", \"doing\": \"Imagine what you'd do for others if you had ample resources.\"}, {\"msg\": \"Scarcity is a thought, not a fact.\", \"expl\": \"The idea 'there isn't enough' is often an old fear, not the truth of this moment.\", \"doing\": \"Today catch one scarcity-thought and ask: 'is that really true now?'\"}, {\"msg\": \"You don't have to exhaust yourself.\", \"expl\": \"Working hard until you're empty isn't a condition for abundance. Rest belongs too.\", \"doing\": \"Today grant yourself rest without thinking you have to 'earn' it first.\"}, {\"msg\": \"The universe knows no shortage.\", \"expl\": \"There's no fixed pie you take from others. Your happiness takes nothing from anyone.\", \"doing\": \"Today sincerely rejoice in someone else's success.\"}, {\"msg\": \"You may ask for what you need.\", \"expl\": \"Asking isn't weakness or pushiness. It's being clear about what you want.\", \"doing\": \"Today concretely ask for something you need, without apologising.\"}, {\"msg\": \"Money flows to those who welcome it.\", \"expl\": \"An open, relaxed posture attracts more than clinging from fear.\", \"doing\": \"Today consciously relax your shoulders when you think of money. Welcome instead of cling.\"}, {\"msg\": \"Your future may be light.\", \"expl\": \"You don't have to expect the worst to be prepared. Expect the good too.\", \"doing\": \"Imagine it going better in a year than you dare to hope now.\"}, {\"msg\": \"Comfort isn't betrayal.\", \"expl\": \"Enjoying something nice doesn't mean you're shallow. You may have it nice.\", \"doing\": \"Today consciously enjoy one comfort, without guilt or haste.\"}, {\"msg\": \"You are worth caring for.\", \"expl\": \"Taking good care of yourself \u2014 with money and time too \u2014 isn't selfish but foundation.\", \"doing\": \"Today do one thing that's an investment in yourself.\"}, {\"msg\": \"Abundance begint met merken.\", \"expl\": \"You already have more than you see. Attention to what's here magnifies it.\", \"doing\": \"Walk through your home and notice three things already making your life rich.\"}, {\"msg\": \"You don't have to live frugally to be good.\", \"expl\": \"Frugality is a choice, not a moral duty. You may also live generously.\", \"doing\": \"Today allow yourself something you normally think 'that's too much.'\"}, {\"msg\": \"What you appreciate multiplies.\", \"expl\": \"Attention is like water on a plant. What you look at gratefully grows.\", \"doing\": \"Today thank aloud for something you already have, as if it's precious.\"}, {\"msg\": \"Money is neutral.\", \"expl\": \"It's not good or bad \u2014 it's energy that takes form through how you use it.\", \"doing\": \"Today release one judgment about money: 'rich = greedy' or 'poor = noble.'\"}, {\"msg\": \"You deserve more than survival.\", \"expl\": \"Life isn't meant to be just getting by. You may also bloom and enjoy.\", \"doing\": \"Name one way your life could be more than just 'getting by.'\"}, {\"msg\": \"Receiving asks surrender.\", \"expl\": \"You can't cling and receive at the same time. Open hands require trust.\", \"doing\": \"Today release control over <em>how<\/em> something good comes to you.\"}, {\"msg\": \"You may enjoy what you have.\", \"expl\": \"Saving for later is good, but life happens now. Enjoying isn't waste.\", \"doing\": \"Today use something 'good' you've been saving for a special occasion.\"}, {\"msg\": \"Your prosperity helps others.\", \"expl\": \"The more you have and the more peace you feel, the more you can give, share and lift.\", \"doing\": \"Imagine how much good you could do from a place of abundance.\"}, {\"msg\": \"It may come without reason.\", \"expl\": \"Not every good thing has to be earned. Sometimes abundance simply comes, as a gift.\", \"doing\": \"Today be open to a windfall you haven't 'earned.'\"}, {\"msg\": \"Your fear of shortage may rest.\", \"expl\": \"The fear it'll run out often comes from the past, not now. You are safe.\", \"doing\": \"When the scarcity-fear comes up, place your hand on your belly and breathe: 'there is enough.'\"}, {\"msg\": \"Don't compare yourself away.\", \"expl\": \"What another has says nothing about what's meant for you. Your stream is your own.\", \"doing\": \"Today stop one comparison, and focus on your own path.\"}, {\"msg\": \"You're allowed to have it good.\", \"expl\": \"Happiness isn't betrayal to those struggling. Your suffering helps no one.\", \"doing\": \"Today allow yourself to be happy, without guilt that others struggle.\"}, {\"msg\": \"Abundance is also time.\", \"expl\": \"Free time, room to breathe, moments of nothing \u2014 that's the purest kind of wealth.\", \"doing\": \"Today claim a half hour that's entirely yours, with no use.\"}, {\"msg\": \"You deserve beautiful things.\", \"expl\": \"Beauty around you nourishes you. You don't have to justify it.\", \"doing\": \"Today surround yourself with something beautiful \u2014 a flower, music, light \u2014 purely for yourself.\"}, {\"msg\": \"Ask bigger than you're used to.\", \"expl\": \"You often ask too modestly, from fear of disappointment. Dare to ask more broadly.\", \"doing\": \"In your mind double one wish, and see if you can bear it.\"}, {\"msg\": \"Your relationship with money may heal.\", \"expl\": \"Old pain around money \u2014 shame, conflict, lack \u2014 you may leave behind.\", \"doing\": \"Write one sentence about money from your youth you no longer want to carry.\"}, {\"msg\": \"Enough is a feeling, not an amount.\", \"expl\": \"No amount guarantees 'enough'. Enough arises from within.\", \"doing\": \"Today, at something ordinary, say: 'this is enough' \u2014 and feel if it fits.\"}, {\"msg\": \"You may take up space.\", \"expl\": \"You don't have to make yourself small to be loved. Living large is allowed.\", \"doing\": \"Today consciously take a little more space \u2014 in a conversation, a room, a choice.\"}, {\"msg\": \"The world wants to give to you.\", \"expl\": \"Life isn't set up stingy against you. There's a tendency toward bloom, for you too.\", \"doing\": \"Today expect something good, simply because it can happen.\"}, {\"msg\": \"You deserve help and support.\", \"expl\": \"Carrying everything alone isn't virtue. Receiving support is also a form of abundance.\", \"doing\": \"Today let someone help you with something, even if you 'could do it yourself.'\"}, {\"msg\": \"Gratitude is the shortest path.\", \"expl\": \"Nothing opens the flow faster than being sincerely grateful for what's already here.\", \"doing\": \"Today begin or end with three things you're grateful for.\"}, {\"msg\": \"Your abundance is safe to show.\", \"expl\": \"You don't have to hide your happiness or prosperity from fear of envy.\", \"doing\": \"Today share something good that happened to you, without apologising for it.\"}, {\"msg\": \"Letting go makes room.\", \"expl\": \"Holding on to what you no longer use blocks the flow. Space attracts what's new.\", \"doing\": \"Today give or throw away one thing you no longer need.\"}, {\"msg\": \"You may ask <em>and<\/em> receive.\", \"expl\": \"The circle is only complete if you accept it too. Asking without receiving leaves you empty.\", \"doing\": \"If something comes to you today, truly accept it \u2014 with a simple 'thank you.'\"}]}];\nconst PATTERN_CARDS = [{\"card\": \"Letting go\", \"msg\": \"Something in your life is asking to be released. Not by force, but with an open hand.\", \"tag\": \"loslaten\"}, {\"card\": \"Trust\", \"msg\": \"You're about to force something that would come on its own. Breathe. It's on the way.\", \"tag\": \"vertrouwen\"}, {\"card\": \"Patience\", \"msg\": \"What you want is still ripening. That it isn't here doesn't mean it isn't coming.\", \"tag\": \"geduld\"}, {\"card\": \"Receiving\", \"msg\": \"Open your hands. Something is coming that you can only catch if you don't grab.\", \"tag\": \"ontvangen\"}, {\"card\": \"Courage\", \"msg\": \"The fear you feel is a sign that it matters to you. Move, even if you tremble.\", \"tag\": \"moed\"}, {\"card\": \"Rest\", \"msg\": \"You don't have to achieve anything today. The silence itself is the work.\", \"tag\": \"rust\"}, {\"card\": \"Abundance\", \"msg\": \"There is more than enough. Give something away and feel the flow restart.\", \"tag\": \"overvloed\"}, {\"card\": \"Clarity\", \"msg\": \"You actually already know what you want. Stop talking yourself into doubt.\", \"tag\": \"helderheid\"}, {\"card\": \"Signs\", \"msg\": \"Watch softly in the coming days. You're being winked at, more often than you think.\", \"tag\": \"tekens\"}, {\"card\": \"Self-worth\", \"msg\": \"You may want this. You are worthy, even if an old voice says otherwise.\", \"tag\": \"eigenwaarde\"}, {\"card\": \"Connection\", \"msg\": \"Reach out to someone today. The bridge you're seeking goes through another.\", \"tag\": \"verbinding\"}, {\"card\": \"Inspired action\", \"msg\": \"A small step is presenting itself. Don't postpone \u2014 do it today.\", \"tag\": \"handelen\"}, {\"card\": \"Gratitude\", \"msg\": \"Briefly count what's already here. From enough you attract more strongly than from lack.\", \"tag\": \"dankbaarheid\"}, {\"card\": \"Forgiveness\", \"msg\": \"Someone \u2014 maybe yourself \u2014 is still waiting for your forgiveness. It's for your peace.\", \"tag\": \"vergeving\"}, {\"card\": \"Protection\", \"msg\": \"Protect what's still tender. Not every dream belongs out loud, not yet.\", \"tag\": \"bescherming\"}, {\"card\": \"Timing\", \"msg\": \"The detour isn't a mistake. Trust a plan you can't yet oversee.\", \"tag\": \"timing\"}, {\"card\": \"Embodiment\", \"msg\": \"Be now who you want to become. Circumstances follow who you are, not the other way around.\", \"tag\": \"belichaming\"}, {\"card\": \"Space\", \"msg\": \"Empty something \u2014 a drawer, a schedule, a thought. The new needs room.\", \"tag\": \"ruimte\"}];\n<\/script>\n<script>\n  // mock storage voor de losse demo\n  if(!window.storage){ const mem={}; window.storage={get:async k=>mem[k]!==undefined?{value:mem[k]}:null,set:async(k,v)=>{mem[k]=v;return{value:v};},delete:async k=>{delete mem[k];},list:async p=>({keys:Object.keys(mem).filter(k=>k.startsWith(p||''))})}; }\n\n  let currentDeck = DECKS[0];\n  let currentCard = null, flipped = false;\n\n  function esc(s){return (s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));}\n\n  function renderDecks(){\n    const row = document.getElementById('deck-row');\n    row.innerHTML = DECKS.map((d,i)=>`\n      <button class=\"deck-btn ${d.id===currentDeck.id?'active':''}\" onclick=\"pickDeck(${i})\">\n        <div class=\"dn\"><span class=\"dot\" style=\"background:${d.kleur}\"><\/span>${esc(d.naam)}<\/div>\n        <div class=\"ds\">${esc(d.sub)}<\/div>\n        <div class=\"dc\">${d.cards.length} kaarten<\/div>\n      <\/button>`).join('');\n  }\n  function pickDeck(i){\n    currentDeck = DECKS[i];\n    document.getElementById('card').classList.remove('flipped'); flipped=false; currentCard=null;\n    document.getElementById('draw-btn').textContent='Draw a card';\n    renderDecks();\n  }\n  function flipCard(){ if(!currentCard) return; flipped=!flipped; document.getElementById('card').classList.toggle('flipped',flipped); }\n\n  async function drawCard(){\n    const d = currentDeck;\n    const card = d.cards[Math.floor(Math.random()*d.cards.length)];\n    currentCard = card;\n    document.getElementById('c-sym').textContent = card.symbol || '';\n    document.getElementById('c-name').textContent = card.name || '';\n    document.getElementById('c-msg').textContent = card.msg || '';\n    document.getElementById('c-expl').textContent = card.expl || '';\n    document.getElementById('c-doing').textContent = card.doing ? ('\u2726 '+card.doing) : '';\n    document.getElementById('c-by').textContent = card.by ? ('\u2014 '+card.by) : '';\n    const c=document.getElementById('card');\n    c.classList.remove('flipped'); flipped=false;\n    setTimeout(()=>{ c.classList.add('flipped'); flipped=true; },80);\n    document.getElementById('draw-btn').textContent='Draw again';\n\n    // save draw (per deck) for pattern detection on the Oracle\n    const tag = matchTag((card.name||'') + ' ' + (card.msg||''));\n    const h = await getHist();\n    h.push({ ts:Date.now(), deck:d.id, deckNaam:d.naam, name:card.name||(card.msg.slice(0,24)+'\u2026'), tag });\n    await setHist(h);\n    setTimeout(()=>renderInsight(h),850);\n    renderHist(h);\n  }\n\n  // associate a theme tag based on keywords (for pattern detection)\n  // Card names themselves are often the theme, so they weigh in.\n  const TAGWORDS = {\n    loslaten:['loslaten','laat los','vasthoud','volle handen','masker','overgang','verandering','strek je arm'],\n    vertrouwen:['vertrouw','geloof','zekerheid','onderweg','stevigheid','fundament','hoop'],\n    geduld:['geduld','timing','rijpt','wacht','tijd','bloei','groeit'],\n    ontvangen:['ontvang','open handen','binnenlaten','overvloed','genoeg','geld','gunnen'],\n    moed:['moed','angst','durf','bang','vuur','schaduw','aankijk'],\n    rust:['rust','stilte','adem','niets doen','leegte','vrede','acceptat','tederheid','zachter'],\n    eigenwaarde:['waard','verdien','eigenwaarde','genoeg ben','authenticiteit','echt'],\n    actie:['actie','stap','doen','beweeg','start','begin','ge\u00efnspireerd'],\n    helderheid:['helder','weet','antwoord','duidelijk','focus','kies','kruispunt','pad','verlangen','kompas'],\n    zelfzorg:['voedt','uitput','licht','plezier','lichtheid','balans','spiegel','transformatie','hoogte','verder dan']\n  };\n  function matchTag(text){\n    const t=(text||'').toLowerCase();\n    for(const [tag,words] of Object.entries(TAGWORDS)){ if(words.some(w=>t.includes(w))) return tag; }\n    return 'algemeen';\n  }\n\n  async function getHist(){ try{const r=await window.storage.get('kaarten:hist'); if(r) return JSON.parse(r.value);}catch(e){} return []; }\n  async function setHist(h){ try{await window.storage.set('kaarten:hist', JSON.stringify(h.slice(-60)));}catch(e){} }\n\n  function fmtShort(ts){const d=new Date(ts);return d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'});}\n\n  function renderInsight(h){\n    const box=document.getElementById('insight');\n    if(h.length<3){ box.innerHTML=''; return; }\n    const recent=h.slice(-7);\n    const counts={};\n    recent.forEach(x=>{ if(x.tag&&x.tag!=='algemeen') counts[x.tag]=(counts[x.tag]||0)+1; });\n    const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);\n    if(!sorted.length){ box.innerHTML=''; return; }\n    const [tag,n]=sorted[0];\n    const woord=tag;\n    let body;\n    if(n>=3) body=`<p>The cards keep bringing you back to <span class=\"pat\">${esc(woord)}<\/span>. Three or more times in your last draws. That truly asks your attention now.<\/p>`;\n    else if(n===2) body=`<p>Lately you've been drawing more often around <span class=\"pat\">${esc(woord)}<\/span>. Something in you knows what it's about.<\/p>`;\n    else body=`<p>Your draws are varied. The thread now lies mainly in <span class=\"pat\">${esc(woord)}<\/span>.<\/p>`;\n    box.innerHTML=`<div class=\"insight\"><div class=\"tag\">What the cards see in you<\/div>${body}<\/div>`;\n  }\n  function renderHist(h){\n    const lab=document.getElementById('hist-label'), wrap=document.getElementById('hist');\n    if(!h.length){ lab.style.display='none'; wrap.innerHTML=''; return; }\n    lab.style.display='block';\n    wrap.innerHTML=h.slice().reverse().slice(0,12).map(x=>`<div class=\"hrow\"><span class=\"hd\">${fmtShort(x.ts)}<\/span><span class=\"hc\">${esc(x.name)}<\/span><span class=\"hk\">${esc(x.deckNaam)}<\/span><\/div>`).join('');\n  }\n\n  renderDecks();\n  (async()=>{ const h=await getHist(); renderHist(h); if(h.length>=3) renderInsight(h); })();\n<\/script>\n<\/body>\n<\/html>\n", kompas: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#0f0520\">\n<title>Compass \u2014 what does your longing whisper?<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --deep:#0f0520;--night:#1a0b2e;--violet:#2d1b4e;--plum:#4a2670;\n    --orchid:#7c3aed;--rose:#c084fc;--gold:#fbbf24;--gold-soft:#fde68a;--gold-deep:#d97706;\n    --cream:#fef3c7;--text:#f5e6ff;--text-soft:#d4c5e8;--text-dim:#9b89b8;\n    --mist:rgba(255,255,255,.06);--mist-strong:rgba(255,255,255,.12);--line:rgba(255,255,255,.10);\n    --gold-line:rgba(251,191,36,.34);--gold-bg:rgba(251,191,36,.10);\n    --serif:'Cormorant Garamond',Georgia,serif;--sans:'Outfit',system-ui,sans-serif;\n    --radius:20px;\n  }\n  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}\n  html{scroll-behavior:smooth}\n  body{font-family:var(--sans);font-weight:300;color:var(--text);line-height:1.7;min-height:100vh;\n    background:radial-gradient(ellipse at 20% 0%,rgba(124,58,237,.28) 0%,transparent 50%),\n      radial-gradient(ellipse at 80% 100%,rgba(251,191,36,.12) 0%,transparent 50%),\n      radial-gradient(ellipse at 50% 50%,rgba(192,132,252,.08) 0%,transparent 70%),\n      linear-gradient(180deg,var(--deep) 0%,var(--night) 50%,var(--deep) 100%);\n    background-attachment:fixed;padding-bottom:40px;-webkit-font-smoothing:antialiased;overflow-x:hidden}\n  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}\n  .star{position:absolute;width:2px;height:2px;background:var(--gold-soft);border-radius:50%;\n    animation:twinkle 3s infinite ease-in-out;box-shadow:0 0 6px var(--gold)}\n  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}\n  .wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 18px}\n  header{padding:34px 18px 18px;text-align:center;position:relative;z-index:2}\n  .moon{width:62px;height:62px;border-radius:50%;margin:0 auto 18px;position:relative;\n    background:radial-gradient(circle at 32% 30%,#fef3c7 0%,var(--gold-soft) 35%,var(--gold) 70%,var(--gold-deep));\n    box-shadow:0 0 36px rgba(251,191,36,.55),0 0 70px rgba(192,132,252,.35),inset -8px -10px 22px rgba(15,5,32,.35);\n    animation:moonbreathe 6s ease-in-out infinite}\n  @keyframes moonbreathe{0%,100%{box-shadow:0 0 36px rgba(251,191,36,.55),0 0 70px rgba(192,132,252,.35),inset -8px -10px 22px rgba(15,5,32,.35)}50%{box-shadow:0 0 50px rgba(251,191,36,.75),0 0 95px rgba(192,132,252,.5),inset -8px -10px 22px rgba(15,5,32,.35)}}\n  .eyebrow{font-family:var(--serif);font-style:italic;font-size:12px;letter-spacing:.42em;\n    color:var(--gold);text-transform:uppercase;margin-bottom:10px;opacity:.85}\n  .eyebrow::before,.eyebrow::after{content:'\u2726';margin:0 11px;font-size:9px;color:var(--rose)}\n  h1{font-family:var(--serif);font-weight:500;font-size:clamp(28px,7vw,38px);line-height:1.1;letter-spacing:-.01em;\n    background:linear-gradient(135deg,var(--cream) 0%,var(--gold-soft) 45%,var(--rose) 100%);\n    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}\n  h1 em{font-style:italic;font-weight:400}\n  .tag{font-family:var(--serif);font-style:italic;color:var(--text-soft);font-size:17px;margin-top:14px;\n    max-width:480px;margin-left:auto;margin-right:auto;line-height:1.5;opacity
