>\n          <p style=\"font-size:14px; color:var(--text-dim); max-width:380px; margin:0 auto 10px;\">In through your nose, hold, out through your mouth. This breath calms your nervous system and brings you into the right state to manifest.<\/p>\n          <div class=\"breath-circle\" id=\"bc\"><div class=\"breath-text\" id=\"bt\">Get ready<\/div><\/div>\n          <div class=\"breath-count\" id=\"bcnt\">Tap start<\/div>\n          <button class=\"btn\" id=\"bstart\">Start<\/button>\n        <\/div>\n      <\/div>`;\n    let phase = 0, cycle = 0;\n    const phases = [\n      {label:'Breathe in', dur:4000, action:'in'},\n      {label:'Hold', dur:7000, action:'hold'},\n      {label:'Breathe out', dur:8000, action:'out'}\n    ];\n    const bc = document.getElementById('bc');\n    const bt = document.getElementById('bt');\n    const bcnt = document.getElementById('bcnt');\n    document.getElementById('bstart').addEventListener('click', function(){\n      this.style.display = 'none';\n      function next(){\n        const p = phases[phase];\n        bt.textContent = p.label;\n        if(p.action === 'in') bc.classList.add('in');\n        if(p.action === 'out') bc.classList.remove('in');\n        bcnt.textContent = `Round ${cycle+1} of 4`;\n        breathTimer = setTimeout(() => {\n          phase++;\n          if(phase >= phases.length){\n            phase = 0;\n            cycle++;\n            if(cycle >= 4){\n              bt.textContent = 'Beautiful.';\n              bcnt.textContent = 'Feel how you are now.';\n              bc.classList.remove('in');\n              return;\n            }\n          }\n          next();\n        }, p.dur);\n      }\n      next();\n    });\n  }\n\n  // --- Visualisatie ---\n  function startVisual() {\n    stopAll();\n    exStage.innerHTML = `\n      <div class=\"card card-ornate\">\n        <h3 style=\"margin-top:0;\">Geleide visualisatie<\/h3>\n        <p style=\"font-size:14px; color:var(--text-dim); margin-bottom:18px;\">Read slowly, with pauses. Close your eyes in between and imagine. Take 5\u201310 minutes.<\/p>\n        <div class=\"visual-script\">\n          <p>Breathe deeply in and out three times. Feel your body soften. You are safe here.<\/p>\n          <p>Imagine: it's exactly one year later. You wake in the morning \u2014 in a life where your greatest longing is fulfilled.<\/p>\n          <p>Where do you wake? What light falls through the window? What do you hear? What do you smell?<\/p>\n          <p>Get up. Walk through your day. Who do you see? What do you say to yourself in the mirror? Which clothes do you choose? How does your body feel \u2014 looser, lighter, more alive?<\/p>\n          <p>Someone calls or sends a message and shares something beautiful. What is it?<\/p>\n          <p>Halfway through the day you pause and remember this version of you \u2014 the one trying, sometimes doubting. What would you say to her or him? What reassurance?<\/p>\n          <p>Feel gratitude flow. Not for what's coming \u2014 for what <em>is<\/em>, in this future you're touching now.<\/p>\n          <p>Breathe deeply once more. Gently open your eyes. Take the feeling with you. You just sent a broadcast.<\/p>\n        <\/div>\n      <\/div>`;\n  }\n\n  // --- Affirmaties ---\n  const affirmations = [\n    \"I am a magnet for everything aligned with my highest good.\",\n    \"What is meant for me, finds me \u2014 effortlessly and at the right moment.\",\n    \"Ik vertrouw de timing van mijn leven.\",\n    \"Overvloed is mijn natuurlijke staat.\",\n    \"I am safe to want what I want.\",\n    \"My presence is enough. I don\\'t have to prove, only to be.\",\n    \"The universe works <em>for<\/em> me, not against me.\",\n    \"I let go of what no longer fits, and make room for what does.\",\n    \"Ik ben de versie van mezelf die ik nodig heb \u2014 vandaag al.\",\n    \"Money flows to me easily through expected and unexpected channels.\",\n    \"Love recognises love. I attract what I am.\",\n    \"My longing is a signpost, not a problem.\",\n    \"I may rest. My worth doesn\\'t depend on my output.\",\n    \"I am manifesting \u2014 also now, also in this moment of doubt.\",\n    \"Everything I really need is already on the way or already within me.\"\n  ];\n  let affirmIdx = 0;\n  function startAffirm() {\n    stopAll();\n    affirmIdx = Math.floor(Math.random()*affirmations.length);\n    exStage.innerHTML = `\n      <div class=\"card card-ornate\">\n        <h3 style=\"margin-top:0;\">Affirmatie sessie<\/h3>\n        <p style=\"font-size:14px; color:var(--text-dim); margin-bottom:18px;\">Read aloud. Breathe between each affirmation. Notice if one 'clicks' \u2014 that one's for you today.<\/p>\n        <div class=\"affirmation\">\n          <div class=\"affirmation-text\" id=\"aff\">${affirmations[affirmIdx]}<\/div>\n          <button class=\"btn\" id=\"aff-next\">Next affirmation<\/button>\n        <\/div>\n      <\/div>`;\n    document.getElementById('aff-next').addEventListener('click', () => {\n      affirmIdx = (affirmIdx+1) % affirmations.length;\n      const el = document.getElementById('aff');\n      el.style.opacity = 0;\n      setTimeout(() => {\n        el.textContent = affirmations[affirmIdx];\n        el.style.opacity = 1;\n      }, 200);\n    });\n  }\n\n  // --- Dankbaarheid ---\n  function startGrat() {\n    stopAll();\n    const prompts = [\n      \"Three things you're grateful for in your body today\",\n      \"Someone who did something for you this week (small counts)\",\n      \"Something in your home worthy of being noticed\",\n      \"A quality of yourself you're proud of\",\n      \"A memory from the past week that made you smile\",\n      \"Something that went well, even though you didn\\'t expect it\"\n    ];\n    exStage.innerHTML = `\n      <div class=\"card card-ornate\">\n        <h3 style=\"margin-top:0;\">Dankbaarheidsstroom<\/h3>\n        <p style=\"font-size:14px; color:var(--text-dim); margin-bottom:20px;\">Gratitude is the fastest frequency-raiser there is. Walk through these prompts, say the answer aloud or write it down.<\/p>\n        ${prompts.map((p,i) => `\n          <div style=\"padding:16px 0; border-bottom:1px dashed var(--mist);\">\n            <div style=\"font-family:var(--serif); font-style:italic; font-size:13px; color:var(--gold); letter-spacing:0.15em; text-transform:uppercase;\">Prompt ${i+1}<\/div>\n            <div style=\"font-family:var(--serif); font-size:19px; color:var(--cream); margin-top:4px;\">${p}<\/div>\n          <\/div>`).join('')}\n        <p style=\"margin-top:24px; font-family:var(--serif); font-style:italic; color:var(--gold-soft); text-align:center;\">End with a deep breath. Feel the difference.<\/p>\n      <\/div>`;\n  }\n\n  // --- Scripting ---\n  function startScript() {\n    stopAll();\n    exStage.innerHTML = `\n      <div class=\"card card-ornate\">\n        <h3 style=\"margin-top:0;\">Scripting prompt<\/h3>\n        <p style=\"font-size:14px; color:var(--text-dim); margin-bottom:18px;\">Grab a notebook or notes app. Write for 10 minutes \u2014 as if it's already happened. In present tense. With emotion. With details.<\/p>\n        <div class=\"visual-script\">\n          <p style=\"font-style:normal;\"><strong style=\"color:var(--gold-soft); font-weight:500; font-family:var(--sans); font-size:13px; letter-spacing:0.15em; text-transform:uppercase;\">Begin with:<\/strong><\/p>\n          <p>\"I still can't believe that...\"<\/p>\n          <p>\"Today was one of those days where everything aligned. It started with...\"<\/p>\n          <p>\"When I woke this morning, I realised...\"<\/p>\n          <p>\"The past month everything changed. The most beautiful part is...\"<\/p>\n        <\/div>\n        <h3>Writing rules:<\/h3>\n        <ul class=\"fancy\">\n          <li>Present or past tense, never future<\/li>\n          <li>Write the feeling, not just the fact<\/li>\n          <li>Be specific \u2014 names, colours, conversations<\/li>\n          <li>Don't ask 'is this really possible' while writing<\/li>\n          <li>End with 'and so it is' or 'thank you'<\/li>\n        <\/ul>\n      <\/div>`;\n  }\n\n  // --- Verlangen scherpstellen ---\n  function startClarity() {\n    stopAll();\n    exStage.innerHTML = `\n      <div class=\"card card-ornate\">\n        <h3 style=\"margin-top:0;\">Verlangen scherpstellen<\/h3>\n        <p style=\"font-size:14px; color:var(--text-dim); margin-bottom:18px;\">This exercise is for when you sense you want something, but it's still vague. Vagueness makes you passive. Clarity makes you mobile.<\/p>\n        <div class=\"visual-script\">\n          <p><strong style=\"color:var(--gold-soft); font-family:var(--sans); font-size:13px; letter-spacing:0.15em; text-transform:uppercase;\">Complete these sentences:<\/strong><\/p>\n          <p>1. \"What I truly long for is...\"<\/p>\n          <p>2. \"I want this because then I feel...\"<\/p>\n          <p>3. \"So the core isn't just the thing, but the feeling of...\"<\/p>\n          <p>4. \"Today I can already practise that feeling by...\"<\/p>\n          <p>5. \"One concrete sign this longing is becoming reality is...\"<\/p>\n        <\/div>\n        <h3>Examples:<\/h3>\n        <ul class=\"fancy\">\n          <li><strong style=\"color:var(--cream);\">Money<\/strong> \u2014 \"I long for financial peace, so I can choose more freely and not constantly survive.\"<\/li>\n          <li><strong style=\"color:var(--cream);\">Love<\/strong> \u2014 \"I long for a relationship where I'm safe, seen and relaxed as myself.\"<\/li>\n          <li><strong style=\"color:var(--cream);\">Work<\/strong> \u2014 \"I long for work where my energy grows rather than drains.\"<\/li>\n        <\/ul>\n        <p style=\"margin-top:18px; font-family:var(--serif); font-style:italic; color:var(--gold-soft); text-align:center;\">If you can say it in one sentence, you can start living it.<\/p>\n      <\/div>`;\n  }\n\n  // --- Overtuiging ombuigen ---\n  function startBelief() {\n    stopAll();\n    exStage.innerHTML = `\n      <div class=\"card card-ornate\">\n        <h3 style=\"margin-top:0;\">Overtuiging ombuigen<\/h3>\n        <p style=\"font-size:14px; color:var(--text-dim); margin-bottom:18px;\">A blockage often isn't a lack of longing, but a belief talking through it. You don't have to fight it. You can rewrite it.<\/p>\n        <div class=\"visual-script\">\n          <p><strong style=\"color:var(--gold-soft); font-family:var(--sans); font-size:13px; letter-spacing:0.15em; text-transform:uppercase;\">Use this order:<\/strong><\/p>\n          <p>1. Old belief: \"I actually believe that...\"<\/p>\n          <p>2. Where does this come from? \"I learned this through...\"<\/p>\n          <p>3. Is this always true? \"Evidence this isn't always true...\"<\/p>\n          <p>4. New belief: \"I now choose to practise believing that...\"<\/p>\n          <p>5. Small action: \"Today I prove that by...\"<\/p>\n        <\/div>\n        <h3>Examples:<\/h3>\n        <ul class=\"fancy\">\n          <li>\"I'm bad with money\" becomes: \"I'm learning to handle money more calmly and wisely.\"<\/li>\n          <li>\"Love always goes wrong\" becomes: \"I get to learn to receive love in a new way.\"<\/li>\n          <li>\"Beautiful opportunities aren't for me\" becomes: \"I get to get used to bigger opportunities.\"<\/li>\n        <\/ul>\n        <p style=\"margin-top:18px; font-family:var(--serif); font-style:italic; color:var(--gold-soft); text-align:center;\">You don't have to believe a new belief one hundred percent right away. You only have to practise it often enough.<\/p>\n      <\/div>`;\n  }\n\n  // --- Identiteitsactie ---\n  function startIdentity() {\n    stopAll();\n    exStage.innerHTML = `\n      <div class=\"card card-ornate\">\n        <h3 style=\"margin-top:0;\">Identiteitsactie<\/h3>\n        <p style=\"font-size:14px; color:var(--text-dim); margin-bottom:18px;\">Manifestation accelerates when you don't just ask for a different life, but train yourself to become the person who can carry it.<\/p>\n        <div class=\"visual-script\">\n          <p>At the top of your page write: \"The version of me who already has this...\"<\/p>\n          <p>Then make three columns:<\/p>\n          <p><strong style=\"color:var(--cream);\">Does:<\/strong> which small habits belong?<\/p>\n          <p><strong style=\"color:var(--cream);\">No longer does:<\/strong> which patterns does this version release?<\/p>\n          <p><strong style=\"color:var(--cream);\">Chooses today:<\/strong> which action fits in 10 minutes?<\/p>\n        <\/div>\n        <h3>Choose one micro-action:<\/h3>\n        <ul class=\"fancy\">\n          <li>Tidy one spot as if you're someone making room for something new.<\/li>\n          <li>Send one email as if opportunities are normal for you.<\/li>\n          <li>Say a clear no once as if boundaries are self-evident.<\/li>\n          <li>Wear something you recognise your future self in.<\/li>\n        <\/ul>\n        <p style=\"margin-top:18px; font-family:var(--serif); font-style:italic; color:var(--gold-soft); text-align:center;\">Don't wait until you're sure. You become sure by acting.<\/p>\n      <\/div>`;\n  }\n\n  // --- Kleine bewijs-test ---\n  function startProof() {\n    stopAll();\n    exStage.innerHTML = `\n      <div class=\"card card-ornate\">\n        <h3 style=\"margin-top:0;\">Kleine bewijs-test<\/h3>\n        <p style=\"font-size:14px; color:var(--text-dim); margin-bottom:18px;\">This builds trust without pressure. Pick something small, unimportant and playful. Not because it has to be magical, but so your system learns that things can come to you.<\/p>\n        <div class=\"visual-script\">\n          <p>1. Pick one small sign for the next 48 hours.<\/p>\n          <p>2. Make it specific enough to recognise, but not important.<\/p>\n          <p>3. Say: \"Show me this in a light, clear way.\"<\/p>\n          <p>4. Let it go. Don't search as if you must force evidence.<\/p>\n          <p>5. Write down what you saw, heard or received.<\/p>\n        <\/div>\n        <h3>Good small signs:<\/h3>\n        <ul class=\"fancy\">\n          <li>A yellow flower, a red bike, a butterfly, a particular song.<\/li>\n          <li>An unexpected compliment or message from someone you were thinking of.<\/li>\n          <li>A word you almost never see.<\/li>\n        <\/ul>\n        <p style=\"margin-top:18px; font-family:var(--serif); font-style:italic; color:var(--gold-soft); text-align:center;\">Keep it light. Trust grows better in playfulness than in control.<\/p>\n      <\/div>`;\n  }\n\n  // --- Ge\u00efnspireerde actie ---\n  function startAction() {\n    stopAll();\n    exStage.innerHTML = `\n      <div class=\"card card-ornate\">\n        <h3 style=\"margin-top:0;\">Ge\u00efnspireerde actie<\/h3>\n        <p style=\"font-size:14px; color:var(--text-dim); margin-bottom:18px;\">Manifesting isn't sitting back. It's learning to feel which action comes from trust and which from panic.<\/p>\n        <div class=\"visual-script\">\n          <p>Write your longing at the top.<\/p>\n          <p>Then ask: \"Which action feels light, logical or curious?\"<\/p>\n          <p>Make a list of five actions. Star the one you can do within 24 hours.<\/p>\n          <p>Don't take the biggest action. Take the action that brings movement.<\/p>\n        <\/div>\n        <h3>Examples:<\/h3>\n        <ul class=\"fancy\">\n          <li><strong style=\"color:var(--cream);\">New job<\/strong> \u2014 update one profile, save one job listing, email one old contact.<\/li>\n          <li><strong style=\"color:var(--cream);\">More love<\/strong> \u2014 send one honest invitation, voice one boundary, visit one place where you're yourself.<\/li>\n          <li><strong style=\"color:var(--cream);\">More rest<\/strong> \u2014 reschedule one appointment, tidy one drawer, schedule one screen-free hour.<\/li>\n        <\/ul>\n        <p style=\"margin-top:18px; font-family:var(--serif); font-style:italic; color:var(--gold-soft); text-align:center;\">Action is the bridge between longing and evidence.<\/p>\n      <\/div>`;\n  }\n\n  // --- Loslaat-ritueel ---\n  function startRelease() {\n    stopAll();\n    exStage.innerHTML = `\n      <div class=\"card card-ornate\">\n        <h3 style=\"margin-top:0;\">Loslaat-ritueel<\/h3>\n        <p style=\"font-size:14px; color:var(--text-dim); margin-bottom:18px;\">Letting go doesn't mean your longing no longer matters. It means you stop squeezing the outcome.<\/p>\n        <div class=\"visual-script\">\n          <p>Write: \"I'm currently trying to control that...\"<\/p>\n          <p>Then write: \"What I actually want to feel is...\"<\/p>\n          <p>Fold your paper or close your note. Place your hand on your chest.<\/p>\n          <p>Say slowly: \"I release the how. I stay available for the best outcome.\"<\/p>\n          <p>Then do something ordinary: drink water, walk, shower, wash dishes. Your body must learn that letting go is safe.<\/p>\n        <\/div>\n        <h3>When to do this?<\/h3>\n        <ul class=\"fancy\">\n          <li>When you keep checking your phone.<\/li>\n          <li>When you keep running scenarios in your head.<\/li>\n          <li>When manifestation feels like stress instead of trust.<\/li>\n        <\/ul>\n        <p style=\"margin-top:18px; font-family:var(--serif); font-style:italic; color:var(--gold-soft); text-align:center;\">You may long. You don't have to squeeze.<\/p>\n      <\/div>`;\n  }\n\n  function stopAll() {\n    if(breathTimer) { clearTimeout(breathTimer); breathTimer = null; }\n  }\n\n  // ===== Stuck / gevoelens =====\n  const feelings = [\n    {key:'frust', icon:'\ud83d\ude24', label:'Frustrated'},\n    {key:'twijfel', icon:'\ud83d\ude15', label:'Doubting'},\n    {key:'leeg', icon:'\ud83d\ude36', label:'Empty / flat'},\n    {key:'jaloers', icon:'\ud83d\ude23', label:'Envious'},\n    {key:'overweldigd', icon:'\ud83d\ude35\u200d\ud83d\udcab', label:'Overwhelmed'},\n    {key:'eenzaam', icon:'\ud83e\udd40', label:'Lonely'},\n    {key:'ongeduld', icon:'\u23f3', label:'Impatient'},\n    {key:'angstig', icon:'\ud83d\ude30', label:'Anxious'}\n  ];\n  const advice = {\n    frust: {\n      title: 'Frustratie',\n      body: 'Frustration isn\\'t your enemy \u2014 it\\'s a signal you\\'re holding on to a specific outcome instead of the essence. <strong style=\"color:var(--cream);\">What is the essence?<\/strong> Niet \"die ene baan\" maar misschien \"werk dat me waardevol laat voelen.\" Niet \"deze persoon\" maar \"verbinding waarin ik mezelf mag zijn.\" Bring it back to the feeling. The universe has a thousand roads \u2014 you know only three. Give it space.',\n      action: 'Ask yourself one question: what\\'s the <em>gevoel<\/em> achter dit verlangen? Schrijf dat op en focus daar \u00e9\u00e9n dag op.'\n    },\n    twijfel: {\n      title: 'Twijfel',\n      body: 'Doubt isn\\'t the absence of belief \u2014 it\\'s belief under stress. Don\\'t force trust, that fuels doubt. <strong style=\"color:var(--cream);\">Make it smaller.<\/strong> Manifesteer iets onbelangrijks deze week: een mooi compliment, een meevaller in het verkeer, een vriend die plots belt. Bewijs aan je systeem \u2014 niet je hoofd \u2014 dat dit werkt. Vertrouwen groeit via ervaring, niet via overtuiging.',\n      action: 'Manifest something small and innocent today. Write down when it happens.'\n    },\n    leeg: {\n      title: 'Leegte',\n      body: 'Emptiness isn\\'t failure \u2014 it\\'s often a transition. Iets oud is opgeruimd, iets nieuw is nog niet aangekomen. <strong style=\"color:var(--cream);\">Probeer in deze fase niet te manifesteren.<\/strong> Probeer te <em style=\"color:var(--rose); font-style:italic;\">leven.<\/em> Loop, kook, slaap goed, bel iemand. Verlangen heeft een lichaam nodig waarin het kan landen. Een uitgeput lichaam ontvangt niets. Vul je vat eerst.',\n      action: 'Do one thing today purely for your body. Not productive. No goal. Just for you.'\n    },\n    jaloers: {\n      title: 'Jaloezie',\n      body: 'Envy isn\\'t an ugly emotion \u2014 it\\'s a <em style=\"color:var(--gold-soft); font-style:italic;\">wegwijzer.<\/em> It points exactly to what you also want. The problem isn\\'t that she/he has it \u2014 the problem is you believe their having means your loss. <strong style=\"color:var(--cream);\">The universe isn\\'t a fixed pie.<\/strong> Vier hun manifestatie. Letterlijk. Schrijf hen een berichtje, of denk: \"if she can do this, I can too.\" That\\'s how you step into the same frequency.',\n      action: 'Send a sincere compliment to someone you envied. Feel what shifts.'\n    },\n    overweldigd: {\n      title: 'Overweldiging',\n      body: 'You\\'re trying to manifest too much at once, or thinking too far ahead. <strong style=\"color:var(--cream);\">Manifestation isn\\'t planning.<\/strong> It\\'s attunement, one moment at a time. Pick one longing for the coming month. One. Set the rest aside with love \u2014 not away. Their turn will come. Looking out too many windows at once shows you nothing.',\n      action: 'Write one sentence: \"This month I attune to _____.\" Put it somewhere visible.'\n    },\n    eenzaam: {\n      title: 'Eenzaamheid',\n      body: 'Eenzaamheid is een van de moeilijkste gevoelens om te manifesteren mee om te gaan, omdat het echt en pijnlijk is. <strong style=\"color:var(--cream);\">Acknowledge it first.<\/strong> Manifestation isn\\'t an escape. Feel it. Write about it. Bel desnoods iemand \u2014 een vriend, een hulplijn, iemand. Pas wanneer je gehoord bent (door jezelf of een ander) kan de frequentie verschuiven. Liefde komt op een staat van zelf-bewogen-zijn, niet op een staat van uithongering.',\n      action: 'Ask yourself: how can I today be the kind of company I wish to meet? Do one thing of that.'\n    },\n    ongeduld: {\n      title: 'Ongeduld',\n      body: 'Impatience says: \"it should be here now.\" What you broadcast is: \"it\\'s not here.\" So that\\'s what you get back \u2014 more \"it\\'s not here.\" <strong style=\"color:var(--cream);\">De wet van ritme<\/strong> is heel echt: zaden groeien ondergronds voordat ze zichtbaar zijn. Jouw verlangen heeft een seizoen. Vertrouw het. Vraag jezelf: wat zou ik vandaag doen als ik 100% zeker wist dat het over zes weken arriveert?',\n      action: 'Today do something that fits the you <em>na<\/em> the manifestation. Small but concrete.'\n    },\n    angstig: {\n      title: 'Angst',\n      body: 'Fear isn\\'t the opposite of manifestation \u2014 it\\'s an invitation to take careful care of yourself first. <strong style=\"color:var(--cream);\">Don\\'t manifest a longing if you\\'re in crisis.<\/strong> Manifest safety. Manifest rest. Manifesteer een diepe, lange, droomloze slaap. Een gereguleerd zenuwstelsel is de basis van alles. En: als de angst aanhoudt of zwaar wordt, praat met iemand \u2014 een vriend, huisarts, therapeut. Manifestatie en hulp zoeken sluiten elkaar nooit uit.',\n      action: 'Breath 4 in, 7 vast, 8 uit. Drie keer. Stuur dan \u00e9\u00e9n bericht naar iemand die je vertrouwt.'\n    }\n  };\n  const feelingsContainer = document.getElementById('feelings');\n  feelings.forEach(f => {\n    const b = document.createElement('button');\n    b.className = 'feeling-btn';\n    b.innerHTML = `<span class=\"feeling-icon\">${f.icon}<\/span>${f.label}`;\n    b.addEventListener('click', () => {\n      document.querySelectorAll('.feeling-btn').forEach(x => x.classList.remove('active'));\n      b.classList.add('active');\n      showAdvice(f.key);\n    });\n    feelingsContainer.appendChild(b);\n  });\n  function showAdvice(key) {\n    const a = advice[key];\n    const box = document.getElementById('advice');\n    box.innerHTML = `\n      <div class=\"section-label\">For you now<\/div>\n      <h3 style=\"margin-top:0;\">${a.title}<\/h3>\n      <p>${a.body}<\/p>\n      <div style=\"background:rgba(251,191,36,0.08); border-left:3px solid var(--gold); padding:14px 18px; border-radius:8px; margin-top:18px;\">\n        <div style=\"font-size:11px; letter-spacing:0.2em; color:var(--gold); text-transform:uppercase; margin-bottom:6px;\">Try this<\/div>\n        <div style=\"font-family:var(--serif); font-size:17px; color:var(--cream); font-style:italic;\">${a.action}<\/div>\n      <\/div>`;\n    box.classList.add('show');\n    box.scrollIntoView({behavior:'smooth', block:'nearest'});\n  }\n\n  // ===== Inspiratie / vonken =====\n  const sparks = [\n    {text: \"The universe isn't a vending machine. It's a mirror.\", src: \"Manifestatiegids\"},\n    {text: \"You don\\'t attract what you want. You attract what you are.\", src: \"Onbekend\"},\n    {text: \"Gedachten worden dingen.\", src: \"Mike Dooley\"},\n    {text: \"Be grateful for what you have; you\\'ll receive more in the end. If you focus on what you don\\'t have, you\\'ll never, ever have enough.\", src: \"Oprah Winfrey\"},\n    {text: \"Your life doesn\\'t change when you get new things. It changes when <em>you<\/em> change.\", src: \"Manifestatiegids\"},\n    {text: \"The biggest doubt isn't in your head. It's in your breath. Never lose your breath for long.\", src: \"Manifestatiegids\"},\n    {text: \"Waiting is a state. Living is a choice. Do the second.\", src: \"Manifestatiegids\"},\n    {text: \"When you no longer want to leave your life to get something else, you've already arrived.\", src: \"Manifestatiegids\"},\n    {text: \"Letting go isn\\'t stopping. It\\'s stopping the squeeze.\", src: \"Manifestatiegids\"},\n    {text: \"The how isn\\'t your work. The why is.\", src: \"Manifestatiegids\"},\n    {text: \"Nothing in nature blooms all year. Don\\'t expect that of yourself either.\", src: \"Onbekend\"},\n    {text: \"What is meant for you won\\'t miss you.\", src: \"Onbekend\"},\n    {text: \"Manifestation without rest is just work in spiritual clothes.\", src: \"Manifestatiegids\"},\n    {text: \"You don\\'t have to know how. You only have to say 'yes' when it comes.\", src: \"Manifestatiegids\"},\n    {text: \"Finding happiness isn\\'t the quest. Recognising it is.\", src: \"Manifestatiegids\"}\n  ];\n  let lastSpark = -1;\n  function newSpark() {\n    let i;\n    do { i = Math.floor(Math.random()*sparks.length); } while (i === lastSpark && sparks.length > 1);\n    lastSpark = i;\n    const el = document.getElementById('spark');\n    const src = document.getElementById('spark-src');\n    el.style.opacity = 0;\n    src.style.opacity = 0;\n    setTimeout(() => {\n      el.textContent = sparks[i].text;\n      src.textContent = '\u2014 ' + sparks[i].src;\n      el.style.opacity = 1;\n      src.style.opacity = 1;\n    }, 250);\n  }\n  document.getElementById('spark-btn').addEventListener('click', newSpark);\n  newSpark();\n\n  // ===================================================\n  // \ud83c\udf19 MAAN KALENDER\n  // ===================================================\n  (function moonCalendar(){\n    // Berekening op basis van bekende nieuwe maan: 6 jan 2000 18:14 UTC\n    // Synodische maand: 29.530588853 dagen\n    function getMoonData(date) {\n      const knownNewMoon = new Date(Date.UTC(2000, 0, 6, 18, 14));\n      const synodic = 29.530588853;\n      const diff = (date - knownNewMoon) / (1000 * 60 * 60 * 24);\n      const cycle = ((diff % synodic) + synodic) % synodic;\n      const phase = cycle / synodic; // 0 tot 1\n      // Illuminatie als functie van fase\n      const illum = (1 - Math.cos(2 * Math.PI * phase)) / 2 * 100;\n      return { cycle, phase, illum, daysIntoCycle: cycle };\n    }\n\n    const phases = [\n      { min: 0, max: 0.0625, key: 'new', name: 'New Moon', illumDesc: '0% lit' },\n      { min: 0.0625, max: 0.1875, key: 'waxcres', name: 'Waxing Crescent', illumDesc: 'Light grows' },\n      { min: 0.1875, max: 0.3125, key: 'firstq', name: 'First Quarter', illumDesc: '50% lit' },\n      { min: 0.3125, max: 0.4375, key: 'waxgib', name: 'Waxing Gibbous', illumDesc: 'Almost full' },\n      { min: 0.4375, max: 0.5625, key: 'full', name: 'Full Moon', illumDesc: '100% lit' },\n      { min: 0.5625, max: 0.6875, key: 'wangib', name: 'Waning Gibbous', illumDesc: 'Light wanes' },\n      { min: 0.6875, max: 0.8125, key: 'lastq', name: 'Last Quarter', illumDesc: '50% lit' },\n      { min: 0.8125, max: 0.9375, key: 'wancres', name: 'Waning Crescent', illumDesc: 'Almost dark' },\n      { min: 0.9375, max: 1.01, key: 'new', name: 'New Moon', illumDesc: '0% lit' }\n    ];\n\n    const phaseData = {\n      new: {\n        intent: 'The dark moon is an empty vessel \u2014 a new beginning. This is the moment to plant intentions, write goals and ask: <em>what do I really want?<\/em> Begin new projects, write your manifestation list, feel where you want to grow.',\n        ritual: 'Write one clear intention on a small paper. Hold it in your hand, breathe over it three times, store it safely until full moon.'\n      },\n      waxcres: {\n        intent: 'Light grows. This is the phase of <em>taking action<\/em>. Your new moon intentions ask for first, small steps. Not everything at once \u2014 pick one concrete action that aligns with your longing.',\n        ritual: 'Do one thing today that fits your intention. Small, concrete, visible. Confirm: \"I\\'m moving, even though I don\\'t see everything yet.\"'\n      },\n      firstq: {\n        intent: 'The moon is at a turning point \u2014 half light, half shadow. Tension, decisions, obstacles arise. This is a phase of <em>perseverance<\/em>. Don\\'t give up, don\\'t over-push \u2014 just keep going.',\n        ritual: 'Write: what\\'s holding me back? What\\'s my next step, despite that resistance? One sentence per question. Keep it simple.'\n      },\n      waxgib: {\n        intent: 'Almost full \u2014 energy builds. Time to <em>refine<\/em>. What doesn\\'t quite fit your plan, your longing, your direction? Adjust, fine-tune, evaluate. Not starting or stopping, but attuning.',\n        ritual: 'Read back what you wrote at new moon. Ask: does this still feel right? Adjust if needed \u2014 no shame in that.'\n      },\n      full: {\n        intent: 'The full moon is a mirror \u2014 everything becomes visible. Successes, frustrations, what fits, what doesn\\'t. A powerful <em>manifestation peak<\/em>: visualise vividly, write scripting, feel intense gratitude for what\\'s already on the way.',\n        ritual: 'Go outside (if you can) and stand briefly in the moonlight. Say aloud: \"I receive what\\'s for me. Thank you.\" Feel that it\\'s already happened.'\n      },\n      wangib: {\n        intent: 'Light wanes. Time to release what no longer serves. Which habit, thought, relationship or worry may you release now? <em>Letting go isn\\'t failure \u2014 it\\'s making room<\/em>.',\n        ritual: 'Write on a note what you\\'re releasing. Safely burn it, tear it, or bury it. One thing per cycle is enough.'\n      },\n      lastq: {\n        intent: 'Second turning point \u2014 the moon asks for <em>forgiveness and revision<\/em>. Forgive yourself for what didn\\'t work. Forgive others where you can. This isn\\'t weakness; it\\'s clearing that makes room.',\n        ritual: 'Write a letter to yourself from six months ago. What would you forgive her/him? What would you say to her?'\n      },\n      wancres: {\n        intent: 'The still phase before new moon. <em>Rest now<\/em>. Manifesting isn\\'t work for this week. Sleep well, take space, meditate, listen. The seed rests beneath the soil before growing.',\n        ritual: 'Today do <strong>less<\/strong> than you\\'re used to. Withdraw, take a bath, read a book. Trust that doing-nothing is also work.'\n      }\n    };\n\n    function getCurrentPhase(phase) {\n      for (const p of phases) {\n        if (phase >= p.min && phase < p.max) return p;\n      }\n      return phases[0];\n    }\n\n    function fmtDate(d) {\n      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];\n      const months = ['January','February','March','April','mei','June','July','August','September','October','November','December'];\n      return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;\n    }\n\n    function findNextPhase(currentDate, targetKey) {\n      // Zoek dichtstbijzijnde dag waarop targetKey actief is\n      for (let i = 1; i < 32; i++) {\n        const d = new Date(currentDate.getTime() + i * 86400000);\n        const data = getMoonData(d);\n        const p = getCurrentPhase(data.phase);\n        if (p.key === targetKey) {\n          return { date: d, days: i };\n        }\n      }\n      return null;\n    }\n\n    function update() {\n      const now = new Date();\n      const data = getMoonData(now);\n      const phase = getCurrentPhase(data.phase);\n      const info = phaseData[phase.key];\n\n      document.getElementById('moon-name').textContent = phase.name;\n      document.getElementById('moon-illum').textContent = `${Math.round(data.illum)}% verlicht`;\n      document.getElementById('moon-date').textContent = fmtDate(now);\n      document.getElementById('moon-intent').innerHTML = info.intent;\n      document.getElementById('moon-ritual').innerHTML = info.ritual;\n\n      // Visuele schaduw op de maan\n      const shadow = document.getElementById('moon-shadow');\n      // phase 0 = nieuw (geheel donker), 0.5 = vol (geen schaduw), 1 = nieuw\n      // We tekenen schaduw als horizontale schuif van links naar rechts\n      let shadowOffset;\n      if (data.phase < 0.5) {\n        // Wassend: schaduw schuift naar links uit beeld\n        shadowOffset = -data.phase * 2 * 100; // 0% -> -100%\n        shadow.style.transform = `translateX(${shadowOffset}%)`;\n      } else {\n        // Afnemend: schaduw komt vanaf rechts\n        shadowOffset = (data.phase - 0.5) * 2 * 100; // 0% -> 100%\n        shadow.style.transform = `translateX(${shadowOffset}%)`;\n      }\n\n      // Next belangrijke fase\n      const nextFull = findNextPhase(now, 'full');\n      const nextNew = findNextPhase(now, 'new');\n      let nextText = '';\n      if (phase.key !== 'full' && phase.key !== 'new') {\n        if (nextFull.days < nextNew.days) {\n          nextText = `\ud83c\udf15 Full moon in ${nextFull.days} dag${nextFull.days===1?'':'en'} \u2014 ${fmtDate(nextFull.date)}`;\n        } else {\n          nextText = `\ud83c\udf11 New moon in ${nextNew.days} dag${nextNew.days===1?'':'en'} \u2014 ${fmtDate(nextNew.date)}`;\n        }\n      } else if (phase.key === 'full') {\n        nextText = `\ud83c\udf11 Next new moon: ${fmtDate(nextNew.date)} (in ${nextNew.days} days)`;\n      } else {\n        nextText = `\ud83c\udf15 Next full moon: ${fmtDate(nextFull.date)} (in ${nextFull.days} days)`;\n      }\n      document.getElementById('moon-next').innerHTML = nextText;\n\n      // 8-fasen mini cyclus\n      const cycleEl = document.getElementById('moon-cycle');\n      cycleEl.innerHTML = '';\n      const cycleData = [\n        {key:'new', label:'New', gradient: 'radial-gradient(circle, #1a0b2e 0%, #1a0b2e 100%)'},\n        {key:'waxcres', label:'Crescent', gradient: 'linear-gradient(90deg, #1a0b2e 70%, #f5e6ff 100%)'},\n        {key:'firstq', label:'1st Q', gradient: 'linear-gradient(90deg, #1a0b2e 50%, #f5e6ff 50%)'},\n        {key:'waxgib', label:'Waxing', gradient: 'linear-gradient(90deg, #1a0b2e 25%, #f5e6ff 25%)'},\n        {key:'full', label:'Full', gradient: 'radial-gradient(circle, #f5e6ff 0%, #d4c5e8 100%)'},\n        {key:'wangib', label:'Waning', gradient: 'linear-gradient(90deg, #f5e6ff 75%, #1a0b2e 75%)'},\n        {key:'lastq', label:'Last', gradient: 'linear-gradient(90deg, #f5e6ff 50%, #1a0b2e 50%)'},\n        {key:'wancres', label:'Crescent', gradient: 'linear-gradient(90deg, #f5e6ff 90%, #1a0b2e 100%)'}\n      ];\n      cycleData.forEach(c => {\n        const mm = document.createElement('div');\n        mm.className = 'mini-moon' + (c.key === phase.key ? ' current' : '');\n        mm.innerHTML = `<div class=\"mini-moon-icon\" style=\"background:${c.gradient}\"><\/div><div class=\"mini-moon-label\">${c.label}<\/div>`;\n        cycleEl.appendChild(mm);\n      });\n    }\n\n    update();\n    // Update when view is opened (for consistency if app stays open for days)\n    document.querySelector('[data-view=\"moon\"]').addEventListener('click', update);\n  })();\n\n  // ===================================================\n  // \ud83e\ude9e INSPIRATIE DECK (single card draw)\n  // ===================================================\n  (function inspirationDeck(){\n    const quotes = [\n      { quote: 'You don\\'t attract what you want. You attract what you are.', author: 'Unknown' },\n      { quote: 'Thoughts become things. Choose the beautiful ones.', author: 'Mike Dooley' },\n      { quote: 'De universele wet is: wees, doe, krijg. Niet: doe, krijg, wees.', author: 'Manifestation Guide' },\n      { quote: 'It\\'s done from the moment you truly feel it.', author: 'Neville Goddard' },\n      { quote: 'Nothing in nature blooms all year. Don\\'t expect that of yourself.', author: 'Unknown' },\n      { quote: 'Wat voor jou bestemd is, mist jou niet.', author: 'Unknown' },\n      { quote: 'Wees dankbaar voor wat je hebt. Je krijgt uiteindelijk meer.', author: 'Oprah Winfrey' },\n      { quote: 'Verbeeldingskracht is de werkplaats van het universum.', author: 'Albert Einstein' },\n      { quote: 'Trust is courage in silence.', author: 'Manifestation Guide' },\n      { quote: 'You don\\'t have to know how. You only have to say yes when it comes.', author: 'Manifestation Guide' },\n      { quote: 'The how isn\\'t your work. The why is.', author: 'Manifestation Guide' },\n      { quote: 'Waiting without living is a prison. Living without waiting is a miracle.', author: 'Manifestation Guide' },\n      { quote: 'Letting go isn\\'t stopping. It\\'s stopping the squeeze.', author: 'Manifestation Guide' },\n      { quote: 'Frequency changes. Circumstances follow.', author: 'Manifestation Guide' },\n      { quote: 'The outer world is the echo of your inner world.', author: 'Unknown' },\n      { quote: 'Your future is listening. Speak softly and beautifully.', author: 'Manifestation Guide' },\n      { quote: 'Manifestation isn\\'t a wish. It\\'s a state.', author: 'Manifestation Guide' },\n      { quote: 'You\\'re manifesting now too. Ask yourself: what am I broadcasting?', author: 'Manifestation Guide' },\n      { quote: 'The universe doesn\\'t respond to what you ask. It responds to who you are.', author: 'Unknown' },\n      { quote: 'Happiness isn\\'t a place to arrive. It\\'s a way of travelling.', author: 'Margaret Lee Runbeck' },\n      { quote: 'You aren\\'t a drop in the ocean. You are the whole ocean in a drop.', author: 'Rumi' },\n      { quote: 'When you change how you look at things, the things you look at change.', author: 'Wayne Dyer' },\n      { quote: 'What you resist, persists. What you embrace, transforms.', author: 'Carl Jung' },\n      { quote: 'Don\\'t give the universe a wish. Give it a feeling.', author: 'Manifestation Guide' },\n      { quote: 'Your dreams know the way. Walk with them, not ahead of them.', author: 'Manifestation Guide' },\n      { quote: 'What you radiate today, you\\'ll meet tomorrow.', author: 'Manifestation Guide' },\n      { quote: 'The most beautiful things often manifest in a way you could never have planned.', author: 'Manifestation Guide' },\n      { quote: 'Trust the rhythm. Not everything is always spring.', author: 'Manifestation Guide' },\n      { quote: 'The universe isn\\'t in a hurry. You are. That\\'s the difference.', author: 'Manifestation Guide' },\n      { quote: 'How you talk about yourself is a spell. Be careful with your words.', author: 'Unknown' },\n      { quote: 'You don\\'t change the world by pulling at it. You change it by shining into it.', author: 'Manifestation Guide' },\n      { quote: 'Not everything that grows slowly grows wrong.', author: 'Manifestation Guide' },\n      { quote: 'Pretend \u2014 not to lie, but to remind yourself who you already are.', author: 'Manifestation Guide' },\n      { quote: 'What you truly want, wants you too.', author: 'Unknown' },\n      { quote: 'A content heart is the strongest magnet.', author: 'Manifestation Guide' },\n      { quote: 'Manifestation without rest is just work in spiritual clothes.', author: 'Manifestation Guide' },\n      { quote: 'Change doesn\\'t begin with doing. It begins with believing you\\'re allowed to.', author: 'Manifestation Guide' },\n      { quote: 'It isn\\'t \"believing and seeing\". It\\'s believing, and <em>then<\/em> seeing.', author: 'Unknown' },\n      { quote: 'Pleasure isn\\'t a luxury. Pleasure is frequency.', author: 'Manifestation Guide' },\n      { quote: 'The right people find you when you\\'re yourself. The wrong ones disappear on their own.', author: 'Manifestation Guide' },\n      { quote: 'Between longing and receiving lies trust. Not waiting \u2014 trusting.', author: 'Manifestation Guide' },\n      { quote: 'You\\'re not late. You\\'re right on time for your own life.', author: 'Unknown' },\n      { quote: 'What you can\\'t see may already be on the way.', author: 'Manifestation Guide' },\n      { quote: 'Be gentle with the version of you still learning.', author: 'Manifestation Guide' },\n      { quote: 'Stop surviving. Start attuning.', author: 'Manifestation Guide' },\n      { quote: 'What you say to yourself each morning builds a life.', author: 'Unknown' },\n      { quote: 'The universe doesn\\'t send letters. It sends feelings.', author: 'Manifestation Guide' },\n      { quote: 'Enjoying where you are now is the fastest path to where you want to go.', author: 'Abraham Hicks' },\n      { quote: 'Asking, believing, receiving. Especially the third.', author: 'Manifestation Guide' },\n      { quote: 'One breath can turn a day around. Move, breathe, recover.', author: 'Manifestation Guide' },\n      { quote: 'Doubt isn\\'t the absence of belief. It\\'s belief under stress.', author: 'Manifestation Guide' },\n      { quote: 'Every day is a new offer. What are you saying yes to today?', author: 'Manifestation Guide' },\n      { quote: 'Manifestation is a dance, not a request.', author: 'Manifestation Guide' },\n      { quote: 'Be the person you\\'re looking for now.', author: 'Manifestation Guide' },\n      { quote: 'Magic doesn\\'t ask for perfection. Only for consistency.', author: 'Manifestation Guide' }\n    ];\n\n    const deckEl = document.getElementById('insp-deck');\n    const revealEl = document.getElementById('insp-reveal');\n    let lastIdx = -1;\n\n    function makeCard() {\n      deckEl.innerHTML = '';\n      const c = document.createElement('div');\n      c.className = 'insp-card';\n      c.innerHTML = `\n        <div class=\"insp-card-face insp-card-back\">\n          <span class=\"back-label\">Draw a card<\/span>\n        <\/div>\n        <div class=\"insp-card-face insp-card-front\" id=\"insp-content\"><\/div>`;\n      c.addEventListener('click', () => {\n        if (c.classList.contains('flipped')) return;\n        // Pick a quote\n        let i;\n        do { i = Math.floor(Math.random() * quotes.length); } while (i === lastIdx && quotes.length > 1);\n        lastIdx = i;\n        const q = quotes[i];\n        document.getElementById('insp-content').innerHTML = `\n          <div class=\"insp-quote\">${q.quote}<\/div>\n          <div class=\"insp-author\">\u2014 ${q.author}<\/div>`;\n        c.classList.add('flipped');\n        showReflection(q);\n      });\n      deckEl.appendChild(c);\n    }\n\n    function showReflection(q) {\n      // A short reflection question matching the quote\n      const reflections = [\n        'What if this sentence was meant for you today?',\n        'Read it again. Which word lingers?',\n        'What would your day look like if you really believed this?',\n        'What would you do differently today from this truth?',\n        'Write it somewhere. Read it again later.',\n        'What in y
