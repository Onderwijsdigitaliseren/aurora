<style>
  :root{
    --deep:#0f0520;--night:#1a0b2e;--violet:#2d1b4e;--plum:#4a2670;
    --orchid:#7c3aed;--rose:#c084fc;--gold:#fbbf24;--gold-soft:#fde68a;--gold-deep:#d97706;
    --green:#6ee7b7;--line:rgba(255,255,255,.10);--mist:rgba(255,255,255,.06);--mist-strong:rgba(255,255,255,.12);
    --text:#f5e6ff;--text-soft:#d4c5e8;--text-dim:#9b89b8;
    --serif:'Cormorant Garamond',Georgia,serif;--sans:'Outfit',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:var(--deep);color:var(--text);font-family:var(--sans);font-weight:300;overflow:hidden;-webkit-font-smoothing:antialiased;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  /* sub-nav (binnen een sectie) */
  .subbar{display:flex;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;overflow-x:auto;background:rgba(15,5,32,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);flex-shrink:0;-webkit-overflow-scrolling:touch;}
  .subbar::-webkit-scrollbar{display:none;}
  .sub-btn{white-space:nowrap;background:var(--mist);border:1px solid var(--line);color:var(--text-soft);border-radius:100px;padding:8px 15px;font-family:var(--sans);font-size:13px;cursor:pointer;transition:all .2s;flex-shrink:0;}
  .sub-btn.active{background:rgba(124,58,237,.35);border-color:var(--rose);color:#fff;}
  .subbar.single{display:none;}
  .sub-intro{display:flex;align-items:center;white-space:nowrap;font-family:var(--serif);font-style:italic;font-size:14px;color:var(--text-dim);padding-right:6px;flex-shrink:0;}

  .stage{flex:1;position:relative;overflow:hidden;}
  iframe.frame{position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--deep);display:none;}
  iframe.frame.show{display:block;}

  /* hoofdnav onderaan */
  nav.main{display:flex;justify-content:space-around;background:rgba(15,5,32,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));flex-shrink:0;}
  .nav-btn{flex:1;background:none;border:none;cursor:pointer;color:var(--text-dim);font-family:var(--sans);font-size:10.5px;font-weight:400;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 2px;transition:color .2s;letter-spacing:.3px;}
  .nav-btn .ico{font-size:19px;transition:transform .2s;}
  .nav-btn.active{color:var(--gold-soft);}
  .nav-btn.active .ico{transform:translateY(-1px) scale(1.08);}

  /* settings overlay */
  #settings{position:fixed;inset:0;z-index:50;background:var(--deep);overflow-y:auto;display:none;}
  #settings.show{display:block;}
  .set-wrap{max-width:560px;margin:0 auto;padding:calc(20px+env(safe-area-inset-top)) 20px 60px;}
  .back-btn{background:none;border:1px solid var(--line);color:var(--text-soft);border-radius:100px;padding:9px 17px;font-family:var(--sans);font-size:14px;cursor:pointer;margin-bottom:20px;}
  .set-wrap h2{font-family:var(--serif);font-size:30px;font-weight:500;margin-bottom:6px;}
  .set-wrap .note{color:var(--text-dim);font-size:14px;margin-bottom:24px;line-height:1.6;}
  .set-card{background:linear-gradient(160deg,var(--mist-strong),var(--mist));border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;}
  .set-card.danger{border-color:rgba(251,113,133,.3);}
  .set-card h3{font-family:var(--serif);font-size:20px;font-weight:500;margin-bottom:12px;}
  .sum-row{display:flex;justify-content:space-between;font-size:14px;color:var(--text-soft);padding:7px 0;border-bottom:1px solid var(--line);}
  .sum-row:last-child{border-bottom:none;}
  .store-note{font-size:13.5px;color:var(--text-dim);line-height:1.6;margin-bottom:16px;}
  .wipe-col{display:flex;flex-direction:column;gap:10px;}
  .wbtn{border-radius:100px;padding:12px 20px;font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;background:transparent;color:var(--text-soft);border:1px solid var(--line);transition:border-color .2s;width:100%;}
  .wbtn.danger{background:linear-gradient(135deg,#fb7185,#be123c);color:#fff;border:none;}
  .gear{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:5;background:rgba(15,5,32,.6);border:1px solid var(--line);color:var(--text-soft);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px;backdrop-filter:blur(10px);}

  .modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(8,3,18,.8);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .25s;}
  .modal-overlay.show{opacity:1;pointer-events:auto;}
  .modal{background:linear-gradient(160deg,var(--violet),var(--night));border:1px solid var(--line);border-radius:24px;padding:26px 24px;max-width:380px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.5);}
  .modal .m-icon{font-size:34px;text-align:center;margin-bottom:12px;}
  .modal h3{font-family:var(--serif);font-size:24px;font-weight:500;text-align:center;margin-bottom:10px;}
  .modal p{font-size:14.5px;color:var(--text-soft);text-align:center;line-height:1.6;margin-bottom:8px;}
  .modal .warn-line{color:#fda4af;font-size:13px;}
  .modal .confirm-check{display:flex;align-items:flex-start;gap:10px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin:16px 0;cursor:pointer;font-size:14px;color:var(--text-soft);line-height:1.4;}
  .modal .confirm-check input{margin-top:3px;width:18px;height:18px;accent-color:#fb7185;flex-shrink:0;}
  .modal-actions{display:flex;gap:10px;}
  .mbtn{flex:1;border-radius:100px;padding:12px 18px;font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;border:none;}
  .mbtn.ghost{background:transparent;color:var(--text-soft);border:1px solid var(--line);}
  .mbtn.danger{background:linear-gradient(135deg,#fb7185,#be123c);color:#fff;}
  .mbtn:disabled{opacity:.4;cursor:not-allowed;}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#2a1a05;padding:12px 22px;border-radius:100px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .35s;z-index:300;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

<script>
/* ============================================================
   OPSLAG-LAAG (parent) — echte browseropslag i.p.v. window.storage.
   Implementeert get/set/delete/list met dezelfde vorm als de
   oorspronkelijke API, zodat de werelden onveranderd blijven werken.
   Wil je later inloggen + cloud-sync? Vervang alleen dit ene object
   door een implementatie die naar je backend praat.
   ============================================================ */
(function () {
  if (window.storage && typeof window.storage.list === "function") return; // host levert het al
  var NS = "maanlicht::";
  function full(k) { return NS + k; }
  function later(fn) { return new Promise(function (res) { res(fn()); }); }
  window.storage = {
    get: function (key) {
      return later(function () {
        var v = localStorage.getItem(full(key));
        return v === null ? null : { key: key, value: v };
      });
    },
    set: function (key, value) {
      return later(function () {
        localStorage.setItem(full(key), String(value));
        return { key: key, value: String(value) };
      });
    },
    delete: function (key) {
      return later(function () {
        localStorage.removeItem(full(key));
        return { key: key, deleted: true };
      });
    },
    list: function (prefix) {
      return later(function () {
        var pre = full(prefix || ""), keys = [];
        for (var i = 0; i < localStorage.length; i++) {
          var kk = localStorage.key(i);
          if (kk && kk.indexOf(pre) === 0) keys.push(kk.slice(NS.length));
        }
        return { keys: keys };
      });
    }
  };
})();
</script>

  <div class="subbar single" id="subbar"></div>

        <button class="wbtn danger" onclick="confirmWipe('all')">Clear everything</button>

, var(--deep) 100%);\n    background-attachment: fixed;\n    padding-bottom: calc(132px + env(safe-area-inset-bottom));\n  }\n\n  /* Sterren achtergrond */\n  .stars {\n    position: fixed;\n    inset: 0;\n    pointer-events: none;\n    z-index: 0;\n    overflow: hidden;\n  }\n  .star {\n    position: absolute;\n    width: 2px; height: 2px;\n    background: var(--gold-soft);\n    border-radius: 50%;\n    animation: twinkle 3s infinite ease-in-out;\n    box-shadow: 0 0 6px var(--gold);\n  }\n  @keyframes twinkle {\n    0%, 100% { opacity: 0.2; transform: scale(0.8); }\n    50% { opacity: 1; transform: scale(1.2); }\n  }\n\n  /* Header */\n  header {\n    position: relative;\n    z-index: 2;\n    padding: 32px 24px 24px;\n    text-align: center;\n    padding-top: calc(32px + env(safe-area-inset-top));\n  }\n  .logo {\n    font-family: var(--serif);\n    font-style: italic;\n    font-size: 14px;\n    letter-spacing: 0.4em;\n    color: var(--gold);\n    text-transform: uppercase;\n    margin-bottom: 12px;\n    opacity: 0.85;\n  }\n  .logo::before, .logo::after {\n    content: '\u2726';\n    margin: 0 12px;\n    font-size: 10px;\n    color: var(--rose);\n  }\n  h1.title {\n    font-family: var(--serif);\n    font-weight: 500;\n    font-size: clamp(38px, 8vw, 64px);\n    line-height: 1;\n    letter-spacing: -0.02em;\n    background: linear-gradient(135deg, var(--cream) 0%, var(--gold-soft) 40%, var(--rose) 100%);\n    -webkit-background-clip: text;\n    background-clip: text;\n    -webkit-text-fill-color: transparent;\n    margin-bottom: 8px;\n  }\n  h1.title em {\n    font-style: italic;\n    font-weight: 400;\n  }\n  .tagline {\n    font-family: var(--serif);\n    font-style: italic;\n    font-size: 17px;\n    color: var(--text-soft);\n    max-width: 520px;\n    margin: 0 auto;\n    opacity: 0.9;\n  }\n\n  /* Main content */\n  main {\n    position: relative;\n    z-index: 2;\n    max-width: 720px;\n    margin: 0 auto;\n    padding: 16px 20px 40px;\n  }\n\n  /* Tab content */\n  .view { display: none; animation: fadeUp 0.6s ease; }\n  .view.active { display: block; }\n  @keyframes fadeUp {\n    from { opacity: 0; transform: translateY(12px); }\n    to { opacity: 1; transform: translateY(0); }\n  }\n\n  /* Section styling */\n  .section-label {\n    font-family: var(--serif);\n    font-style: italic;\n    font-size: 13px;\n    letter-spacing: 0.3em;\n    color: var(--gold);\n    text-transform: uppercase;\n    margin-bottom: 12px;\n    display: flex;\n    align-items: center;\n    gap: 12px;\n  }\n  .section-label::before {\n    content: '';\n    width: 24px;\n    height: 1px;\n    background: var(--gold);\n  }\n  h2 {\n    font-family: var(--serif);\n    font-weight: 500;\n    font-size: clamp(28px, 5vw, 38px);\n    line-height: 1.15;\n    margin-bottom: 20px;\n    color: var(--cream);\n    letter-spacing: -0.01em;\n  }\n  h2 em {\n    font-style: italic;\n    color: var(--rose);\n  }\n  h3 {\n    font-family: var(--serif);\n    font-weight: 500;\n    font-size: 22px;\n    color: var(--gold-soft);\n    margin: 24px 0 10px;\n    letter-spacing: -0.01em;\n  }\n  p {\n    color: var(--text-soft);\n    font-size: 16px;\n    margin-bottom: 14px;\n  }\n  .lead {\n    font-family: var(--serif);\n    font-size: 19px;\n    font-style: italic;\n    color: var(--cream);\n    line-height: 1.5;\n    margin-bottom: 24px;\n  }\n\n  /* Cards */\n  .card {\n    background: linear-gradient(145deg, rgba(124,58,237,0.12) 0%, rgba(74,38,112,0.18) 100%);\n    backdrop-filter: blur(20px);\n    -webkit-backdrop-filter: blur(20px);\n    border: 1px solid var(--mist);\n    border-radius: 24px;\n    padding: 28px 24px;\n    margin-bottom: 20px;\n    position: relative;\n    overflow: hidden;\n  }\n  .card::before {\n    content: '';\n    position: absolute;\n    top: 0; left: 0; right: 0;\n    height: 1px;\n    background: linear-gradient(90deg, transparent, var(--gold), transparent);\n    opacity: 0.5;\n  }\n  .card-ornate::after {\n    content: '\u2726';\n    position: absolute;\n    top: 18px; right: 22px;\n    color: var(--gold);\n    opacity: 0.4;\n    font-size: 14px;\n  }\n\n  /* Wet-cards (de 7 wetten) */\n  .law-grid { display: grid; gap: 14px; margin-top: 16px; }\n  .law-card {\n    background: rgba(255,255,255,0.04);\n    border: 1px solid var(--mist);\n    border-radius: 18px;\n    padding: 20px;\n    cursor: pointer;\n    transition: all 0.3s ease;\n    position: relative;\n  }\n  .law-card:hover, .law-card:active {\n    background: rgba(124,58,237,0.15);\n    border-color: rgba(251,191,36,0.4);\n    transform: translateY(-2px);\n  }\n  .law-card .num {\n    font-family: var(--serif);\n    font-style: italic;\n    font-size: 13px;\n    color: var(--gold);\n    letter-spacing: 0.1em;\n  }\n  .law-card .name {\n    font-family: var(--serif);\n    font-size: 22px;\n    color: var(--cream);\n    margin: 4px 0 8px;\n  }\n  .law-card .desc {\n    font-size: 14px;\n    color: var(--text-soft);\n    line-height: 1.5;\n  }\n  .law-card .full {\n    display: none;\n    margin-top: 14px;\n    padding-top: 14px;\n    border-top: 1px dashed var(--mist-strong);\n    font-size: 15px;\n    color: var(--text-soft);\n  }\n  .law-card.open .full { display: block; animation: fadeUp 0.4s ease; }\n  .law-card.open { background: rgba(124,58,237,0.15); border-color: rgba(251,191,36,0.4); }\n\n  /* Step list (handleiding) */\n  .steps { counter-reset: step; }\n  .step {\n    position: relative;\n    padding: 24px 20px 24px 70px;\n    margin-bottom: 16px;\n    background: rgba(255,255,255,0.04);\n    border: 1px solid var(--mist);\n    border-radius: 18px;\n    counter-increment: step;\n  }\n  .step::before {\n    content: counter(step, decimal-leading-zero);\n    position: absolute;\n    left: 20px;\n    top: 22px;\n    font-family: var(--serif);\n    font-style: italic;\n    font-size: 32px;\n    color: var(--gold);\n    line-height: 1;\n  }\n  .step h4 {\n    font-family: var(--serif);\n    font-size: 21px;\n    font-weight: 50 yle: italic; }\n\n  /* Stuck helper */\n  .feeling-grid {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));\n    gap: 10px;\n    margin: 20px 0;\n  }\n  .feeling-btn {\n    padding: 14px 10px;\n    background: rgba(255,255,255,0.04);\n    border: 1px solid var(--mist);\n    border-radius: 14px;\n    color: var(--text);\n    font-family: var(--sans);\n    font-size: 14px;\n    cursor: pointer;\n    transition: all 0.3s ease;\n    text-align: center;\n  }\n  .feeling-btn:hover, .feeling-btn.active {\n    background: rgba(124,58,237,0.25);\n    border-color: var(--gold);\n    color: var(--cream);\n  }\n  .feeling-icon { font-size: 22px; display: block; margin-bottom: 4px; }\n\n  .advice-box {\n    background: linear-gradient(135deg, rgba(124,58,237,0.2), rgba(251,191,36,0.08));\n    border: 1px solid var(--gold);\n    border-radius: 20px;\n    padding: 28px 24px;\n    margin-top: 20px;\n    display: none;\n  }\n  .advice-box.show { display: block; animation: fadeUp 0.5s ease; }\n  .advice-box h3 { margin-top: 0; }\n\n  /* Challenge, plan en dagboek */\n  .progress-track {\n    width: 100%;\n    height: 10px;\n    background: rgba(255,255,255,0.08);\n    border-radius: 999px;\n    overflow: hidden;\n    margin: 14px 0 8px;\n  }\n  .progress-bar {\n    width: 0%;\n    height: 100%;\n    background: linear-gradient(90deg, var(--gold), var(--rose));\n    border-radius: inherit;\n    transition: width 0.4s ease;\n  }\n  .challenge-day {\n    background: rgba(255,255,255,0.04);\n    border: 1px solid var(--mist);\n    border-radius: 16px;\n    padding: 18px;\n    margin-bottom: 12px;\n  }\n  .challenge-day.done {\n    border-color: rgba(251,191,36,0.55);\n    background: rgba(251,191,36,0.08);\n  }\n  .challenge-day .day-num {\n    font-size: 11px;\n    letter-spacing: 0.18em;\n    color: var(--gold);\n    text-transform: uppercase;\n    margin-bottom: 4px;\n  }\n  .challenge-day h4 {\n    font-family: var(--serif);\n    font-size: 21px;\n low {\n    0%, 100% { box-shadow: 0 0 60px rgba(251,191,36,0.3), 0 0 100px rgba(192,132,252,0.4), inset -20px -20px 40px rgba(15,5,32,0.3); }\n    50% { box-shadow: 0 0 80px rgba(251,191,36,0.5), 0 0 130px rgba(192,132,252,0.6), inset -20px -20px 40px rgba(15,5,32,0.3); }\n  }\n  .moon-shadow {\n    position: absolute;\n    top: 0;\n    width: 100%;\n    height: 100%;\n    background: var(--deep);\n    border-radius: 50%;\n    transition: transform 1s ease;\n  }\n  .moon-craters::before, .moon-craters::after {\n    content: '';\n    position: absolute;\n    border-radius: 50%;\n    background: rgba(155, 137, 184, 0.4);\n    box-shadow: inset 1px 1px 2px rgba(15,5,32,0.3);\n  }\n  .moon-craters::before {\n    width: 18px; height: 18px;\n    top: 40px; left: 50px;\n  }\n  .moon-craters::after {\n    width: 12px; height: 12px;\n    top: 90px; left: 110px;\n  }\n  .moon-phase-name {\n    font-family: var(--serif);\n    font-style: italic;\n    font-size: 28px;\n    color: var(--cream);\n    margin-bottom: 4px;\n  }\n  .moon-illum {\n    font-size: 12px;\n    letter-spacing: 0.2em;\n    color: var(--gold);\n    text-transform: uppercase;\n  }\n  .moon-date {\n    font-family: var(--serif);\n    font-size: 15px;\n    color: var(--text-soft);\n    margin-top: 6px;\n    font-style: italic;\n  }\n  .moon-cycle {\n    display: flex;\n    justify-content: space-between;\n    gap: 6px;\n    margin: 24px 0 8px;\n    padding: 14px 8px;\n    background: rgba(0,0,0,0.2);\n    border-radius: 100px;\n    overflow-x: auto;\n    scrollbar-width: none;\n  }\n  .moon-cycle::-webkit-scrollbar { display: none; }\n  .mini-moon {\n    flex-shrink: 0;\n    text-align: center;\n    cursor: pointer;\n    padding: 4px 6px;\n    border-radius: 12px;\n    transition: all 0.3s ease;\n    min-width: 50px;\n  }\n  .mini-moon.current {\n    background: rgba(251,191,36,0.15);\n  }\n  .mini-moon-icon {\n    width: 28px;\n    height: 28px;\n    margin: 0 auto 4px;\n    border-radius: 50%;\n    background: linear-gradient(90deg, #f5e6ff 50%, transparent 50%);\n    position: relative;\n    overflow: hidden;\n  }\n  .mini-moon-label {\n    font-size: 9px;\n    color: var(--text-dim);\n    letter-spacing: 0.05em;\n  }\n  .mini-moon.current .mini-moon-label {\n    color: var(--gold);\n  }\n\n  /* ===== INSPIRATIE SINGLE CARD ===== */\n  .single-deck {\n    display: flex;\n    justify-content: center;\n    margin: 30px 0 20px;\n    perspective: 1200px;\n    min-height: 260px;\n  }\n  .insp-card {\n    width: 200px;\n    height: 280px;\n    border-radius: 18px;\n    cursor: pointer;\n    transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);\n    transform-style: preserve-3d;\n    position: relative;\n  }\n  @media (max-width: 400px) {\n    .insp-card { width: 170px; height: 240px; }\n  }\n  .insp-card.flipped { transform: rotateY(180deg); }\n  .insp-card-face {\n    position: absolute;\n    inset: 0;\n    border-radius: 18px;\n    -webkit-backface-visibility: hidden;\n    backface-visibility: hidden;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    padding: 22px 20px;\n    text-align: center;\n  }\n  .insp-card-back {\n    background:\n      radial-gradient(circle at 30% 30%, rgba(251,191,36,0.4) 0%, transparent 50%),\n      radial-gradient(circle at 70% 70%, rgba(192,132,252,0.3) 0%, transparent 50%),\n      linear-gradient(135deg, var(--plum) 0%, var(--violet) 50%, var(--night) 100%);\n    border: 1px solid var(--gold);\n    box-shadow: 0 8px 32px rgba(124,58,237,0.5), inset 0 0 30px rgba(251,191,36,0.15);\n    flex-direction: column;\n    gap: 12px;\n  }\n  .insp-card-back::before {\n    content: '\u2726';\n    font-size: 56px;\n    color: var(--gold);\n    text-shadow: 0 0 30px var(--gold), 0 0 60px rgba(251,191,36,0.5);\n    animation: pulse-glow 3s ease-in-out infinite;\n    line-height: 1;\n  }\n  .insp-card-back .back-label {\n    font-family: var(--serif);\n    font-style: italic;\n    font-size: 13px;\n    color: var(--gold-soft);\n    letter-spacing: 0.3em;\n    text-transform: uppercase;\n    opacity: 0.8;\n  }\n  .insp-card-back::after {\n    content: '';\n    position: absolute;\n    inset: 10px;\n    border: 1px solid rgba(251,191,36,0.3);\n    border-radius: 12px;\n    pointer-events: none;\n  }\n  .insp-card-front {\n    background:\n      linear-gradient(160deg, var(--cream) 0%, var(--gold-soft) 60%, #f4c773 100%);\n    transform: rotateY(180deg);\n    color: var(--deep);\n    flex-direction: column;\n    box-shadow: 0 8px 40px rgba(251,191,36,0.5);\n    padding: 26px 22px;\n  }\n  .insp-card-front::before {\n    content: '\"';\n    position: absolute;\n    top: -8px; left: 12px;\n    font-family: var(--serif);\n    font-size: 80px;\n    color: var(--gold-deep);\n    opacity: 0.3;\n    line-height: 1;\n  }\n  .insp-card-front::after {\n    content: '\u2726';\n    position: absolute;\n    bottom: 14px;\n    color: var(--gold-deep);\n    opacity: 0.4;\n    font-size: 14px;\n  }\n  .insp-quote {\n    font-family: var(--serif);\n    font-style: italic;\n    font-size: 17px;\n    line-height: 1.35;\n    color: var(--deep);\n    margin-bottom: 10px;\n    font-weight: 500;\n  }\n  .insp-author {\n    font-family: var(--sans);\n    font-size: 10px;\n    letter-spacing: 0.2em;\n    color: var(--gold-deep);\n    text-transform: uppercase;\n    font-weight: 500;\n  }\n  .insp-card.shuffling {\n    animation: shuffle 0.6s ease;\n  }\n  .insp-reveal {\n    display: none;\n    margin-top: 16px;\n    padding: 20px 22px;\n    background: linear-gradient(135deg, rgba(251,191,36,0.1), rgba(124,58,237,0.12));\n    border: 1px solid var(--mist-strong);\n    border-radius: 16px;\n    text-align: center;\n  }\n  .insp-reveal.show { display: block; animation: fadeUp 0.5s ease; }\n  .insp-reveal h4 {\n    font-family: var(--serif);\n    font-style: italic;\n    font-size: 12px;\n    color: var(--gold);\n    letter-spacing: 0.2em;\n    text-transform: uppercase;\n    margin-bottom: 8px;\n  }\n  .insp-reveal p {\n    font-family: var(--serif);\n    font-size: 15px;\n    color: var(--text-soft);\n    font-style: italic;\n    margin: 0;\n  }\n\n  /* ===== INSPIRATIE SINGLE CARD EINDE ===== */\n  /* ===== ORAKEL ===== */\n  .oracle-stage {\n    padding: 20px 0;\n  }\n  .oracle-deck {\n    display: flex;\n    justify-content: center;\n    gap: 14px;\n    margin: 30px 0 20px;\n    perspective: 1000px;\n    min-height: 220px;\n  }\n  .oracle-card {\n    width: 110px;\n    height: 180px;\n    border-radius: 14px;\n    cursor: pointer;\n    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);\n    transform-style: preserve-3d;\n    position: relative;\n  }\n  @media (max-width: 400px) {\n    .oracle-card { width: 90px; height: 150px; }\n  }\n  .oracle-card.flipped { transform: rotateY(180deg); }\n  .oracle-card-face {\n    position: absolute;\n    inset: 0;\n    border-radius: 14px;\n    -webkit-backface-visibility: hidden;\n    backface-visibility: hidden;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    padding: 12px;\n    text-align: center;\n  }\n  .oracle-card-back {\n    background:\n      radial-gradient(circle at 50% 50%, rgba(251,191,36,0.3) 0%, transparent 60%),\n      linear-gradient(135deg, var(--plum) 0%, var(--violet) 50%, var(--night) 100%);\n    border: 1px solid var(--gold);\n    box-shadow: 0 4px 20px rgba(124,58,237,0.4), inset 0 0 20px rgba(251,191,36,0.1);\n  }\n  .oracle-card-back::before {\n    content: '\u2726';\n    font-size: 42px;\n    color: var(--gold);\n    text-shadow: 0 0 20px var(--gold), 0 0 40px rgba(251,191,36,0.5);\n    animation: pulse-glow 3s ease-in-out infinite;\n  }\n  @keyframes pulse-glow {\n    0%, 100% { opacity: 0.7; transform: scale(1); }\n    50% { opacity: 1; transform: scale(1.15); }\n  }\n  .oracle-card-back::after {\n    content: '';\n    position: absolute;\n    inset: 8px;\n    border: 1px solid rgba(251,191,36,0.3);\n    border-radius: 8px;\n    pointer-events: none;\n  }\n  .oracle-card-front {\n    background: linear-gradient(160deg, var(--cream) 0%, var(--gold-soft) 100%);\n    transform: rotateY(180deg);\n    color: var(--deep);\n    flex-direction: column;\n    box-shadow: 0 4px 30px rgba(251,191,36,0.4);\n  }\n  .oracle-card-symbol {\n    font-size: 32px;\n    margin-bottom: 4px;\n  }\n  .oracle-card-title {\n    font-family: var(--serif);\n    font-size: 14px;\n    font-style: italic;\n    color: var(--deep);\n    line-height: 1.2;\n    font-weight: 500;\n  }\n  .oracle-card.shuffling {\n    animation: shuffle 0.6s ease;\n  }\n  @keyframes shuffle {\n    0% { transform: translateY(0) rotate(0); }\n    25% { transform: translateY(-20px) rotate(-8deg); }\n    50% { transform: translateY(0) rotate(0); }\n    75% { transform: translateY(-15px) rotate(6deg); }\n    100% { transform: translateY(0) rotate(0); }\n  }\n  .oracle-reveal {\n    display: none;\n    margin-top: 20px;\n    padding: 24px;\n    background: linear-gradient(135deg, rgba(251,191,36,0.1), rgba(124,58,237,0.15));\n    border: 1px solid var(--gold);\n    border-radius: 18px;\n  }\n  .oracle-reveal.show { display: block; animation: fadeUp 0.6s ease; }\n  .oracle-reveal h4 {\n    font-family: var(--serif);\n    font-style: italic;\n    font-size: 14px;\n    color: var(--gold);\n    letter-spacing: 0.2em;\n    text-transform: uppercase;\n    margin-bottom: 6px;\n  }\n  .oracle-reveal .name {\n    font-family: var(--serif);\n    font-size: 24px;\n    color: var(--cream);\n    margin-bottom: 10px;\n  }\n  .oracle-reveal .msg {\n    font-family: var(--serif);\n    font-style: italic;\n    font-size: 17px;\n    color: var(--text);\n    line-height: 1.5;\n  }\n  .oracle-instr {\n    text-align: center;\n    font-family: var(--serif);\n    font-style: italic;\n    font-size: 16px;\n    color: var(--gold-soft);\n    margin: 10px 0 0;\n  }\n  .oracle-controls {\n    display: flex;\n    gap: 10px;\n    justify-content: center;\n    margin-top: 20px;\n    flex-wrap: wrap;\n  }\n\n  /* Update bottom nav to fit many items */\n  .nav-inner {\n    justify-content: flex-start;\n    padding: 10px 8px;\n  }\n  .nav-btn { font-size: 8px; padding: 6px 2px; }\n  .nav-btn .ico { font-size: 17px; }\n  @media (max-width: 380px) {\n    .nav-btn { font-size: 0; gap: 0; flex-basis: 48px; }\n    .nav-btn .ico { font-size: 21px; }\n  }\n\n  /* Responsive */\n  @media (max-width: 480px) {\n    .card { padding: 22px 18px; }\n    .step { padding: 22px 16px 22px 60px; }\n    .step::before { left: 16px; font-size: 26px; }\n  }\n  nav.bottom { display:none !important; }\n  body { padding-bottom: 20px !important; }\n<\/style>\n<\/head>\n<body>\n<script>window.__WORLD_PREFIX__='aurora';<\/script>\n<script>/* ============================================================\n   OPSLAGBRUG \u2014 ge\u00efnjecteerd in elke wereld-iframe.\n   Vervangt localStorage en window.storage door een proxy\n   die via postMessage met de hoofdapp praat (die de echte\n   window.storage heeft). Sleutels worden geprefixt per wereld.\n   ============================================================ */\n(function(){\n  const WORLD = window.__WORLD_PREFIX__ || 'x';\n  const parent = window.parent;\n  let reqId = 0;\n  const pending = {};\n\n  function call(op, key, value){\n    return new Promise((resolve)=>{\n      const id = ++reqId;\n      pending[id] = resolve;\n      parent.postMessage({ __storageBridge:true, id, op, world:WORLD, key, value }, '*');\n    });\n  }\n  window.addEventListener('message', (e)=>{\n    const d = e.data;\n    if(d && d.__storageBridgeReply && pending[d.id]){ pending[d.id](d.result); delete pending[d.id]; }\n  });\n\n  /* --- async window.storage proxy (voor Reis) --- */\n  window.storage = {\n    get:    (key)        => call('get', key),\n    set:    (key, value) => call('set', key, value),\n    delete: (key)        => call('delete', key),\n    list:   (prefix)     => call('list', prefix || ''),\n  };\n\n  /* --- synchrone localStorage-shim (voor Aurora) ---\n     Houdt een in-memory cache die bij init gevuld is, leest synchroon,\n     en schrijft async door naar de parent. --- */\n  const cache = {};\n  // initi\u00eble cache is al ingebakken door de parent v\u00f3\u00f3r deze iframe laadde\n  try { if (window.__INITIAL_CACHE__) Object.assign(cache, window.__INITIAL_CACHE__); } catch(e){}\n  window.__primeCache = function(obj){ Object.assign(cache, obj || {}); };\n  try {\n    Object.defineProperty(window, 'localStorage', {\n      configurable:true,\n      value: {\n        getItem(k){ return (k in cache) ? cache[k] : null; },\n        setItem(k,v){ cache[k] = String(v); call('lset', k, String(v)); },\n        removeItem(k){ delete cache[k]; call('ldel', k); },\n        clear(){ for(const k in cache) delete cache[k]; call('lclear'); },\n        key(i){ return Object.keys(cache)[i] || null; },\n        get length(){ return Object.keys(cache).length; }\n      }\n    });\n  } catch(e){ /* localStorage already defined; ignore */ }\n\n  /* signaal aan parent dat iframe klaar is en de cache wil */\n  parent.postMessage({ __storageBridge:true, op:'ready', world:WORLD }, '*');\n})();\n<\/script>\n\n\n<div class=\"stars\" id=\"stars\"><\/div>\n\n<header>\n  <div class=\"logo\">Manifestation Guide<\/div>\n  <h1 class=\"title\">Law of <em>Attraction<\/em><\/h1>\n  <p class=\"tagline\">A practical guide to conscious manifestation \u2014 explanation, exercises & support when you get stuck.<\/p>\n<\/header>\n\n<main>\n\n  <!-- INSPIRATIE DECK (start view) -->\n  <section class=\"view active\" id=\"view-welcome\">\n    <div class=\"section-label\">Welcome<\/div>\n    <h2>A card for <em>today<\/em><\/h2>\n    <p class=\"lead\">Draw one inspiration card. One thought to pause with, carry along, write down, or just feel. What you draw is exactly what you were meant to hear today.<\/p>\n\n    <div class=\"card card-ornate\">\n      <p class=\"oracle-instr\" id=\"insp-instr\">Breathe in. Tap the card.<\/p>\n\n      <div class=\"single-deck\" id=\"insp-deck\"><\/div>\n\n      <div class=\"insp-reveal\" id=\"insp-reveal\"><\/div>\n\n      <div class=\"oracle-controls\">\n        <button class=\"btn\" id=\"insp-new\">New card<\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"divider\">\u2726 \u2726 \u2726<\/div>\n\n    <div class=\"card\">\n      <h3 style=\"margin-top:0;\">How best to use Aurora<\/h3>\n      <ul class=\"fancy\">\n        <li><strong style=\"color:var(--cream);\">Today<\/strong> \u2014 your gentle starting point: a card for the day, a spark, and a moment to attune<\/li>\n        <li><strong style=\"color:var(--cream);\">Learn<\/strong> \u2014 understanding how it works: what it is, how to do it, and help when it stalls<\/li>\n        <li><strong style=\"color:var(--cream);\">Practise<\/strong> \u2014 concrete exercises and rituals to do, now<\/li>\n        <li><strong style=\"color:var(--cream);\">Cards<\/strong> \u2014 choose a deck that fits and draw: daily card, oracle, angels & guides, or abundance<\/li>\n        <li><strong style=\"color:var(--cream);\">My journey<\/strong> \u2014 your 28-day path, your plan, your evidence and the moon phase together<\/li>\n      <\/ul>\n      <p style=\"margin-top:16px; margin-bottom:0;\">At the bottom you switch between the five spaces; at the top you choose within each space. Manifestation only becomes real when you do it \u2014 choose small, choose today, and repeat tomorrow.<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- HOME / UITLEG -->\n  <section class=\"view\" id=\"view-uitleg\">\n    <div class=\"section-label\">The Foundation<\/div>\n    <h2>What is the <em>Law of Attraction?<\/em><\/h2>\n    <p class=\"lead\">Like attracts like. The energy you radiate \u2014 in thoughts, feelings and attention \u2014 returns to you in similar form.<\/p>\n\n    <div class=\"card card-ornate\">\n      <p>Imagine you're a radio transmitter. The frequency you broadcast on \u2014 what you feel, think and believe \u2014 determines which station you tune into. A station full of fear and lack receives news about fear and lack. A station full of trust, gratitude and love receives the opposite.<\/p>\n      <p>Manifestation isn't a wish list to the cosmos. It's the conscious tuning of your <strong style=\"color:var(--gold-soft); font-weight:500;\">inner world<\/strong> so your outer world can follow. You don't attract what you want \u2014 you attract what you <em style=\"color:var(--rose); font-style:italic;\">bent<\/em>.<\/p>\n    <\/div>\n\n    <h3>The three pillars<\/h3>\n    <ul class=\"fancy\">\n      <li><strong style=\"color:var(--cream);\">Asking<\/strong> \u2014 Creating clarity about what you really want (not what you think you should want).<\/li>\n      <li><strong style=\"color:var(--cream);\">Believing<\/strong> \u2014 Feeling, behaving and thinking as if it's already on its way.<\/li>\n      <li><strong style=\"color:var(--cream);\">Receiving<\/strong> \u2014 Releasing the 'how' and acting from inspiration, not from lack.<\/li>\n    <\/ul>\n\n    <div class=\"divider\">\u2726 \u2726 \u2726<\/div>\n\n    <div class=\"section-label\">Going Deeper<\/div>\n    <h2>The Seven <em>Universal Laws<\/em><\/h2>\n    <p>The Law of Attraction doesn't stand alone. Below the seven principles \u2014 tap a law to read more.<\/p>\n\n    <div class=\"law-grid\" id=\"laws\"><\/div>\n\n    <div class=\"divider\">\u2726 \u2726 \u2726<\/div>\n\n    <div class=\"card\">\n      <h3 style=\"margin-top:0;\">An important nuance<\/h3>\n      <p>Manifestation is no replacement for medical help, professional therapy or practical action. See it as an inner <em style=\"color:var(--rose); font-style:italic;\">discipline<\/em> \u2014 a way to change your relationship with yourself and your goals \u2014 alongside, not instead of, everything that already works in your life.<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- HANDLEIDING -->\n  <section class=\"view\" id=\"view-handleiding\">\n    <div class=\"section-label\">Step by Step<\/div>\n    <h2>How to <em>manifest<\/em><\/h2>\n    <p class=\"lead\">A complete seven-step guide. Walk through them in order, or pick the step that feels like what you need now. It doesn't have to be ethereal, complicated or perfect. Mostly it just needs to be done.<\/p>\n\n    <div class=\"card card-ornate\">\n      <h3 style=\"margin-top:0;\">The simple formula<\/h3>\n      <p>Manifesting isn't a trick where you wish once and wait. It's a daily way of thinking, feeling and choosing. You place attention on what you want, practise the feeling as if it's already safe to receive, and take small actions that fit that version of you.<\/p>\n      <ul class=\"fancy\">\n        <li><strong style=\"color:var(--cream);\">Choose clearly<\/strong> \u2014 one longing at a time, as concrete as possible.<\/li>\n        <li><strong style=\"color:var(--cream);\">Feel consciously<\/strong> \u2014 summon the feeling that belongs to your longing.<\/li>\n        <li><strong style=\"color:var(--cream);\">Act small<\/strong> \u2014 take one action today that fits.<\/li>\n        <li><strong style=\"color:var(--cream);\">Repeat<\/strong> \u2014 better five minutes a day than one intense session.<\/li>\n      <\/ul>\n      <p style=\"margin-top:14px; margin-bottom:0;\">If you remember nothing else: <strong style=\"color:var(--gold-soft); font-weight:500;\">think it, feel it, do something that fits.<\/strong><\/p>\n    <\/div>\n\n    <div class=\"steps\">\n      <div class=\"step\">\n        <h4>Be painfully clear<\/h4>\n        <p>Vague longing gives vague results. Write down: <em>what<\/em> do you want exactly, <em>why<\/em> do you want it, and <em>how<\/em> does it feel when you have it? Describe it in present tense, as if it's already here. Not: \"ik wil geen geldzorgen meer.\" Wel: \"ik leef in financi\u00eble rust en heb ruimte om gul te zijn.\"<\/p>\n        <p><strong style=\"color:var(--gold-soft); font-weight:500;\">Example:<\/strong> not \"I want to be happy\", but \"I wake with peace in my body, I have work that gives me energy, and I feel space in my schedule.\"<\/p>\n        <p><strong style=\"color:var(--cream); font-weight:500;\">Do now:<\/strong> write one sentence beginning with: \"I choose to build a life where...\" Make it concrete enough to recognise when it happens.<\/p>\n      <\/div>\n\n      <div class=\"step\">\n        <h4>Feel it \u2014 now<\/h4>\n        <p>Feeling is the magnet, not the thought. Ask yourself: how would I feel if this were true? Proud? Free? Safe? Playful? Summon that feeling <strong style=\"color:var(--cream);\">nu<\/strong> now, even if the situation isn't here yet. This is the core of everything.<\/p>\n        <p><strong style=\"color:var(--gold-soft); font-weight:500;\">Example:<\/strong> want more money? The deeper feeling may be safety, space, or freedom of choice. Practise safety today by calmly looking at your finances for 10 minutes, not by panic-checking everything.<\/p>\n        <p><strong style=\"color:var(--cream); font-weight:500;\">Do now:<\/strong> pick one feeling and set a timer for 60 seconds. Breathe as if that feeling already lives in your body.<\/p>\n      <\/div>\n\n      <div class=\"step\">\n        <h4>Visualise daily<\/h4>\n        <p>Close your eyes, 5 to 10 minutes. See the scene where your longing is fulfilled. What do you smell? Who is there with you? What are you wearing? What do you say to yourself? The more sensory detail, the stronger the signal.<\/p>\n        <p><strong style=\"color:var(--gold-soft); font-weight:500;\">Example:<\/strong> want a new job? Don't just see the contract. See yourself walking in on your first lovely day, hanging up your coat, opening your laptop and thinking: \"this fits.\"<\/p>\n        <p><strong style=\"color:var(--cream); font-weight:500;\">Do now:<\/strong> maak je visualisatie klein genoeg om te geloven. E\u00e9n sc\u00e8ne is genoeg. Repeat dezelfde sc\u00e8ne zeven dagen.<\/p>\n      <\/div>\n\n      <div class=\"step\">\n        <h4>Write as if it happened<\/h4>\n        <p>Grab a notebook. Write one page from your 'already manifested' self. \"Vandaag werd ik wakker in mijn nieuwe huis\u2026\" of \"I still can't believe the job interview went so well.\" Je brein onderscheidt niet sterk tussen levendig voorgesteld en daadwerkelijk meegemaakt.<\/p>\n        <p><strong style=\"color:var(--gold-soft); font-weight:500;\">Example:<\/strong> \"Today I got the message I was hoping for. It didn't feel like coincidence, it felt as if my life was finally working with me. I was calm, not surprised. As if a part of me already knew.\"<\/p>\n        <p><strong style=\"color:var(--cream); font-weight:500;\">Do now:<\/strong> write 10 lines with this opener: \"The most beautiful thing about how this turned out is...\" Stop before you start doubting.<\/p>\n      <\/div>\n\n      <div class=\"step\">\n        <h4>Become the version of you who already has it<\/h4>\n        <p>Which habits, clothes, language, decisions belong to the you already living this longing? Start there today \u2014 small. If she rises early, you do too. If she sets boundaries, you practise too. Identity first, circumstances follow.<\/p>\n        <p><strong style=\"color:var(--gold-soft); font-weight:500;\">Example:<\/strong> someone treated lovingly doesn't run for hours after a half reply. Someone living abundance doesn't talk to themselves all day as if everything is lacking.<\/p>\n        <p><strong style=\"color:var(--cream); font-weight:500;\">Do now:<\/strong> ask yourself: \"What would the version of me who already has this no longer do today?\" Pick one thing and let it go today.<\/p>\n      <\/div>\n\n      <div class=\"step\">\n        <h4>Handel op ingevingen<\/h4>\n        <p>The universe rarely 'delivers' via a postman. It delivers via ideas, meetings, curiosity, opportunities that suddenly appear. Say yes to inspirations pointing in the right direction \u2014 even if you don't see how they connect.<\/p>\n        <p><strong style=\"color:var(--gold-soft); font-weight:500;\">Example:<\/strong> you suddenly think of someone you could email, a course to look at, a place to go, a room to tidy. It doesn't have to be big. Movement opens doors.<\/p>\n        <p><strong style=\"color:var(--cream); font-weight:500;\">Do now:<\/strong> note three small inspirations you had this week. Pick the lightest and do it within 24 hours.<\/p>\n      <\/div>\n\n      <div class=\"step\">\n        <h4>Let go \u2014 but stay present<\/h4>\n        <p>The paradox: you hold the vision <em>and<\/em> you leave the how, when and what-form to something larger. Clinging to control is distrust dressed up as diligence. Letting go doesn't mean stopping \u2014 it means trusting it's already on the way.<\/p>\n        <p><strong style=\"color:var(--gold-soft); font-weight:500;\">Example:<\/strong> you may long for a relationship, but you don't have to decide it must be that one person, this week, through that one message. Hold on to love. Let the route breathe.<\/p>\n        <p><strong style=\"color:var(--cream); font-weight:500;\">Do now:<\/strong> write: \"I release the how. I stay available for the best outcome.\" Read it aloud, then go do something ordinary in your life.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"divider\">\u2726 \u2726 \u2726<\/div>\n\n    <div class=\"card card-ornate\">\n      <h3 style=\"margin-top:0;\">A short daily ritual<\/h3>\n      <p>Don't have time for seven steps every day? Do this minimum:<\/p>\n      <ul class=\"fancy\">\n        <li><strong style=\"color:var(--cream);\">Morning<\/strong> \u2014 2 minutes visualising + one affirmation out loud<\/li>\n        <li><strong style=\"color:var(--cream);\">During the day<\/strong> \u2014 One small action as if you already are it<\/li>\n        <li><strong style=\"color:var(--cream);\">Evening<\/strong> \u2014 Write down three things you're grateful for<\/li>\n      <\/ul>\n      <p style=\"margin-top:14px; margin-bottom:0;\">Five minutes a day. Consistency beats intensity.<\/p>\n    <\/div>\n\n    <div class=\"card\">\n      <h3 style=\"margin-top:0;\">The 7-day do-assignment<\/h3>\n      <p>Don't want to stay stuck in reading? Do this for one week. Simple, concrete, doable.<\/p>\n      <ul class=\"fancy\">\n        <li><strong style=\"color:var(--cream);\">Day 1<\/strong> \u2014 Pick one longing and write it in one clear sentence.<\/li>\n        <li><strong style=\"color:var(--cream);\">Day 2<\/strong> \u2014 Write why you want this and what feeling lies underneath.<\/li>\n        <li><strong style=\"color:var(--cream);\">Day 3<\/strong> \u2014 Visualise one scene for 3 minutes.<\/li>\n        <li><strong style=\"color:var(--cream);\">Day 4<\/strong> \u2014 Do one action that fits the version of you already having this.<\/li>\n        <li><strong style=\"color:var(--cream);\">Day 5<\/strong> \u2014 Rewrite one limiting belief into a helping belief.<\/li>\n        <li><strong style=\"color:var(--cream);\">Day 6<\/strong> \u2014 Practise receiving: accept a compliment, help, or chance without making it smaller.<\/li>\n        <li><strong style=\"color:var(--cream);\">Day 7<\/strong> \u2014 Write three pieces of evidence your life is already moving.<\/li>\n      <\/ul>\n    <\/div>\n  <\/section>\n\n  <!-- OEFENINGEN -->\n  <section class=\"view\" id=\"view-oefeningen\">\n    <div class=\"section-label\">Practice<\/div>\n    <h2>Choose an <em>exercise<\/em><\/h2>\n    <p class=\"lead\">Eleven practical exercises. Each works on a different aspect of manifestation \u2014 pick what you need now and do it.<\/p>\n\n    <div class=\"exercise-pick\" id=\"ex-list\">\n      <button class=\"ex-btn\" data-ex=\"breath\">\n        <span class=\"icon\">\ud83c\udf2c\ufe0f<\/span>\n        <span><span class=\"label\">4-7-8 Breathhaling<\/span><span class=\"meta\">3 min \u2022 for calm & attunement<\/span><\/span>\n      <\/button>\n      <button class=\"ex-btn\" data-ex=\"visual\">\n        <span class=\"icon\">\u2728<\/span>\n        <span><span class=\"label\">Geleide visualisatie<\/span><span class=\"meta\">5 min \u2022 je toekomst voelen<\/span><\/span>\n      <\/button>\n      <button class=\"ex-btn\" data-ex=\"affirm\">\n        <span class=\"icon\">\ud83d\udcab<\/span>\n        <span><span class=\"label\">Affirmatie sessie<\/span><span class=\"meta\">2 min \u2022 nieuwe overtuigingen<\/span><\/span>\n      <\/button>\n      <button class=\"ex-btn\" data-ex=\"grat\">\n        <span class=\"icon\">\ud83c\udf19<\/span>\n        <span><span class=\"label\">Dankbaarheidsstroom<\/span><span class=\"meta\">3 min \u2022 frequentie verhogen<\/span><\/span>\n      <\/button>\n      <button class=\"ex-btn\" data-ex=\"script\">\n        <span class=\"icon\">\ud83e\udeb6<\/span>\n        <span><span class=\"label\">Scripting prompt<\/span><span class=\"meta\">10 min \u2022 schrijven vanuit toekomst<\/span><\/span>\n      <\/button>\n      <button class=\"ex-btn\" data-ex=\"clarity\">\n        <span class=\"icon\">\ud83c\udfaf<\/span>\n        <span><span class=\"label\">Verlangen scherpstellen<\/span><span class=\"meta\">8 min \u2022 knowing what you really want<\/span><\/span>\n      <\/button>\n      <button class=\"ex-btn\" data-ex=\"belief\">\n        <span class=\"icon\">\ud83d\udd01<\/span>\n        <span><span class=\"label\">Overtuiging ombuigen<\/span><span class=\"meta\">7 min \u2022 from blockage to support<\/span><\/span>\n      <\/button>\n      <button class=\"ex-btn\" data-ex=\"identity\">\n        <span class=\"icon\">\ud83e\udded<\/span>\n        <span><span class=\"label\">Identiteitsactie<\/span><span class=\"meta\">5 min \u2022 becoming who already has it<\/span><\/span>\n      <\/button>\n      <button class=\"ex-btn\" data-ex=\"proof\">\n        <span class=\"icon\">\ud83d\udd0e<\/span>\n        <span><span class=\"label\">Kleine bewijs-test<\/span><span class=\"meta\">48 uur \u2022 vertrouwen opbouwen<\/span><\/span>\n      <\/button>\n      <button class=\"ex-btn\" data-ex=\"action\">\n        <span class=\"icon\">\u26a1<\/span>\n        <span><span class=\"label\">Ge\u00efnspireerde actie<\/span><span class=\"meta\">6 min \u2022 \u00e9\u00e9n stap zetten<\/span><\/span>\n      <\/button>\n      <button class=\"ex-btn\" data-ex=\"release\">\n        <span class=\"icon\">\ud83d\udd4a\ufe0f<\/span>\n        <span><span class=\"label\">Loslaat-ritueel<\/span><span class=\"meta\">5 min \u2022 controle ontspannen<\/span><\/span>\n      <\/button>\n    <\/div>\n\n    <div id=\"ex-stage\"><\/div>\n  <\/section>\n\n  <!-- CHALLENGE -->\n  <section class=\"view\" id=\"view-challenge\">\n    <div class=\"section-label\">21 Days<\/div>\n    <h2>Manifestation <em>challenge<\/em><\/h2>\n    <p class=\"lead\">One small task per day. Don't do it perfectly, do keep returning. This challenge makes manifesting concrete, ordinary and doable.<\/p>\n\n    <div class=\"card card-ornate\">\n      <h3 style=\"margin-top:0;\">Your progress<\/h3>\n      <p id=\"challenge-status\">Nothing completed yet.<\/p>\n      <div class=\"progress-track\"><div class=\"progress-bar\" id=\"challenge-bar\"><\/div><\/div>\n      <div class=\"oracle-controls\">\n        <button class=\"btn btn-ghost mini-btn\" id=\"challenge-reset\">Reset challenge<\/button>\n      <\/div>\n    <\/div>\n\n    <div id=\"challenge-list\"><\/div>\n  <\/section>\n\n  <!-- MANIFESTATIEPLAN -->\n  <section class=\"view\" id=\"view-plan\">\n    <div class=\"section-label\">My Plan<\/div>\n    <h2>My <em>manifestation plan<\/em><\/h2>\n    <p class=\"lead\">Make your longing concrete. This plan stays in this browser, so you can return any time.<\/p>\n\n    <div class=\"card card-ornate\">\n      <div class=\"field\">\n        <label for=\"plan-desire\">I'm manifesting<\/label>\n        <textarea id=\"plan-desire\" placeholder=\"For example: a loving relationship, financial peace, work that gives me energy...\"><\/textarea>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"plan-feeling\">I want to feel<\/label>\n        <input id=\"plan-feeling\" type=\"text\" placeholder=\"Free, safe, loved, powerful, calm...\">\n      <\/div>\n      <div class=\"field\">\n        <label for=\"plan-why\">Why this matters<\/label>\n        <textarea id=\"plan-why\" placeholder=\"What changes in you and your life when this is real?\"><\/textarea>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"plan-belief\">New belief<\/label>\n        <textarea id=\"plan-belief\" placeholder=\"I'm practising believing that...\"><\/textarea>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"plan-action\">My action today<\/label>\n        <textarea id=\"plan-action\" placeholder=\"One small concrete step that fits the version of you already having this.\"><\/textarea>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"plan-receive\">How I practise receiving<\/label>\n        <textarea id=\"plan-receive\" placeholder=\"For example: accepting compliments, accepting help, not minimising opportunities.\"><\/textarea>\n      <\/div>\n      <div class=\"oracle-controls\">\n        <button class=\"btn\" id=\"plan-save\">Save plan<\/button>\n        <button class=\"btn btn-ghost\" id=\"plan-example\">Fill example<\/button>\n      <\/div>\n      <p class=\"save-note\" id=\"plan-note\">Saved. Your plan is ready.<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- BEWIJSDAGBOEK -->\n  <section class=\"view\" id=\"view-bewijs\">\n    <div class=\"section-label\">Evidence<\/div>\n    <h2>My <em>evidence journal<\/em><\/h2>\n    <p class=\"lead\">Trust grows when you collect evidence. Note small signs, opportunities, compliments, synchronicities and moments when your life is already moving.<\/p>\n\n    <div class=\"card card-ornate\">\n      <div class=\"field\">\n        <label for=\"proof-text\">What happened?<\/label>\n        <textarea id=\"proof-text\" placeholder=\"For example: I thought of someone and suddenly got a message. Or: I received a compliment exactly on the part I felt insecure about.\"><\/textarea>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"proof-meaning\">What does this mean to me?<\/label>\n        <textarea id=\"proof-meaning\" placeholder=\"What movement, confirmation or lesson do you see in this?\"><\/textarea>\n      <\/div>\n      <button class=\"btn\" id=\"proof-save\">Save evidence<\/button>\n      <p class=\"save-note\" id=\"proof-note\">Saved to your evidence journal.<\/p>\n    <\/div>\n\n    <div id=\"proof-list\"><\/div>\n  <\/section>\n\n  <!-- SOS -->\n  <section class=\"view\" id=\"view-sos\">\n    <div class=\"section-label\">SOS<\/div>\n    <h2>I'm doubting <em>now<\/em><\/h2>\n    <p class=\"lead\">For the moment your head goes loud, trust sinks or you think it won't work. First regulate, then choose again.<\/p>\n\n    <div class=\"card card-ornate\">\n      <div class=\"sos-message\" id=\"sos-message\">You don't have to solve this moment. You only have to come back into your body.<\/div>\n      <div class=\"oracle-controls\">\n        <button class=\"btn\" id=\"sos-new\">New SOS phrase<\/button>\n        <button class=\"btn btn-ghost\" id=\"sos-breath\">Give me 60 seconds<\/button>\n      <\/div>\n      <div class=\"sos-box\" id=\"sos-box\">\n        <h3 style=\"margin-top:0;\">Do this now<\/h3>\n        <ul class=\"fancy\">\n          <li>Place one hand on your chest and one on your belly.<\/li>\n          <li>Breathe in for four counts, out for six. Do this five times.<\/li>\n          <li>Say: \"Doubt is a feeling, not a prediction.\"<\/li>\n          <li>Then choose one small action that fits with trust.<\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <h3 style=\"margin-top:0;\">When you get stuck<\/h3>\n      <p>Stop looking for proof that it isn\\'t working. That is also manifesting, but towards fear. Come back to your breath, to one question: what would I do today if I knew it will be okay?<\/p>\n      <p style=\"margin-bottom:0;\">Do that. Small enough to do today. Real enough to turn your energy.<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- VASTLOPEN -->\n  <section class=\"view\" id=\"view-stuck\">\n    <div class=\"section-label\">Support<\/div>\n    <h2>What do you feel <em>now?<\/em><\/h2>\n    <p class=\"lead\">When manifestation isn't working, it's rarely about technique. It's about the feeling underneath. Select what's familiar \u2014 I'll give you targeted help.<\/p>\n\n    <div class=\"feeling-grid\" id=\"feelings\"><\/div>\n\n    <div class=\"advice-box\" id=\"advice\"><\/div>\n\n    <div class=\"divider\">\u2726 \u2726 \u2726<\/div>\n\n    <h3>Common blockages<\/h3>\n    <div class=\"card\">\n      <h3 style=\"margin-top:0; color:var(--rose);\">\"I've been trying for months, nothing's happening\"<\/h3>\n      <p>You\\'re probably trying from lack. The longing feels like <em style=\"color:var(--gold-soft); font-style:italic;\">\"I don\\'t have this yet\"<\/em> in plaats van <em style=\"color:var(--gold-soft); font-style:italic;\">\"this is coming to me.\"<\/em> The difference is subtle but essential. Stop manifesting for a week and focus only on gratitude for what\\'s already here.<\/p>\n    <\/div>\n\n    <div class=\"card\">\n      <h3 style=\"margin-top:0; color:var(--rose);\">\"I don't really believe in it anymore\"<\/h3>\n      <p>Good that you acknowledge that. Don\\'t force belief \u2014 that creates division. Start smaller: manifest something unimportant (a free coffee, an unexpected message, a green wave in traffic). Evidence to yourself that it works at a small scale. Trust grows, it\\'s rarely jumped to.<\/p>\n    <\/div>\n\n    <div class=\"card\">\n      <h3 style=\"margin-top:0; color:var(--rose);\">\"I don't know what I want\"<\/h3>\n      <p>Then <em>that<\/em> is your work. Not manifesting \u2014 discovering. Write three minutes every morning about: what feels like 'yes' in my life? What feels like 'no'? Longing often gets drowned out by what you <em>denkt<\/em> having to want. Silence restores the signal.<\/p>\n    <\/div>\n\n    <div class=\"card\">\n      <h3 style=\"margin-top:0; color:var(--rose);\">\"I get frustrated it's taking so long\"<\/h3>\n      <p>Frustration is a broadcast on the frequency 'it isn\\'t here.' So you receive 'it isn\\'t here' back. This isn\\'t to punish yourself \u2014 it\\'s to recognise that impatience itself is a blockage. A good question: what would I do today if I <em style=\"color:var(--rose); font-style:italic;\">zeker wist<\/em> that it\\'ll arrive in two weeks?<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- INSPIRATIE -->\n  <section class=\"view\" id=\"view-inspire\">\n    <div class=\"section-label\">A Spark<\/div>\n    <h2>For when it <em>stalls<\/em><\/h2>\n    <p class=\"lead\">Sometimes you don't need long explanation. Just a sentence that brings you back. Tap the button for a new one.<\/p>\n\n    <div class=\"card card-ornate\">\n      <div class=\"spark\">\n        <div class=\"spark-text\" id=\"spark\">The universe isn't a vending machine. It's a mirror.<\/div>\n        <div class=\"spark-source\" id=\"spark-src\">\u2014 Manifestatiegids<\/div>\n        <button class=\"btn\" id=\"spark-btn\">New spark<\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"divider\">\u2726 \u2726 \u2726<\/div>\n\n    <h3>Writing prompts when you have no idea what to manifest<\/h3>\n    <div class=\"card\">\n      <ul class=\"fancy\">\n        <li>If I knew I couldn't fail, this year I would\u2026<\/li>\n        <li>The version of me I already am deep down would\u2026<\/li>\n        <li>What would happen if I let myself want what I really want?<\/li>\n        <li>What would a calm, fulfilled version of me do differently today?<\/li>\n        <li>Which three words do I want my life to radiate in a year?<\/li>\n        <li>What do I actually already have that I haven't yet acknowledged as 'manifested'?<\/li>\n      <\/ul>\n    <\/div>\n\n    <div class=\"card card-ornate\">\n      <h3 style=\"margin-top:0;\">The very last advice<\/h3>\n      <p>When everything stalls: <em style=\"color:var(--gold-soft); font-style:italic;\">live your life.<\/em> The energy you attract doesn't come from how hard you manifest. It comes from how full, present and alive you are <strong style=\"color:var(--cream);\">while<\/strong> you wait. A full life is a magnet. A fixated life is a waiting room.<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- MAAN -->\n  <section class=\"view\" id=\"view-moon\">\n    <div class=\"section-label\">Celestial Rhythm<\/div>\n    <h2>The <em>Moon<\/em> Today<\/h2>\n    <p class=\"lead\">The moon influences water \u2014 and you're 60% water. Each phase has its own energy. Attune to the rhythm of the sky.<\/p>\n\n    <div class=\"card card-ornate\">\n      <div class=\"moon-hero\">\n        <div class=\"moon-visual\">\n          <div class=\"moon-craters\"><\/div>\n          <div class=\"moon-shadow\" id=\"moon-shadow\"><\/div>\n        <\/div>\n        <div class=\"moon-phase-name\" id=\"moon-name\">\u2014<\/div>\n        <div class=\"moon-illum\" id=\"moon-illum\">\u2014<\/div>\n        <div class=\"moon-date\" id=\"moon-date\">\u2014<\/div>\n      <\/div>\n\n      <div class=\"moon-cycle\" id=\"moon-cycle\"><\/div>\n\n      <h3 style=\"margin-top:24px;\" id=\"moon-intent-title\">Today's intention<\/h3>\n      <p id=\"moon-intent\">\u2014<\/p>\n\n      <div style=\"background:rgba(251,191,36,0.08); border-left:3px solid var(--gold); padding:14px 18px; border-radius:8px; margin-top:18px;\">\n        <div style=\"font-size:11px; letter-spacing:0.2em; color:var(--gold); text-transform:uppercase; margin-bottom:6px;\">Manifestation ritual<\/div>\n        <div style=\"font-family:var(--serif); font-size:17px; color:var(--cream); font-style:italic;\" id=\"moon-ritual\">\u2014<\/div>\n      <\/div>\n\n      <div style=\"margin-top:16px; font-size:14px; color:var(--text-dim);\" id=\"moon-next\">\u2014<\/div>\n    <\/div>\n\n    <div class=\"divider\">\u2726 \u2726 \u2726<\/div>\n\n    <h3>Why the moon?<\/h3>\n    <div class=\"card\">\n      <p>For centuries people have attuned their rhythms to the moon \u2014 for sowing crops, for rituals, for reflection. Science recognises the effect on tides. Esoteric traditions see the moon as a mirror of the inner: <em style=\"color:var(--rose); font-style:italic;\">as she waxes and wanes, so do we.<\/em><\/p>\n      <p>Werken m\u00e9t de maanfasen geeft je manifestatie een natuurlijk ritme. Niet alles is altijd een tijd om te scheppen \u2014 soms is het tijd om los te laten, soms om te wachten. De maan herinnert je daaraan.<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- ORAKEL -->\n  <section class=\"view\" id=\"view-oracle\">\n    <div class=\"section-label\">Ask the Universe<\/div>\n    <h2>The <em>Oracle<\/em><\/h2>\n    <p class=\"lead\">Hold a question in mind. Shuffle the cards. Tap one to go deeper. It's not a prediction \u2014 it's a mirror showing you something you already know.<\/p>\n\n    <div class=\"card card-ornate\">\n      <p class=\"oracle-instr\" id=\"oracle-instr\">Briefly close your eyes. Breathe in. Pose your question.<\/p>\n\n      <div class=\"oracle-deck\" id=\"oracle-deck\"><\/div>\n\n      <div class=\"oracle-reveal\" id=\"oracle-reveal\"><\/div>\n\n      <div class=\"oracle-controls\">\n        <button class=\"btn\" id=\"oracle-shuffle\">Shuffle again<\/button>\n        <button class=\"btn btn-ghost\" id=\"oracle-draw\">Draw 3 cards<\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"divider\">\u2726 \u2726 \u2726<\/div>\n\n    <h3>How to use the oracle well<\/h3>\n    <div class=\"card\">\n      <ul class=\"fancy\">\n        <li>Ask an open question \u2014 not \"will I get X?\" but \"what should I know about X?\"<\/li>\n        <li>Don't draw five times in one day. One reading per question.<\/li>\n        <li>Read the card literally <em>and<\/em> symbolically. What stood out?<\/li>\n        <li>Write down what you felt when you saw the message \u2014 that's where the answer is.<\/li>\n      <\/ul>\n    <\/div>\n  <\/section>\n\n<\/main>\n\n<button class=\"sos-fab\" id=\"sos-fab\" type=\"button\">SOS<\/button>\n\n<nav class=\"bottom\">\n  <div class=\"nav-inner\">\n    <button class=\"nav-btn active\" data-view=\"welcome\"><span class=\"ico\">\ud83e\ude9e<\/span>Today<\/button>\n    <button class=\"nav-btn\" data-view=\"uitleg\"><span class=\"ico\">\ud83d\udcd6<\/span>Learn<\/button>\n    <button class=\"nav-btn\" data-view=\"handleiding\"><span class=\"ico\">\ud83d\udddd\ufe0f<\/span>How<\/button>\n    <button class=\"nav-btn\" data-view=\"oefeningen\"><span class=\"ico\">\ud83c\udf2c\ufe0f<\/span>Practise<\/button>\n    <button class=\"nav-btn\" data-view=\"challenge\"><span class=\"ico\">\ud83d\udd25<\/span>21 days<\/button>\n    <button class=\"nav-btn\" data-view=\"plan\"><span class=\"ico\">\ud83d\udcdd<\/span>Plan<\/button>\n    <button class=\"nav-btn\" data-view=\"bewijs\"><span class=\"ico\">\ud83d\udd0e<\/span>Evidence<\/button>\n    <button class=\"nav-btn\" data-view=\"moon\"><span class=\"ico\">\ud83c\udf19<\/span>Moon<\/button>\n    <button class=\"nav-btn\" data-view=\"oracle\"><span class=\"ico\">\ud83d\udd2e<\/span>Oracle<\/button>\n    <button class=\"nav-btn\" data-view=\"stuck\"><span class=\"ico\">\ud83c\udf0a<\/span>Help<\/button>\n    <button class=\"nav-btn\" data-view=\"inspire\"><span class=\"ico\">\u2728<\/span>Spark<\/button>\n  <\/div>\n<\/nav>\n\n<script>\n  // ===== Sterren =====\n  (function makeStars(){\n    const c = document.getElementById('stars');\n    const n = window.innerWidth < 600 ? 40 : 70;\n    for(let i=0;i<n;i++){\n      const s = document.createElement('div');\n      s.className = 'star';\n      s.style.left = Math.random()*100 + '%';\n      s.style.top = Math.random()*100 + '%';\n      s.style.animationDelay = Math.random()*3 + 's';\n      s.style.opacity = (Math.random()*0.7+0.2).toFixed(2);\n      const size = Math.random()*2 + 1;\n      s.style.width = size + 'px';\n      s.style.height = size + 'px';\n      c.appendChild(s);\n    }\n  })();\n\n  // ===== Navigatie =====\n  function switchView(view, activeButton) {\n    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));\n    if(activeButton) activeButton.classList.add('active');\n    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));\n    const target = document.getElementById('view-' + view);\n    if(target) target.classList.add('active');\n    window.scrollTo({top:0, behavior:'smooth'});\n  }\n\n  document.querySelectorAll('.nav-btn').forEach(btn => {\n    btn.addEventListener('click', () => {\n      switchView(btn.dataset.view, btn);\n    });\n  });\n\n  document.getElementById('sos-fab').addEventListener('click', () => {\n    switchView('sos');\n  });\n\n  // externe aansturing vanuit de Maanlicht-schil\n  window.addEventListener('message', function(e){\n    if(e.data && e.data.__maanlicht && e.data.view){\n      try{ switchView(e.data.view); }catch(err){}\n    }\n  });\n\n\n  // ===== Kleine opslaghelpers =====\n  function readStore(key, fallback) {\n    try {\n      const raw = localStorage.getItem(key);\n      return raw ? JSON.parse(raw) : fallback;\n    } catch(e) {\n      return fallback;\n    }\n  }\n\n  function writeStore(key, value) {\n    try {\n      localStorage.setItem(key, JSON.stringify(value));\n      return true;\n    } catch(e) {\n      return false;\n    }\n  }\n\n  // ===== 21-dagen challenge =====\n  const challengeDays = [\n    {title:'Kies \u00e9\u00e9n verlangen', task:'Write one clear longing. Not five at once. One. Make it concrete enough to recognise.'},\n    {title:'Find the feeling underneath', task:'Schrijf welk gevoel je eigenlijk zoekt: vrijheid, veiligheid, liefde, rust, trots, plezier of overvloed.'},\n    {title:'Maak je zin', task:'Write your manifestation sentence in present tense: \"I live in...\", \"I receive...\", \"I am available for...\".'},\n    {title:'Visualiseer \u00e9\u00e9n sc\u00e8ne', task:'Close your eyes for three minutes and see one small moment where it\\'s already true. Make it simple and repeatable.'},\n    {title:'Schrijf uit de toekomst', task:'Write ten lines as if it\\'s already happened. Begin with: \"The most beautiful thing is that...\".'},\n    {title:'Bend one belief', task:'Write an old thought and turn it into a practice sentence. Not perfectly positive, but believable.'},\n    {title:'Do one identity action', task:'Today do something that fits the version of you who already has this. Small, visible, real.'},\n    {title:'Oefen ontvangen', task:'Accept a compliment, help, invitation or chance without minimising it.'},\n    {title:'Verzamel bewijs', task:'Write three things showing your life is already moving, however small.'},\n    {title:'Release the how', task:'Write: \"I release the how.\" Then do something ordinary and get out of your head.'},\n    {title:'Maak ruimte', task:'Tidy one spot that symbolises making room: bag, closet, desk, inbox or schedule.'},\n    {title:'Spreek anders tegen jezelf', task:'Let vandaag op \u00e9\u00e9n zin die je vaak tegen jezelf zegt. Maak hem zachter en ruimer.'},\n    {title:'Choose an inspired action', task:'Make a list of five small actions. Do the lightest within 24 hours.'},\n    {title:'Make it playful', task:'Ask for a small sign within 48 hours. Pick something unimportant and don\\'t go searching.'},\n    {title:'Gratitude as evidence', task:'Write five things that used to be wishes and have become normal.'},\n    {title:'Stop \u00e9\u00e9n gebrekspatroon', task:'Merk \u00e9\u00e9n moment op waarop je vanuit tekort handelt. Pauzeer, adem, kies opnieuw.'},\n    {title:'Zeg \u00e9\u00e9n duidelijke nee', task:'Bescherm je energie met \u00e9\u00e9n kleine grens. Manifestatie heeft ruimte nodig.'},\n    {title:'Zeg \u00e9\u00e9n duidelijke ja', task:'Say yes to something that feels light, exciting or true.'},\n    {title:'Vier mini-resultaat', task:'Celebrate something small that went well. Your system needs to learn that receiving is safe and normal.'},\n    {title:'Herlees je plan', task:'Read your manifestation plan again and adjust one sentence so it feels even truer.'},\n    {title:'Sluit af en kies door', task:'Write what you\\'ve learned, what you\\'ll keep doing, and which one action continues tomorrow.'}\n  ];\n\n  function getChallengeDone() {\n    return readStore('manifestatie.challenge.done', []);\n  }\n\n  function renderChallenge() {\n    const list = document.getElementById('challenge-list');\n    const done = getChallengeDone();\n    const doneSet = new Set(done);\n    const pct = Math.round((done.length / challengeDays.length) * 100);\n    document.getElementById('challenge-status').textContent = `${done.length} van ${challengeDays.length} dagen afgerond. ${pct}% compleet.`;\n    document.getElementById('challenge-bar').style.width = pct + '%';\n    list.innerHTML = challengeDays.map((day, i) => {\n      const dayNo = i + 1;\n      const isDone = doneSet.has(dayNo);\n      return `\n        <div class=\"challenge-day${isDone ? ' done' : ''}\">\n          <div class=\"day-num\">Dag ${dayNo}<\/div>\n          <h4>${day.title}<\/h4>\n          <p>${day.task}<\/p>\n          <button class=\"btn ${isDone ? 'btn-ghost' : ''} mini-btn challenge-toggle\" data-day=\"${dayNo}\">\n            ${isDone ? 'Gedaan' : 'Mark done'}\n          <\/button>\n        <\/div>`;\n    }).join('');\n  }\n\n  document.getElementById('challenge-list').addEventListener('click', e => {\n    const btn = e.target.closest('.challenge-toggle');\n    if(!btn) return;\n    const day = Number(btn.dataset.day);\n    const done = getChallengeDone();\n    const next = done.includes(day) ? done.filter(d => d !== day) : [...done, day].sort((a,b) => a-b);\n    writeStore('manifestatie.challenge.done', next);\n    renderChallenge();\n  });\n\n  document.getElementById('challenge-reset').addEventListener('click', () => {\n    if(!confirm('Reset the challenge progress?')) return;\n    writeStore('manifestatie.challenge.done', []);\n    renderChallenge();\n  });\n\n  renderChallenge();\n\n  // ===== Manifestatieplan =====\n  const planFields = ['desire','feeling','why','belief','action','receive'];\n  function loadPlan() {\n    const plan = readStore('manifestatie.plan', {});\n    planFields.forEach(name => {\n      const el = document.getElementById('plan-' + name);\n      if(el) el.value = plan[name] || '';\n    });\n  }\n\n  function savePlan() {\n    const plan = {};\n    planFields.forEach(name => {\n      const el = document.getElementById('plan-' + name);\n      plan[name] = el ? el.value.trim() : '';\n    });\n    writeStore('manifestatie.plan', plan);\n    const note = document.getElementById('plan-note');\n    note.classList.add('show');\n    setTimeout(() => note.classList.remove('show'), 2200);\n  }\n\n  document.getElementById('plan-save').addEventListener('click', savePlan);\n  document.getElementById('plan-example').addEventListener('click', () => {\n    const example = {\n      desire: 'Ik manifesteer financi\u00eble rust en werk dat mij energie geeft.',\n      feeling: 'Rustig, vrij, zeker en ruim.',\n      why: 'Ik wil mijn leven kunnen kiezen vanuit vertrouwen in plaats van stress.',\n      belief: 'I practise believing that money, chances and support may come to me in multiple ways.',\n      action: 'Today I update my overview and send one message that could open a new opportunity.',\n      receive: 'Ik neem hulp en complimenten aan zonder ze kleiner te maken.'\n    };\n    planFields.forEach(name => document.getElementById('plan-' + name).value = example[name]);\n    savePlan();\n  });\n  loadPlan();\n\n  // ===== Bewijzendagboek =====\n  function getProofEntries() {\n    return readStore('manifestatie.proof.entries', []);\n  }\n\n  function renderProofEntries() {\n    const entries = getProofEntries();\n    const list = document.getElementById('proof-list');\n    if(entries.length === 0) {\n      list.innerHTML = '<div class=\"empty-state\">No evidence saved yet. Start small: a compliment, an inspiration, a coincidental message, an opportunity that stood out.<\/div>';\n      return;\n    }\n    list.innerHTML = entries.map(entry => `\n      <div class=\"journal-entry\">\n        <div class=\"date\">${entry.date}<\/div>\n        <div class=\"text\">${escapeHtml(entry.text)}<\/div>\n        ${entry.meaning ? `<div class=\"text\"><strong style=\"color:var(--gold-soft); font-weight:500;\">Meaning:<\/strong> ${escapeHtml(entry.meaning)}<\/div>` : ''}\n        <button class=\"btn btn-ghost mini-btn proof-delete\" data-id=\"${entry.id}\">Delete<\/button>\n      <\/div>\n    `).join('');\n  }\n\n  function escapeHtml(value) {\n    return String(value)\n      .replaceAll('&', '&amp;')\n      .replaceAll('<', '&lt;')\n      .replaceAll('>', '&gt;')\n      .replaceAll('\"', '&quot;')\n      .replaceAll(\"'\", '&#039;');\n  }\n\n  document.getElementById('proof-save').addEventListener('click', () => {\n    const textEl = document.getElementById('proof-text');\n    const meaningEl = document.getElementById('proof-meaning');\n    const text = textEl.value.trim();\n    const meaning = meaningEl.value.trim();\n    if(!text) {\n      textEl.focus();\n      return;\n    }\n    const entries = getProofEntries();\n    entries.unshift({\n      id: Date.now().toString(36),\n      date: new Date().toLocaleDateString('nl-NL', { day:'numeric', month:'long', year:'numeric' }),\n      text,\n      meaning\n    });\n    writeStore('manifestatie.proof.entries', entries);\n    textEl.value = '';\n    meaningEl.value = '';\n    renderProofEntries();\n    const note = document.getElementById('proof-note');\n    note.classList.add('show');\n    setTimeout(() => note.classList.remove('show'), 2200);\n  });\n\n  document.getElementById('proof-list').addEventListener('click', e => {\n    const btn = e.target.closest('.proof-delete');\n    if(!btn) return;\n    const entries = getProofEntries().filter(entry => entry.id !== btn.dataset.id);\n    writeStore('manifestatie.proof.entries', entries);\n    renderProofEntries();\n  });\n\n  renderProofEntries();\n\n  // ===== SOS =====\n  const sosMessages = [\n    'Doubt is a feeling, not a prediction.',\n    'You don\\'t need to see the end result today to choose well today.',\n    'Return to your breath. Your body is the gateway to trust.',\n    'Don\\'t check, don\\'t pull, don\\'t force. One calm action is enough.',\n    'You may long without proving you deserve it.',\n    'It hasn\\'t failed because you\\'re afraid. You\\'re only human.',\n    'Make it smaller: what would trust do for the next ten minutes?',\n    'Letting go doesn\\'t mean giving up. It means letting go of the squeeze.'\n  ];\n  let sosIndex = 0;\n  let sosTimer = null;\n\n  function newSosMessage() {\n    sosIndex = (sosIndex + 1) % sosMessages.length;\n    document.getElementById('sos-message').textContent = sosMessages[sosIndex];\n  }\n\n  document.getElementById('sos-new').addEventListener('click', newSosMessage);\n\n  document.getElementById('sos-breath').addEventListener('click', () => {\n    if(sosTimer) clearInterval(sosTimer);\n    let seconds = 60;\n    const box = document.getElementById('sos-box');\n    box.innerHTML = `\n      <h3 style=\"margin-top:0;\">60 seconds to return<\/h3>\n      <p style=\"margin-bottom:10px;\">Breathe in calmly through your nose and longer out through your mouth.<\/p>\n      <div class=\"sos-message\" id=\"sos-count\">60<\/div>\n      <p style=\"margin-bottom:0;\">Say with each exhale: \"I am here. This moment is safe enough.\"<\/p>`;\n    const count = document.getElementById('sos-count');\n    sosTimer = setInterval(() => {\n      seconds--;\n      count.textContent = seconds;\n      if(seconds <= 0) {\n        clearInterval(sosTimer);\n        sosTimer = null;\n        box.innerHTML = `\n          <h3 style=\"margin-top:0;\">Done<\/h3>\n          <p>Now one question: what's the smallest action that fits trust?<\/p>\n          <p style=\"margin-bottom:0; font-family:var(--serif); font-style:italic; color:var(--gold-soft);\">Do that. No more, no less.<\/p>`;\n      }\n    }, 1000);\n  });\n\n  // ===== De zeven wetten =====\n  const laws = [\n    {num:'Een', name:'Law of Mentalism', desc:'All is mind. The universe is mental in nature.', full:'What you consistently think and believe shapes your reality. Your world isn\\'t fixed \u2014 it\\'s an expression of consciousness. Change your mind, change your reality.'},\n    {num:'Twee', name:'Law of Correspondence', desc:'As above, so below. As within, so without.', full:'What plays out in your inner world is mirrored in your outer. Your relationships, money, work \u2014 they\\'re mirrors of your inner state. Change within, and the outside follows.'},\n    {num:'Drie', name:'Law of Vibration', desc:'Everything vibrates. Nothing stands still.', full:'Every thought, feeling, object vibrates at a frequency. Higher frequencies (love, joy, trust) attract higher experiences. Lower frequencies (fear, shame) attract what matches. You can consciously change your vibration.'},\n    {num:'Vier', name:'Law of Polarity', desc:'Everything is dual. Opposites are degrees of the same.', full:'Hot and cold are the same temperature at different points. Love and hate are the same emotion at different extremes. You can bend any negative feeling towards its opposite through conscious attention and focus.'},\n    {num:'Vijf', name:'Law of Rhythm', desc:'Everything flows, ebbs and rises.', full:'Life has seasons \u2014 not everything is always spring. Bad periods aren\\'t permanent and good ones aren\\'t either. Understanding rhythm gives you patience in valleys and modesty in peaks. Work <em>with<\/em> your rhythm, not against.'},\n    {num:'Zes', name:'Law of Cause and Effect', desc:'Every cause has an effect, every effect a cause.', full:'There\\'s no chance \u2014 only laws we don\\'t yet see. Your current life is the effect of past choices and broadcasts. Your future life is the cause you lay now. Nothing is random.'},\n    {num:'Zeven', name:'Law of Gender', desc:'Everything has masculine and feminine principles.', full:'Manifestation needs both: the masculine (action, intention, movement) and the feminine (receptivity, trust, release). Pushing too much blocks. Waiting too much also. Balance between creating and allowing is everything.'}\n  ];\n  const lawsContainer = document.getElementById('laws');\n  laws.forEach((l,i) => {\n    const card = document.createElement('div');\n    card.className = 'law-card';\n    card.innerHTML = `<div class=\"num\">Wet ${l.num}<\/div><div class=\"name\">${l.name}<\/div><div class=\"desc\">${l.desc}<\/div><div class=\"full\">${l.full}<\/div>`;\n    card.addEventListener('click', () => card.classList.toggle('open'));\n    lawsContainer.appendChild(card);\n  });\n\n  // ===== Exercises =====\n  const exStage = document.getElementById('ex-stage');\n  document.querySelectorAll('.ex-btn').forEach(b => {\n    b.addEventListener('click', () => startExercise(b.dataset.ex));\n  });\n\n  function startExercise(type) {\n    if(type === 'breath') startBreath();\n    else if(type === 'visual') startVisual();\n    else if(type === 'affirm') startAffirm();\n    else if(type === 'grat') startGrat();\n    else if(type === 'script') startScript();\n    else if(type === 'clarity') startClarity();\n    else if(type === 'belief') startBelief();\n    else if(type === 'identity') startIdentity();\n    else if(type === 'proof') startProof();\n    else if(type === 'action') startAction();\n    else if(type === 'release') startRelease();\n    exStage.scrollIntoView({behavior:'smooth', block:'start'});\n  }\n\n  // --- Breathhaling ---\n  let breathTimer = null;\n  function startBreath() {\n    stopAll();\n    exStage.innerHTML = `\n      <div class=\"card card-ornate\">\n        <div class=\"breath-stage\">\n          <h3 style=\"margin-top:0;\">4 \u2014 7 \u2014 8 Breathhaling<\/h3
