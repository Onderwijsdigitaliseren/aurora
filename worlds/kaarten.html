<style>
  :root{
    --deep:#0f0520;--night:#1a0b2e;--violet:#2d1b4e;--plum:#4a2670;
    --orchid:#7c3aed;--rose:#c084fc;--gold:#fbbf24;--gold-soft:#fde68a;--gold-deep:#d97706;
    --green:#6ee7b7;--line:rgba(255,255,255,.10);--mist:rgba(255,255,255,.06);--mist-strong:rgba(255,255,255,.12);
    --text:#f5e6ff;--text-soft:#d4c5e8;--text-dim:#9b89b8;
    --serif:'Cormorant Garamond',Georgia,serif;--sans:'Outfit',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--deep);color:var(--text);font-family:var(--sans);font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased;}
  body{background:radial-gradient(ellipse at 20% 0%,rgba(124,58,237,.28) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(251,191,36,.12) 0%,transparent 50%),linear-gradient(180deg,var(--deep),var(--night) 50%,var(--deep));background-attachment:fixed;min-height:100vh;padding:30px 0 60px;}
  .wrap{max-width:640px;margin:0 auto;padding:0 18px;}
  h1{font-family:var(--serif);font-weight:500;font-size:34px;text-align:center;margin-bottom:6px;}
  h1 em{font-style:italic;color:var(--gold-soft);}
  .lead{text-align:center;color:var(--text-dim);font-size:14px;margin-bottom:26px;}

  /* deck-keuze */
  .deck-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
  .deck-btn{
    text-align:left;background:linear-gradient(160deg,var(--mist-strong),var(--mist));border:1px solid var(--line);
    border-radius:18px;padding:16px;cursor:pointer;transition:transform .2s,border-color .2s;
  }
  .deck-btn:hover,.deck-btn.active{transform:translateY(-2px);border-color:var(--rose);}
  .deck-btn .dn{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:18px;font-weight:500;margin-bottom:3px;}
  .deck-btn .dot{width:9px;height:9px;border-radius:50%;}
  .deck-btn .ds{font-size:12px;color:var(--text-dim);line-height:1.4;}
  .deck-btn .dc{font-size:11px;color:var(--text-dim);margin-top:6px;opacity:.7;}

  /* kaart */
  .stage{display:flex;flex-direction:column;align-items:center;margin:6px 0;}
  .card{width:250px;height:370px;cursor:pointer;perspective:1300px;margin-bottom:18px;}
  .card-inner{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;}
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;border:1px solid var(--line);box-shadow:0 16px 44px rgba(0,0,0,.45);}
  .face-back{background:linear-gradient(160deg,var(--plum),var(--violet));background-image:radial-gradient(circle at 50% 30%,rgba(251,191,36,.16),transparent 60%);}
  .face-back .glyph{font-size:44px;color:var(--gold);text-shadow:0 0 24px rgba(251,191,36,.6);margin-bottom:14px;animation:breathe 4s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
  .face-back .tap{font-size:13px;color:var(--text-dim);letter-spacing:1px;}
  .orn{position:absolute;inset:13px;border:1px solid rgba(251,191,36,.25);border-radius:17px;pointer-events:none;}
  .face-front{transform:rotateY(180deg);background:linear-gradient(160deg,var(--night),var(--violet));background-image:radial-gradient(circle at 50% 18%,rgba(192,132,252,.18),transparent 60%);overflow-y:auto;}
  .face-front .csym{font-size:34px;margin-bottom:10px;}
  .face-front .cname{font-family:var(--serif);font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;}
  .face-front .cmsg{font-family:var(--serif);font-size:20px;line-height:1.4;color:var(--text);margin-bottom:12px;}
  .face-front .cexpl{font-size:13px;color:var(--text-soft);line-height:1.55;margin-bottom:10px;}
  .face-front .cdoing{font-size:13px;color:var(--gold-soft);font-style:italic;}
  .face-front .cby{font-size:12px;color:var(--text-dim);margin-top:8px;}
  .face-front .orn{border-color:rgba(192,132,252,.3);}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#2a1a05;border:none;border-radius:100px;padding:13px 26px;font-family:var(--sans);font-weight:600;font-size:15px;cursor:pointer;transition:transform .15s;box-shadow:0 6px 20px rgba(251,191,36,.3);}
  .btn:active{transform:scale(.97);}

  .insight{background:linear-gradient(160deg,rgba(110,231,183,.12),var(--mist));border:1px solid rgba(110,231,183,.3);border-radius:18px;padding:18px;margin-top:20px;animation:fade .5s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .insight .tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-bottom:8px;}
  .insight p{font-size:15px;color:var(--text-soft);line-height:1.6;}
  .insight .pat{font-family:var(--serif);font-style:italic;color:var(--gold-soft);}
  .divlabel{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);text-align:center;margin:26px 0 12px;}
  .hist{font-size:13.5px;}
  .hrow{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);}
  .hrow .hd{font-size:11.5px;color:var(--text-dim);white-space:nowrap;}
  .hrow .hc{color:var(--gold-soft);font-family:var(--serif);font-size:16px;}
  .hrow .hk{margin-left:auto;font-size:11px;color:var(--text-dim);}
</style>
</head>
<body>
<script>window.__WORLD_PREFIX__='kaarten';</script>
<script src="js/bridge.js"></script>

<div class="wrap">
  <h1>The <em>Cards</em></h1>
  <p class="lead">Choose a deck that fits where you are now. Breathe in, and draw.</p>

  <div class="deck-row" id="deck-row"></div>

  <div class="stage">
    <div class="card" id="card" onclick="flipCard()">
      <div class="card-inner">
        <div class="face face-back"><div class="orn"></div><div class="glyph">✦</div><div class="tap">Tap to draw</div></div>
        <div class="face face-front"><div class="orn"></div>
          <div class="csym" id="c-sym"></div>
          <div class="cname" id="c-name"></div>
          <div class="cmsg" id="c-msg"></div>
          <div class="cexpl" id="c-expl"></div>
          <div class="cdoing" id="c-doing"></div>
          <div class="cby" id="c-by"></div>
        </div>
      </div>
    </div>
    <button class="btn" id="draw-btn" onclick="drawCard()">Draw a card</button>
  </div>

  <div id="insight"></div>
  <div class="divlabel" id="hist-label" style="display:none">What you drew</div>
  <div class="hist" id="hist"></div>
</div>

<script>const DECKS = [{"id": "dag", "naam": "Daily card", "sub": "A line to colour your day with", "kleur": "#fbbf24", "type": "quote", "cards": [{"msg": "You don't attract what you want. You attract what you are.", "by": "Unknown"}, {"msg": "Thoughts become things. Choose the beautiful ones.", "by": "Mike Dooley"}, {"msg": "The universal law is: be, do, have. Not: do, have, be.", "by": "Manifestation Guide"}, {"msg": "It's done from the moment you truly feel it.", "by": "Neville Goddard"}, {"msg": "Nothing in nature blooms all year. Don't expect that of yourself.", "by": "Unknown"}, {"msg": "What is meant for you won't miss you.", "by": "Unknown"}, {"msg": "Be grateful for what you have. You'll receive more in the end.", "by": "Oprah Winfrey"}, {"msg": "Imagination is the workshop of the universe.", "by": "Albert Einstein"}, {"msg": "Trust is courage in silence.", "by": "Manifestation Guide"}, {"msg": "You don't have to know how. You only have to say yes when it comes.", "by": "Manifestation Guide"}, {"msg": "The how isn't your work. The why is.", "by": "Manifestation Guide"}, {"msg": "Waiting without living is a prison. Living without waiting is a miracle.", "by": "Manifestation Guide"}, {"msg": "Letting go isn't stopping. It's letting go of the squeeze.", "by": "Manifestation Guide"}, {"msg": "Frequency changes. Circumstances follow.", "by": "Manifestation Guide"}, {"msg": "The outer world is the echo of your inner world.", "by": "Unknown"}, {"msg": "Your future is listening. Speak softly and beautifully.", "by": "Manifestation Guide"}, {"msg": "Manifestation isn't a wish. It's a state.", "by": "Manifestation Guide"}, {"msg": "You're manifesting right now too. Ask yourself: what am I broadcasting?", "by": "Manifestation Guide"}, {"msg": "The universe doesn't respond to what you ask. It responds to who you are.", "by": "Unknown"}, {"msg": "Happiness isn't a place to arrive. It's a way of travelling.", "by": "Margaret Lee Runbeck"}, {"msg": "You aren't a drop in the ocean. You are the whole ocean in a drop.", "by": "Rumi"}, {"msg": "When you change how you look at things, the things you look at change.", "by": "Wayne Dyer"}, {"msg": "What you resist, persists. What you embrace, transforms.", "by": "Carl Jung"}, {"msg": "Don't give the universe a wish. Give it a feeling.", "by": "Manifestation Guide"}, {"msg": "Your dreams know the way. Walk with them, not ahead of them.", "by": "Manifestation Guide"}, {"msg": "What you radiate today, you'll meet tomorrow.", "by": "Manifestation Guide"}, {"msg": "The most beautiful things often manifest in ways you could never have planned.", "by": "Manifestation Guide"}, {"msg": "Trust the rhythm. Not everything is always spring.", "by": "Manifestation Guide"}, {"msg": "The universe isn't in a hurry. You are. That's the difference.", "by": "Manifestation Guide"}, {"msg": "How you talk about yourself is a spell. Be careful with your words.", "by": "Unknown"}, {"msg": "You don't change the world by pulling at it. You change it by shining into it.", "by": "Manifestation Guide"}, {"msg": "Not everything that grows slowly grows wrong.", "by": "Manifestation Guide"}, {"msg": "Pretend — not to lie, but to remind yourself who you already are.", "by": "Manifestation Guide"}, {"msg": "What you truly want, wants you too.", "by": "Unknown"}, {"msg": "A content heart is the strongest magnet.", "by": "Manifestation Guide"}, {"msg": "Manifestation without rest is just work in spiritual clothes.", "by": "Manifestation Guide"}, {"msg": "Change doesn't begin with doing. It begins with believing you're allowed to.", "by": "Manifestation Guide"}, {"msg": "It isn't \"believing and seeing\". It's believing, and <em>then</em> seeing.", "by": "Unknown"}, {"msg": "Pleasure isn't a luxury. Pleasure is frequency.", "by": "Manifestation Guide"}, {"msg": "The right people find you when you're yourself. The wrong ones disappear on their own.", "by": "Manifestation Guide"}, {"msg": "Between longing and receiving lies trust. Not waiting — trusting.", "by": "Manifestation Guide"}, {"msg": "You're not late. You're right on time for your own life.", "by": "Unknown"}, {"msg": "What you can't see may already be on the way.", "by": "Manifestation Guide"}, {"msg": "Be gentle with the version of you still learning.", "by": "Manifestation Guide"}, {"msg": "Stop surviving. Start attuning.", "by": "Manifestation Guide"}, {"msg": "What you say to yourself each morning builds a life.", "by": "Unknown"}, {"msg": "The universe doesn't send letters. It sends feelings.", "by": "Manifestation Guide"}, {"msg": "Enjoying where you are now is the fastest path to where you want to go.", "by": "Abraham Hicks"}, {"msg": "Asking, believing, receiving. Especially the third.", "by": "Manifestation Guide"}, {"msg": "One breath can turn a day around. Move, breathe, recover.", "by": "Manifestation Guide"}, {"msg": "Doubt isn't the absence of belief. It's belief under stress.", "by": "Manifestation Guide"}, {"msg": "Every day is a new offer. What are you saying yes to today?", "by": "Manifestation Guide"}, {"msg": "Manifestation is a dance, not a request.", "by": "Manifestation Guide"}, {"msg": "Be the person you're looking for now.", "by": "Manifestation Guide"}, {"msg": "Magic doesn't ask for perfection. Only for consistency.", "by": "Manifestation Guide"}]}, {"id": "orakel", "naam": "The Oracle", "sub": "A message to reflect on", "kleur": "#c084fc", "type": "oracle", "cards": [{"name": "Letting go", "symbol": "🕊️", "msg": "You're holding on to something that's already gone. The universe can't bring anything new into full hands. Open them."}, {"name": "Beginning", "symbol": "🌱", "msg": "What you're postponing is exactly what you must start. The perfect conditions arrive while walking, not before."}, {"name": "Patience", "symbol": "⏳", "msg": "It's on the way. Don't speed it up by worrying — speed it up by trusting it."}, {"name": "Self-worth", "symbol": "🌹", "msg": "You attract what you think you're worth. The work isn't in doing more — it's in believing you deserve it."}, {"name": "Action", "symbol": "🔥", "msg": "Visualising alone isn't enough. The universe also expects a step from you. Which small action are you avoiding?"}, {"name": "Flow", "symbol": "🌊", "msg": "Stop pushing. The current knows the way. Your job is rowing, not digging the river."}, {"name": "Mirror", "symbol": "🪞", "msg": "What you see in others is a mirror. What irritates you today? There's a message there for yourself."}, {"name": "Value", "symbol": "💎", "msg": "The longing you feel isn't coincidence. You aren't greedy — you're on your way."}, {"name": "Key", "symbol": "🗝️", "msg": "You've already received the answer to your question. Maybe yesterday, maybe a week ago. Look back."}, {"name": "Silence", "symbol": "🌙", "msg": "Not everything asks for action. Sometimes the highest manifestation is: rest and don't decide. Trust the emptiness."}, {"name": "Clarity", "symbol": "☀️", "msg": "You know the answer. You doubt whether you're allowed to know. You are."}, {"name": "Lightness", "symbol": "🍃", "msg": "You've made it too heavy. Pleasure isn't a distraction from manifestation — it's fuel for it."}, {"name": "Transition", "symbol": "🌉", "msg": "You're between two versions of yourself. That feels unstable. That's good news."}, {"name": "Transformation", "symbol": "🦋", "msg": "What looks like loss is a rearrangement. You're not getting less — you're becoming different."}, {"name": "Trust", "symbol": "🌟", "msg": "You've manifested things before. Look back — evidence already surrounds you."}, {"name": "Inner guide", "symbol": "🕯️", "msg": "Stop asking others. Your gut already knows. Listen there."}, {"name": "Tenderness", "symbol": "🌸", "msg": "Be softer with yourself today. Strictness speeds nothing up. Tenderness does."}, {"name": "Balance", "symbol": "⚖️", "msg": "You're giving too much or too little. Investigate which side tips — and restore balance."}, {"name": "Focus", "symbol": "🎯", "msg": "You're spreading energy across too many longings. Pick one. The rest comes later."}, {"name": "Hope", "symbol": "🌈", "msg": "After rain, light. You're closer to something beautiful than you can see."}, {"name": "Message", "symbol": "🪶", "msg": "Watch for signs this week. A word, a song, a chance meeting. The universe is speaking."}, {"name": "Change", "symbol": "🌬️", "msg": "Something new is blowing in. Don't cling to how it was. Stretch your arms."}, {"name": "Light", "symbol": "🌻", "msg": "Turn to what feeds you, not what drains you. Choosing light isn't selfish."}, {"name": "Path", "symbol": "🛤️", "msg": "You stand at a crossroads. Both paths are good — but one feels true. Follow feeling, not logic."}, {"name": "Harvest", "symbol": "🌾", "msg": "What you receive now is the harvest of what you sowed a while back. Be grateful — and sow consciously for later."}, {"name": "Peace", "symbol": "🕊️", "msg": "Stop waging an inner war against where you are. Acceptance isn't surrender — it's the gateway."}, {"name": "Authenticity", "symbol": "🎭", "msg": "You carry a mask that's grown heavy. What if you took it off this week — with one person?"}, {"name": "Shadow", "symbol": "🌑", "msg": "You're avoiding something in yourself. But what you don't face keeps steering. One honest moment with yourself opens everything."}, {"name": "Height", "symbol": "🏔️", "msg": "You're further than you think. Stop looking at what's left — look at what you've already climbed."}, {"name": "Bloom", "symbol": "🪷", "msg": "Beautiful things often grow from mud. Your hardest period is the seedbed of something gorgeous."}, {"name": "Answer", "symbol": "💌", "msg": "What you're asking is already answered. Not in words — in a feeling that lingers. Trust that."}, {"name": "Fire", "symbol": "🌋", "msg": "Something is brewing in you that wants out. Don't suppress it any longer. Creativity, anger, longing — give it air."}, {"name": "Direction", "symbol": "🧭", "msg": "You aren't lost, you're orienting. Pause. Breathe. The next step will become clear."}, {"name": "Pleasure", "symbol": "🌺", "msg": "Pleasure isn't a luxury. It's a frequency. Doing something today purely for its beauty — that's manifesting."}, {"name": "Steadiness", "symbol": "🪨", "msg": "You have more foundation than you feel. Beneath the doubt lies something that doesn't waver. Stand there a moment."}, {"name": "Longing", "symbol": "🌠", "msg": "What you really want isn't coincidence. Longing points — like a compass needle — towards who you may become."}, {"name": "Letting go 2.0", "symbol": "🫧", "msg": "Not everything you let go is loss. Some things had long been gone — you were only holding on to the idea."}, {"name": "Roots", "symbol": "🌳", "msg": "You don't always have to grow. Sometimes it's time to let your roots go deeper, right where you are."}, {"name": "Grace", "symbol": "🦢", "msg": "Be gracious with the version of you who made a mistake yesterday. She/he did the best with what she had then."}, {"name": "Halfway", "symbol": "🌗", "msg": "You're halfway through something. It feels uncomfortable, because it's neither a beginning nor an end. That's exactly how transformation feels."}, {"name": "Perspective", "symbol": "🪐", "msg": "Zoom out. What feels overwhelming today will be a chapter in a bigger story a year from now. And you're writing it."}, {"name": "Tenderness 2", "symbol": "🌷", "msg": "Someone around you needs your softness today — maybe that someone is yourself."}, {"name": "Attention", "symbol": "🔔", "msg": "There's a signal you're ignoring. The body, the heart, a friend. Stop. Listen. Otherwise it will get louder."}, {"name": "Intention", "symbol": "🏹", "msg": "Clarity beats motivation. Not working harder — aiming more clearly. What exactly are you aiming at?"}, {"name": "Synchronicity", "symbol": "💫", "msg": "That meeting, that message, that one song playing — it wasn't chance. Follow the threads."}, {"name": "Start of something", "symbol": "🌒", "msg": "Something new has just begun, too small to be visible yet. Protect it from your own impatience."}, {"name": "Letting-go season", "symbol": "🍂", "msg": "Leaves don't fall from failure — they let go to make room. What in your life is at its natural end?"}, {"name": "Anchor", "symbol": "⚓", "msg": "In busy times you need something that doesn't move. A ritual, a person, a place. What is your anchor?"}, {"name": "New day", "symbol": "🌅", "msg": "You get a new try tomorrow morning. Today doesn't have to become perfect. That's a beautiful grace."}, {"name": "Magic", "symbol": "✨", "msg": "You are the magical thing you're searching for. Not in a while, not when everything aligns — now, in this version."}, {"name": "", "symbol": "✦", "msg": "A new door opens."}, {"name": "", "symbol": "✦", "msg": "What ends makes room."}, {"name": "", "symbol": "✦", "msg": "Follow what feels light."}, {"name": "", "symbol": "✦", "msg": "You already know the answer."}, {"name": "", "symbol": "✦", "msg": "Patience — it's still ripening."}, {"name": "", "symbol": "✦", "msg": "Look at what returns."}, {"name": "", "symbol": "✦", "msg": "Your intuition points, not your fear."}, {"name": "", "symbol": "✦", "msg": "Let it flow."}]}, {"id": "engelen", "naam": "Angels & guides", "sub": "Gentle support from your guides", "kleur": "#fde68a", "type": "guide", "cards": [{"msg": "You are carried.", "expl": "Even if you don't feel it, you are not alone. There's more support around you than is visible.", "doing": "Ask silently: \"Let me feel today that I am carried.\" And keep softly noticing."}, {"msg": "Help is on the way.", "expl": "What you've asked has been set in motion — even if you don't see the result yet.", "doing": "Consciously let go of control once today, and trust it will be okay."}, {"msg": "Ask, and it will be given.", "expl": "You don't have to do it alone. Asking for help isn't weakness, it's openness.", "doing": "Speak one concrete question aloud today to your guide or angel."}, {"msg": "Something loving watches over you.", "expl": "A warm presence is closer than you think, especially in your heavier moments.", "doing": "Place a hand on your heart and say: \"I feel that I'm not alone.\""}, {"msg": "Let go of what's heavy.", "expl": "You don't have to keep carrying everything. Some burdens may leave your hands.", "doing": "Breathe out and imagine handing something heavy over to something larger than you."}, {"msg": "You are where you're meant to be.", "expl": "This phase too, with all its uncertainty, belongs to your path.", "doing": "Name one thing you're grateful for, exactly as your life is right now."}, {"msg": "A sign is coming to you.", "expl": "In the coming days watch for repetitions, coincidences, a song, a word.", "doing": "Ask for a specific sign, then let it go."}, {"msg": "Your prayers have been heard.", "expl": "Nothing you've asked from the heart is lost.", "doing": "Write or say: \"Thank you for listening\" — before you see the answer."}, {"msg": "You don't have to understand it.", "expl": "Not every answer comes as words. Sometimes guidance comes as a feeling, a calm, a direction.", "doing": "Today don't ask for explanation, but for a feeling of 'yes' or 'no' about something you're doubting."}, {"msg": "Rest is allowed.", "expl": "Your guides aren't asking you to work harder. They're inviting you to slow down, so you can hear them.", "doing": "Take three minutes of silence today, with no goal. Just being present."}, {"msg": "What you lost wasn't for nothing.", "expl": "Even difficult goodbyes shaped and guided you, even if it seemed meaningless at the time.", "doing": "Name one loss that brought you something in hindsight — even if only wisdom."}, {"msg": "Your intuition is a voice.", "expl": "That soft knowing you often ignore is the very channel through which guidance comes.", "doing": "Follow one small inspiration today, however illogical, and see what happens."}, {"msg": "You are more deeply loved than you know.", "expl": "The love watching over you asks nothing back. You don't have to earn it.", "doing": "Allow yourself to receive: say 'I let myself be loved' and feel if resistance comes up."}, {"msg": "Doubt doesn't mean you're wrong.", "expl": "Standing on a threshold feels uncertain. That's not a sign to turn back, but to breathe through.", "doing": "Name where you're doubting, and ask your guide: 'help me see the next small step.'"}, {"msg": "Your words are heard.", "expl": "Whether you speak aloud or think in silence — someone is listening, without judgment.", "doing": "Speak something aloud today that you normally keep to yourself. One sentence, addressed to your guide."}, {"msg": "Slow down, there's no rush.", "expl": "The urgency you feel often comes from fear, not truth. The right moment arrives on its own.", "doing": "Do one thing slower than usual today, and notice what it does for your calm."}, {"msg": "You may ask for help, again.", "expl": "You don't have to act strong. Asking for support — even for the same thing, again — isn't failure.", "doing": "Today ask for help with something you're ashamed you can't yet do alone."}, {"msg": "A door closes so a better one can open.", "expl": "What ends makes room. Your guides sometimes lead you away from what you thought you wanted.", "doing": "Think of something that recently went wrong, and ask: 'where might this be leading me?'"}, {"msg": "You are not your thoughts.", "expl": "The noise in your head isn't who you are. Beneath it is a quiet place that always stays calm.", "doing": "Breathe in, and on the exhale say: 'I am the silence beneath the thoughts.'"}, {"msg": "Forgive yourself today.", "expl": "You did the best you could with what you knew then. That goes for your yesterday too.", "doing": "Place your hand on your heart and say: 'I forgive myself for what I didn't yet know.'"}, {"msg": "The heaviness is temporary.", "expl": "No night lasts forever. What feels leaden now will shift.", "doing": "Write: 'this will pass.' And let that be enough for today."}, {"msg": "Your heart knows the way.", "expl": "The mind makes lists; the heart points the way. Today, trust the latter.", "doing": "Picture yourself making a choice and notice where your body lightens. That's your answer."}, {"msg": "Someone is coming onto your path.", "expl": "Not all guidance comes from within. Sometimes life sends a person who fits exactly.", "doing": "Today be open to a conversation you'd normally avoid."}, {"msg": "You may make mistakes.", "expl": "No misstep puts you outside the love that carries you. You aren't being judged.", "doing": "Think of a mistake bothering you, and say: 'this also belonged to my learning.'"}, {"msg": "Silence is also an answer.", "expl": "Sometimes there's no sign, and that is the sign: not yet, trust the waiting.", "doing": "Today leave one question unanswered, and practise peace with not knowing."}, {"msg": "You are safer than you feel.", "expl": "Fear magnifies danger. The reality of this moment is usually softer.", "doing": "Look around and name three things that, in this moment, are truly okay."}, {"msg": "Gratitude opens the door.", "expl": "What you appreciate grows. Gratitude isn't a duty, but a key.", "doing": "Name three small things from today you're sincerely grateful for."}, {"msg": "You feel more than you think.", "expl": "Your sensitivity isn't a burden but your antenna. With it you catch the subtle guidance.", "doing": "Today watch for a moment when you feel 'something' without knowing why. Trust it."}, {"msg": "Let yourself be carried, even in joy.", "expl": "Support isn't only for dark days. You may share your happiness too.", "doing": "Silently share a beautiful moment today: 'thank you, this feels good.'"}, {"msg": "The answer lies in the rest.", "expl": "You don't find it by searching harder, but by pausing the search.", "doing": "Pose your question, then do something relaxing. Let the answer come to you."}, {"msg": "You may begin again.", "expl": "Every moment is a new threshold. What was yesterday doesn't have to determine today.", "doing": "Choose one thing you'll do differently today than usual, however small."}, {"msg": "Your boundaries are sacred.", "expl": "Saying no is also a form of self-respect. Your guides cheer for your boundaries.", "doing": "Today say 'no' once without apologising."}, {"msg": "It comes in a way different from what you thought.", "expl": "What you asked can come through an unexpected door. Don't stare rigidly in one direction.", "doing": "Today release <em>how</em> your longing should come true, and stay open to surprise."}, {"msg": "You are enough, right now.", "expl": "You don't have to first be better, stronger or further to be worthy of support and love.", "doing": "Say: 'I am enough, right now' — and notice what stirs in you."}, {"msg": "Tears may flow.", "expl": "Crying isn't weakness but a cleansing. Your guides hold you when you break.", "doing": "Today give your sadness room, even briefly, without pushing it away."}, {"msg": "You may share a burden.", "expl": "You don't have to carry everything alone. Hand a piece to something larger.", "doing": "Imagine placing one worry into hands stronger than yours."}, {"msg": "You're doing better than you think.", "expl": "You're hard on yourself. From a distance you're getting further than you realise.", "doing": "Name three things you've done well lately, however small."}, {"msg": "You are being cared for.", "expl": "Even in uncertainty there's a thread that carries your life. You won't fall through the net.", "doing": "Today trust that one thing you're worrying about will be okay."}, {"msg": "Listen to your body.", "expl": "Fatigue, tension, unrest — they are messengers. Your body speaks for your soul.", "doing": "Ask your body: 'what do you need now?' and give it, even just partially."}, {"msg": "The light is closer than you think.", "expl": "Right when it feels darkest, you're often just before the breakthrough.", "doing": "Today keep going with something you almost wanted to stop. One step more."}, {"msg": "Your past doesn't define you.", "expl": "What happened to you isn't who you are. You may free yourself from old stories.", "doing": "Name one story about yourself that's no longer true, and let it go today."}, {"msg": "Ask for a dream.", "expl": "In your sleep the channel stands wide open. Guidance often comes through images in the night.", "doing": "Before sleeping pose a question, and write down in the morning what you remember."}, {"msg": "You may learn it slowly.", "expl": "Growth isn't a race. Your guides have infinite patience with your pace.", "doing": "Today be gentle about something you 'should have been able to do by now.'"}, {"msg": "Joy is also a prayer.", "expl": "Fun, laughter, enjoyment — they are ways of feeling connection, just as much as silence.", "doing": "Today consciously do something purely because it makes you happy, with no purpose."}, {"msg": "You are in the right place.", "expl": "Even if it doesn't feel like you'd hoped, this moment is part of the route.", "doing": "Say: 'I am exactly where I need to be to see the next step.'"}, {"msg": "It may go easily.", "expl": "Not everything has to be a struggle. Sometimes the way is open and you may simply walk it.", "doing": "Today choose the easy way at something, without guilt that it was too simple."}, {"msg": "You are a channel of love.", "expl": "The warmth you feel for others flows through you from a greater source.", "doing": "Today silently send warmth to someone, and feel how it fills you too."}, {"msg": "Don't wait until you're ready.", "expl": "You'll never feel completely ready. Begin with trembling hands — that's allowed.", "doing": "Today take one step toward something you feel 'not ready' for."}, {"msg": "Your prayer doesn't have to be beautiful.", "expl": "You may ask messily, angrily or confusedly. Honesty counts more than tidy words.", "doing": "Say exactly what's in your heart, even if it sounds ugly. It is heard."}, {"msg": "There's more in store for you.", "expl": "What you know now isn't the whole picture. Your life has chapters you haven't seen yet.", "doing": "Be open to the idea that the most beautiful hasn't happened yet."}, {"msg": "Return to your breath.", "expl": "When everything becomes too much, your breath is the way back to now, and to connection.", "doing": "Today breathe deeply three times consciously when you notice you're getting distracted."}]}, {"id": "overvloed", "naam": "Abundance", "sub": "Receiving without guilt", "kleur": "#6ee7b7", "type": "guide", "cards": [{"msg": "You may receive.", "expl": "Abundance isn't a reward for perfection. It's your right, simply because you exist.", "doing": "Say aloud: \"I may receive\" and notice what resistance comes — and let it be soft."}, {"msg": "Money is energy.", "expl": "It may flow, like breath or water. Asking for it isn't greedy.", "doing": "Visualise money coming to you with ease, without earning it through exhaustion."}, {"msg": "Longing isn't guilt.", "expl": "Wanting what you want is your life growing, not your ego conquering.", "doing": "Name one longing you usually push away, and give it the right to exist today."}, {"msg": "There is enough, and you belong.", "expl": "Abundance isn't a pie you take from others. There's room for everyone, including you.", "doing": "Replace one \"I'm not allowed\" with \"I'm allowed too\"."}, {"msg": "Open your hands.", "expl": "With clenched fists you can receive nothing. Receiving asks openness.", "doing": "Sit with open hands on your lap and breathe calmly — a posture of receiving."}, {"msg": "You deserve space and freedom.", "expl": "Comfort and ease aren't shallow; they give you the calm to live and give.", "doing": "Today allow yourself one small moment of comfort, consciously and without guilt."}, {"msg": "What you give returns.", "expl": "Giving from abundance (not from exhaustion) sets a stream in motion.", "doing": "Today give something small with an open heart — and receive something too."}, {"msg": "The flow has already begun.", "expl": "You don't have to force it. Trust that it's already in motion.", "doing": "Thank in advance for what's on the way, as if it's already here."}, {"msg": "Money may be your friend.", "expl": "You don't have to fight with money. It may become a calm, friendly presence.", "doing": "Today speak one neutral, friendly sentence about money instead of a worry."}, {"msg": "Your wealth is more than your balance.", "expl": "Time, health, people, rest — abundance has many forms with no price tag.", "doing": "Name three forms of wealth in your life that have nothing to do with money."}, {"msg": "Receiving isn't owing.", "expl": "Accepting something — help, a gift, a compliment — obliges you to nothing. You may simply keep it.", "doing": "Today receive something fully, without immediately wanting to give back."}, {"msg": "There's more where that came from.", "expl": "What you once received wasn't chance or last chance. The source hasn't dried up.", "doing": "Today trust that what you need can come to you again."}, {"msg": "You deserve ease.", "expl": "It doesn't have to be heavy to be valuable. Ease isn't laziness but grace.", "doing": "Today consciously choose the easy way for something, and feel that's okay."}, {"msg": "Prosperity begins within.", "expl": "A feeling of enough attracts more than a feeling of lack. It begins in you.", "doing": "Before you buy or plan something, say: 'there is enough, and I belong to the abundance.'"}, {"msg": "You may long greatly.", "expl": "Dreaming small doesn't protect you. You may long for a spacious, full life.", "doing": "Write one longing that you normally find too big to say aloud."}, {"msg": "Giving doesn't make you poorer.", "expl": "Generosity from abundance (not from duty or emptiness) keeps the flow open.", "doing": "Today give something away — money, time, attention — from the feeling: there is enough."}, {"msg": "Your worth isn't your performance.", "expl": "You don't have to earn to be valuable. You already are, even on lazy days.", "doing": "Say: 'my worth doesn't depend on what I produce today.'"}, {"msg": "Abundance houdt van vreugde.", "expl": "What you do with pleasure attracts more than what you force with reluctance.", "doing": "Today do something related to money or work in a way you enjoy."}, {"msg": "You may be rich <em>and</em> good.", "expl": "Prosperity doesn't make you greedy. With more you can also mean more to others.", "doing": "Imagine what you'd do for others if you had ample resources."}, {"msg": "Scarcity is a thought, not a fact.", "expl": "The idea 'there isn't enough' is often an old fear, not the truth of this moment.", "doing": "Today catch one scarcity-thought and ask: 'is that really true now?'"}, {"msg": "You don't have to exhaust yourself.", "expl": "Working hard until you're empty isn't a condition for abundance. Rest belongs too.", "doing": "Today grant yourself rest without thinking you have to 'earn' it first."}, {"msg": "The universe knows no shortage.", "expl": "There's no fixed pie you take from others. Your happiness takes nothing from anyone.", "doing": "Today sincerely rejoice in someone else's success."}, {"msg": "You may ask for what you need.", "expl": "Asking isn't weakness or pushiness. It's being clear about what you want.", "doing": "Today concretely ask for something you need, without apologising."}, {"msg": "Money flows to those who welcome it.", "expl": "An open, relaxed posture attracts more than clinging from fear.", "doing": "Today consciously relax your shoulders when you think of money. Welcome instead of cling."}, {"msg": "Your future may be light.", "expl": "You don't have to expect the worst to be prepared. Expect the good too.", "doing": "Imagine it going better in a year than you dare to hope now."}, {"msg": "Comfort isn't betrayal.", "expl": "Enjoying something nice doesn't mean you're shallow. You may have it nice.", "doing": "Today consciously enjoy one comfort, without guilt or haste."}, {"msg": "You are worth caring for.", "expl": "Taking good care of yourself — with money and time too — isn't selfish but foundation.", "doing": "Today do one thing that's an investment in yourself."}, {"msg": "Abundance begint met merken.", "expl": "You already have more than you see. Attention to what's here magnifies it.", "doing": "Walk through your home and notice three things already making your life rich."}, {"msg": "You don't have to live frugally to be good.", "expl": "Frugality is a choice, not a moral duty. You may also live generously.", "doing": "Today allow yourself something you normally think 'that's too much.'"}, {"msg": "What you appreciate multiplies.", "expl": "Attention is like water on a plant. What you look at gratefully grows.", "doing": "Today thank aloud for something you already have, as if it's precious."}, {"msg": "Money is neutral.", "expl": "It's not good or bad — it's energy that takes form through how you use it.", "doing": "Today release one judgment about money: 'rich = greedy' or 'poor = noble.'"}, {"msg": "You deserve more than survival.", "expl": "Life isn't meant to be just getting by. You may also bloom and enjoy.", "doing": "Name one way your life could be more than just 'getting by.'"}, {"msg": "Receiving asks surrender.", "expl": "You can't cling and receive at the same time. Open hands require trust.", "doing": "Today release control over <em>how</em> something good comes to you."}, {"msg": "You may enjoy what you have.", "expl": "Saving for later is good, but life happens now. Enjoying isn't waste.", "doing": "Today use something 'good' you've been saving for a special occasion."}, {"msg": "Your prosperity helps others.", "expl": "The more you have and the more peace you feel, the more you can give, share and lift.", "doing": "Imagine how much good you could do from a place of abundance."}, {"msg": "It may come without reason.", "expl": "Not every good thing has to be earned. Sometimes abundance simply comes, as a gift.", "doing": "Today be open to a windfall you haven't 'earned.'"}, {"msg": "Your fear of shortage may rest.", "expl": "The fear it'll run out often comes from the past, not now. You are safe.", "doing": "When the scarcity-fear comes up, place your hand on your belly and breathe: 'there is enough.'"}, {"msg": "Don't compare yourself away.", "expl": "What another has says nothing about what's meant for you. Your stream is your own.", "doing": "Today stop one comparison, and focus on your own path."}, {"msg": "You're allowed to have it good.", "expl": "Happiness isn't betrayal to those struggling. Your suffering helps no one.", "doing": "Today allow yourself to be happy, without guilt that others struggle."}, {"msg": "Abundance is also time.", "expl": "Free time, room to breathe, moments of nothing — that's the purest kind of wealth.", "doing": "Today claim a half hour that's entirely yours, with no use."}, {"msg": "You deserve beautiful things.", "expl": "Beauty around you nourishes you. You don't have to justify it.", "doing": "Today surround yourself with something beautiful — a flower, music, light — purely for yourself."}, {"msg": "Ask bigger than you're used to.", "expl": "You often ask too modestly, from fear of disappointment. Dare to ask more broadly.", "doing": "In your mind double one wish, and see if you can bear it."}, {"msg": "Your relationship with money may heal.", "expl": "Old pain around money — shame, conflict, lack — you may leave behind.", "doing": "Write one sentence about money from your youth you no longer want to carry."}, {"msg": "Enough is a feeling, not an amount.", "expl": "No amount guarantees 'enough'. Enough arises from within.", "doing": "Today, at something ordinary, say: 'this is enough' — and feel if it fits."}, {"msg": "You may take up space.", "expl": "You don't have to make yourself small to be loved. Living large is allowed.", "doing": "Today consciously take a little more space — in a conversation, a room, a choice."}, {"msg": "The world wants to give to you.", "expl": "Life isn't set up stingy against you. There's a tendency toward bloom, for you too.", "doing": "Today expect something good, simply because it can happen."}, {"msg": "You deserve help and support.", "expl": "Carrying everything alone isn't virtue. Receiving support is also a form of abundance.", "doing": "Today let someone help you with something, even if you 'could do it yourself.'"}, {"msg": "Gratitude is the shortest path.", "expl": "Nothing opens the flow faster than being sincerely grateful for what's already here.", "doing": "Today begin or end with three things you're grateful for."}, {"msg": "Your abundance is safe to show.", "expl": "You don't have to hide your happiness or prosperity from fear of envy.", "doing": "Today share something good that happened to you, without apologising for it."}, {"msg": "Letting go makes room.", "expl": "Holding on to what you no longer use blocks the flow. Space attracts what's new.", "doing": "Today give or throw away one thing you no longer need."}, {"msg": "You may ask <em>and</em> receive.", "expl": "The circle is only complete if you accept it too. Asking without receiving leaves you empty.", "doing": "If something comes to you today, truly accept it — with a simple 'thank you.'"}]}];
const PATTERN_CARDS = [{"card": "Letting go", "msg": "Something in your life is asking to be released. Not by force, but with an open hand.", "tag": "letting-go"}, {"card": "Trust", "msg": "You're about to force something that would come on its own. Breathe. It's on the way.", "tag": "trust"}, {"card": "Patience", "msg": "What you want is still ripening. That it isn't here doesn't mean it isn't coming.", "tag": "patience"}, {"card": "Receiving", "msg": "Open your hands. Something is coming that you can only catch if you don't grab.", "tag": "receiving"}, {"card": "Courage", "msg": "The fear you feel is a sign that it matters to you. Move, even if you tremble.", "tag": "courage"}, {"card": "Rest", "msg": "You don't have to achieve anything today. The silence itself is the work.", "tag": "rest"}, {"card": "Abundance", "msg": "There is more than enough. Give something away and feel the flow restart.", "tag": "abundance"}, {"card": "Clarity", "msg": "You actually already know what you want. Stop talking yourself into doubt.", "tag": "clarity"}, {"card": "Signs", "msg": "Watch softly in the coming days. You're being winked at, more often than you think.", "tag": "signs"}, {"card": "Self-worth", "msg": "You may want this. You are worthy, even if an old voice says otherwise.", "tag": "self-worth"}, {"card": "Connection", "msg": "Reach out to someone today. The bridge you're seeking goes through another.", "tag": "connection"}, {"card": "Inspired action", "msg": "A small step is presenting itself. Don't postpone — do it today.", "tag": "action"}, {"card": "Gratitude", "msg": "Briefly count what's already here. From enough you attract more strongly than from lack.", "tag": "gratitude"}, {"card": "Forgiveness", "msg": "Someone — maybe yourself — is still waiting for your forgiveness. It's for your peace.", "tag": "forgiveness"}, {"card": "Protection", "msg": "Protect what's still tender. Not every dream belongs out loud, not yet.", "tag": "protection"}, {"card": "Timing", "msg": "The detour isn't a mistake. Trust a plan you can't yet oversee.", "tag": "timing"}, {"card": "Embodiment", "msg": "Be now who you want to become. Circumstances follow who you are, not the other way around.", "tag": "embodiment"}, {"card": "Space", "msg": "Empty something — a drawer, a schedule, a thought. The new needs room.", "tag": "space"}];
</script>
<script>
  // mock storage for the standalone demo
  if(!window.storage){ const mem={}; window.storage={get:async k=>mem[k]!==undefined?{value:mem[k]}:null,set:async(k,v)=>{mem[k]=v;return{value:v};},delete:async k=>{delete mem[k];},list:async p=>({keys:Object.keys(mem).filter(k=>k.startsWith(p||''))})}; }

  let currentDeck = DECKS[0];
  let currentCard = null, flipped = false;

  function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  function renderDecks(){
    const row = document.getElementById('deck-row');
    row.innerHTML = DECKS.map((d,i)=>`
      <button class="deck-btn ${d.id===currentDeck.id?'active':''}" onclick="pickDeck(${i})">
        <div class="dn"><span class="dot" style="background:${d.kleur}"></span>${esc(d.naam)}</div>
        <div class="ds">${esc(d.sub)}</div>
        <div class="dc">${d.cards.length} kaarten</div>
      </button>`).join('');
  }
  function pickDeck(i){
    currentDeck = DECKS[i];
    document.getElementById('card').classList.remove('flipped'); flipped=false; currentCard=null;
    document.getElementById('draw-btn').textContent='Draw a card';
    renderDecks();
  }
  function flipCard(){ if(!currentCard) return; flipped=!flipped; document.getElementById('card').classList.toggle('flipped',flipped); }

  async function drawCard(){
    const d = currentDeck;
    const card = d.cards[Math.floor(Math.random()*d.cards.length)];
    currentCard = card;
    document.getElementById('c-sym').textContent = card.symbol || '';
    document.getElementById('c-name').textContent = card.name || '';
    document.getElementById('c-msg').textContent = card.msg || '';
    document.getElementById('c-expl').textContent = card.expl || '';
    document.getElementById('c-doing').textContent = card.doing ? ('✦ '+card.doing) : '';
    document.getElementById('c-by').textContent = card.by ? ('— '+card.by) : '';
    const c=document.getElementById('card');
    c.classList.remove('flipped'); flipped=false;
    setTimeout(()=>{ c.classList.add('flipped'); flipped=true; },80);
    document.getElementById('draw-btn').textContent='Draw again';

    // save draw (per deck) for pattern detection on the Oracle
    const tag = matchTag((card.name||'') + ' ' + (card.msg||''));
    const h = await getHist();
    h.push({ ts:Date.now(), deck:d.id, deckNaam:d.naam, name:card.name||(card.msg.slice(0,24)+'…'), tag });
    await setHist(h);
    setTimeout(()=>renderInsight(h),850);
    renderHist(h);
  }

  // associate a theme tag based on keywords (for pattern detection)
  // Card names themselves are often the theme, so they weigh in.
  const TAGWORDS = {
    'letting-go':['letting go','let go','holding on','full hands','mask','transition','rearrangement','stretch your arms','natural end'],
    trust:['trust','believe','on the way','steadiness','foundation','hope','anchor'],
    patience:['patience','timing','ripening','wait','bloom','grows','protect it','hurry'],
    receiving:['receive','open hands','abundance','enough','money','harvest'],
    courage:['courage','fear','dare','afraid','fire','shadow','face'],
    rest:['rest','silence','do not decide','emptiness','peace','acceptance','tenderness','softer','grace'],
    'self-worth':['worth','deserve','self-worth','authenticity','greedy','magical thing'],
    action:['action','step','avoiding','move','start','begin','inspired'],
    clarity:['clear','know the answer','answer','focus','choose','crossroads','path','longing','compass','direction'],
    'self-care':['feeds','drains','light','pleasure','lightness','balance','mirror','perspective','climbed']
  };
  function matchTag(text){
    const t=(text||'').toLowerCase();
    for(const [tag,words] of Object.entries(TAGWORDS)){ if(words.some(w=>t.includes(w))) return tag; }
    return 'general';
  }

  async function getHist(){ try{const r=await window.storage.get('kaarten:hist'); if(r) return JSON.parse(r.value);}catch(e){} return []; }
  async function setHist(h){ try{await window.storage.set('kaarten:hist', JSON.stringify(h.slice(-60)));}catch(e){} }

  function fmtShort(ts){const d=new Date(ts);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});}

  function renderInsight(h){
    const box=document.getElementById('insight');
    if(h.length<3){ box.innerHTML=''; return; }
    const recent=h.slice(-7);
    const counts={};
    recent.forEach(x=>{ if(x.tag&&x.tag!=='algemeen'&&x.tag!=='general') counts[x.tag]=(counts[x.tag]||0)+1; });
    const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    if(!sorted.length){ box.innerHTML=''; return; }
    const [tag,n]=sorted[0];
    const woord=({
      'letting-go':'letting go','self-worth':'your self-worth','self-care':'self-care',action:'taking action',
      loslaten:'letting go',vertrouwen:'trust',geduld:'patience',ontvangen:'receiving',moed:'courage',
      rust:'rest',eigenwaarde:'your self-worth',actie:'taking action',helderheid:'clarity',zelfzorg:'self-care'
    })[tag]||tag;
    let body;
    if(n>=3) body=`<p>The cards keep bringing you back to <span class="pat">${esc(woord)}</span>. Three or more times in your last draws. That truly asks your attention now.</p>`;
    else if(n===2) body=`<p>Lately you've been drawing more often around <span class="pat">${esc(woord)}</span>. Something in you knows what it's about.</p>`;
    else body=`<p>Your draws are varied. The thread now lies mainly in <span class="pat">${esc(woord)}</span>.</p>`;
    box.innerHTML=`<div class="insight"><div class="tag">What the cards see in you</div>${body}</div>`;
  }
  function renderHist(h){
    const lab=document.getElementById('hist-label'), wrap=document.getElementById('hist');
    if(!h.length){ lab.style.display='none'; wrap.innerHTML=''; return; }
    lab.style.display='block';
    wrap.innerHTML=h.slice().reverse().slice(0,12).map(x=>`<div class="hrow"><span class="hd">${fmtShort(x.ts)}</span><span class="hc">${esc(x.name)}</span><span class="hk">${esc(x.deckNaam)}</span></div>`).join('');
  }

  renderDecks();
  (async()=>{ const h=await getHist(); renderHist(h); if(h.length>=3) renderInsight(h); })();
</script>
